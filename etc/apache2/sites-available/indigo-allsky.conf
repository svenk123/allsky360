Define DOCUMENTROOT /var/www/html
Define ALLSKY_DIR ${DOCUMENTROOT}/indigo-allsky

<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot ${DOCUMENTROOT}
    #Redirect permanent / https://your-domain.de/

    Alias /indigo-allsky/ "${ALLSKY_DIR}/"

    <Directory "${ALLSKY_DIR}/">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/allsky_error.log
    CustomLog ${APACHE_LOG_DIR}/allsky_access.log combined
</VirtualHost>
