Define DOCUMENTROOT /var/www/html
Define ALLSKY_DIR ${DOCUMENTROOT}/indigo-allsky

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerAdmin webmaster@localhost
    DocumentRoot ${DOCUMENTROOT}

    Alias /indigo-allsky/ "${ALLSKY_DIR}/"

    <Directory "${ALLSKY_DIR}/">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/allsky_error_ssl.log
    CustomLog ${APACHE_LOG_DIR}/allsky_access_ssl.log combined

    SLEngine on
    SSLCertificateFile    /etc/ssl/certs/allsky.crt
    SSLCertificateKeyFile /etc/ssl/private/allsky.key
</VirtualHost>
</IfModule>
