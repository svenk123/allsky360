<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Allsky360 – Config</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Allsky360 Config">
  <meta name="theme-color" content="#0d1117" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <script src="js/allsky-common.js"></script>

  <link rel="stylesheet" href="allsky.css">
  <style>
    /* ── CONFIG MAIN ────────────────────────────────────────────── */
    #config-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── SERVICES HINT (service control is on status.html) ─────── */
    #services-hint {
      font-size: 11px; color: #6b7280;
      padding: 8px 14px; border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    #services-hint a { color: #3b82f6; text-decoration: none; }

    /* ── CONFIG AREA ────────────────────────────────────────────── */
    #config-area {
      flex: 1;
      min-height: 0;
      display: flex;
      gap: 10px;
      padding: 8px 10px 10px;
    }

    /* ── CATEGORY NAV ───────────────────────────────────────────── */
    #cat-nav {
      width: 158px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
      overflow-y: auto;
    }
    .cat-section-label {
      font-size: 9px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.1em; color: #4b5563;
      padding: 8px 8px 3px;
    }
    .cat-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 8px;
      border-radius: 8px;
      font-size: 11px; font-weight: 600;
      color: #6b7280;
      cursor: pointer;
      transition: all 0.14s;
      user-select: none;
    }
    .cat-item:hover { background:rgba(255,255,255,0.07); color:#c9d1d9; }
    .cat-item.active { background:rgba(59,130,246,0.15); color:#3b82f6; }
    .cat-count {
      font-size: 9px; font-weight: 500;
      background: rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 1px 5px;
      min-width: 20px;
      text-align: center;
    }
    .cat-item.active .cat-count { background: rgba(59,130,246,0.2); }

    /* ── CONFIG CENTER ──────────────────────────────────────────── */
    #config-center {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    #search-wrap {
      flex-shrink: 0;
      position: relative;
    }
    #search-wrap svg {
      position: absolute;
      left: 9px; top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
    }
    #config-search {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 10px;
      padding: 6px 10px 6px 30px;
      color: #e5e7eb;
      font-size: 12px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }
    #config-search:focus { border-color: rgba(59,130,246,0.4); }
    #config-search::placeholder { color: #4b5563; }

    #config-list-wrap {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }
    #config-list { display: flex; flex-direction: column; gap: 1px; }

    .cfg-group-label {
      font-size: 9px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.1em; color: #4b5563;
      padding: 8px 8px 3px;
    }
    .cfg-item {
      display: grid;
      grid-template-columns: minmax(180px, 260px) 1fr;
      align-items: center;
      padding: 5px 8px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.12s;
      border: 1px solid transparent;
      gap: 8px;
    }
    .cfg-item:hover { background: rgba(255,255,255,0.05); }
    .cfg-item.selected {
      background: rgba(59,130,246,0.1);
      border-color: rgba(59,130,246,0.28);
    }
    .cfg-key {
      font-size: 11px; font-weight: 600;
      color: #60a5fa;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .cfg-value {
      font-size: 11px; color: #9ca3af;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .cfg-empty {
      color: #4b5563; font-size: 12px;
      padding: 20px 8px; text-align: center;
    }

    /* ── DETAIL PANEL ───────────────────────────────────────────── */
    #detail-panel {
      width: 280px;
      flex-shrink: 0;
      background: rgba(22,27,34,0.85);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px;
      padding: 14px 14px 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .detail-hint {
      color: #4b5563;
      font-size: 12px;
      text-align: center;
      margin-top: 28px;
      line-height: 1.7;
    }
    #detail-key-name {
      font-size: 12px; font-weight: 700;
      color: #60a5fa;
      word-break: break-all;
      margin-bottom: 3px;
    }
    #detail-key-value {
      font-size: 11px; color: #9ca3af;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      word-break: break-all;
    }
    .detail-row {
      padding: 7px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-label {
      font-size: 9px; text-transform: uppercase;
      letter-spacing: 0.1em; color: #6b7280;
      font-weight: 700; margin-bottom: 3px;
    }
    .detail-val { font-size: 12px; color: #e5e7eb; line-height: 1.5; }
    .detail-val.mono { font-family: 'Fira Mono', 'Consolas', monospace; font-size: 11px; color: #a3e635; }
  </style>
</head>

<body>
  <!-- allsky-common.js click handler requires these elements -->
  <div id="nav-menu"           style="display:none;"></div>
  <div id="hamburger-menu-btn" style="display:none;"></div>

  <!-- ═══════════════════ HEADER ════════════════════════════════════ -->
  <header id="app-header">
    <a class="hdr-brand" href="dashboard.html">
      <img src="allsky360_256x256.png" alt="Allsky360" width="30" height="30" />
      <div class="hdr-brand-text">
        <div class="hdr-title">Allsky360</div>
        <div class="hdr-crumb">Config · System Configuration</div>
      </div>
    </a>
    <div class="hdr-badges">
    </div>
  </header>

  <!-- ═══════════════════ MAIN LAYOUT ═══════════════════════════════ -->
  <div id="main-layout">

    <!-- ── ICON NAV ─────────────────────────────────────────────── -->
    <nav id="icon-nav"></nav>
    <script>renderIconNav();</script>

    <!-- ── CONFIG MAIN ────────────────────────────────────────────── -->
    <main id="config-main">

      <div id="services-hint">Services, timers and system health: <a href="status.html">System Status →</a></div>

      <!-- Config area -->
      <div id="config-area">

        <!-- Category nav -->
        <nav id="cat-nav">
          <!-- Built by JS -->
        </nav>

        <!-- Center: search + list -->
        <div id="config-center">
          <div id="search-wrap">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="config-search" placeholder="Search parameters…" autocomplete="off" />
          </div>
          <div id="config-list-wrap">
            <div id="config-list">
              <div class="cfg-empty">Loading configuration…</div>
            </div>
          </div>
        </div>

        <!-- Detail panel -->
        <div id="detail-panel">
          <p class="detail-hint">Click on a parameter<br>to see its description.</p>
        </div>

      </div><!-- #config-area -->

    </main>

  </div><!-- #main-layout -->

  <script>
    // ══════════════════════════════════════════════════════════════
    //  CATEGORIES
    // ══════════════════════════════════════════════════════════════
    const CATEGORY_DEFS = [
      { id: 'all',        label: 'All Parameters' },
      { id: 'location',   label: 'Location' },
      { id: 'connection', label: 'Connection' },
      { id: 'camera',     label: 'Camera' },
      { id: 'daytime',    label: 'Daytime' },
      { id: 'nighttime',  label: 'Nighttime' },
      { id: 'exposure',   label: 'Exposure & HDR' },
      { id: 'filters',    label: 'Filters' },
      { id: 'image',      label: 'Image & Output' },
      { id: 'panorama',   label: 'Panorama' },
      { id: 'sqm',        label: 'Sky Quality' },
      { id: 'storage',    label: 'Storage' },
      { id: 'weather',    label: 'Weather Sensor' },
      { id: 'debug',      label: 'Debug' },
    ];

    function getCategory(key) {
      const loc  = ['latitude','longitude','altitude','city','sunangle','owner'];
      const conn = ['indigoservername','indigoserver','indigoport','indigocamera','debayer','indigo_capture_timeout','capture_interval'];
      const exp  = ['measure_brightness_area','target_mean','black_clipping_point','white_clipping_point','median_brightness'];
      const flt  = ['gamma','saturation'];
      if (loc.includes(key))  return 'location';
      if (conn.includes(key)) return 'connection';
      if (exp.includes(key))  return 'exposure';
      if (flt.includes(key))  return 'filters';
      if (key.startsWith('camera_'))           return 'camera';
      if (key.startsWith('daytime_'))          return 'daytime';
      if (key.startsWith('nighttime_'))        return 'nighttime';
      if (key.startsWith('hdr') || key.startsWith('autostretch')) return 'exposure';
      if (key.startsWith('acdnr_') || key.startsWith('clarity_') || key.startsWith('wavelet_') ||
          key.startsWith('scnr_')  || key.startsWith('dehaze_') ) return 'filters';
      if (key.startsWith('image_') || key.startsWith('focus_') || key.startsWith('crop_') ||
          key.startsWith('lens_')  || key.startsWith('png_')   || key.startsWith('jpeg_') ||
          key === 'rotate_image'   || key.startsWith('thumbnail')) return 'image';
      if (key.startsWith('panorama')) return 'panorama';
      if (key.startsWith('sqm'))      return 'sqm';
      if (key.endsWith('_directory')) return 'storage';
      if (key.startsWith('weather_')) return 'weather';
      if (key.startsWith('debug_'))   return 'debug';
      return 'other';
    }

    // ══════════════════════════════════════════════════════════════
    //  STATE
    // ══════════════════════════════════════════════════════════════
    let allConfig   = {};   // { key: value }
    let helpData    = {};   // from config_help.json
    let activeCategory = 'all';
    let selectedKey    = null;

    // ══════════════════════════════════════════════════════════════
    //  CATEGORY NAV
    // ══════════════════════════════════════════════════════════════
    function buildCatNav() {
      const nav = document.getElementById('cat-nav');
      nav.innerHTML = '';

      // Count per category
      const counts = {};
      Object.keys(allConfig).forEach(k => {
        const cat = getCategory(k);
        counts[cat] = (counts[cat] || 0) + 1;
      });
      const total = Object.keys(allConfig).length;

      CATEGORY_DEFS.forEach(def => {
        const count = def.id === 'all' ? total : (counts[def.id] || 0);
        if (def.id !== 'all' && count === 0) return;
        const el = document.createElement('div');
        el.className  = 'cat-item' + (def.id === activeCategory ? ' active' : '');
        el.dataset.cat = def.id;
        el.innerHTML   = `<span>${def.label}</span><span class="cat-count">${count}</span>`;
        el.addEventListener('click', () => {
          activeCategory = def.id;
          document.querySelectorAll('.cat-item').forEach(e => e.classList.remove('active'));
          el.classList.add('active');
          document.getElementById('config-search').value = '';
          renderConfigList();
        });
        nav.appendChild(el);
      });
    }

    // ══════════════════════════════════════════════════════════════
    //  CONFIG LIST
    // ══════════════════════════════════════════════════════════════
    function renderConfigList() {
      const list        = document.getElementById('config-list');
      const searchQuery = document.getElementById('config-search').value.toLowerCase().trim();
      list.innerHTML    = '';

      const entries = Object.entries(allConfig).filter(([key]) => {
        const matchesCat    = activeCategory === 'all' || getCategory(key) === activeCategory;
        const matchesSearch = !searchQuery || key.toLowerCase().includes(searchQuery);
        return matchesCat && matchesSearch;
      });

      if (entries.length === 0) {
        list.innerHTML = '<div class="cfg-empty">No parameters found.</div>';
        return;
      }

      entries.forEach(([key, value]) => {
        const el = document.createElement('div');
        el.className  = 'cfg-item' + (key === selectedKey ? ' selected' : '');
        el.dataset.key = key;
        el.innerHTML   = `<span class="cfg-key">${key}</span><span class="cfg-value">${value}</span>`;
        el.addEventListener('click', () => {
          document.querySelectorAll('.cfg-item').forEach(e => e.classList.remove('selected'));
          el.classList.add('selected');
          selectedKey = key;
          showDetail(key, value);
        });
        list.appendChild(el);
      });
    }

    // ══════════════════════════════════════════════════════════════
    //  DETAIL PANEL
    // ══════════════════════════════════════════════════════════════
    function showDetail(key, value) {
      const panel = document.getElementById('detail-panel');
      const entry = helpData[key];

      let html = `<div id="detail-key-name">${key}</div>`;
      html += `<div id="detail-key-value">Current value: <strong style="color:#e5e7eb">${value}</strong></div>`;

      if (!entry) {
        html += '<p class="detail-hint" style="margin-top:12px">No description available.</p>';
        panel.innerHTML = html;
        return;
      }

      if (entry.description) {
        html += `<div class="detail-row">
          <div class="detail-label">Description</div>
          <div class="detail-val">${entry.description}</div>
        </div>`;
      }
      if (entry.unit) {
        html += `<div class="detail-row">
          <div class="detail-label">Unit</div>
          <div class="detail-val mono">${entry.unit}</div>
        </div>`;
      }
      if (entry.range) {
        html += `<div class="detail-row">
          <div class="detail-label">Range</div>
          <div class="detail-val mono">${entry.range}</div>
        </div>`;
      }
      if (entry.default !== undefined) {
        html += `<div class="detail-row">
          <div class="detail-label">Default</div>
          <div class="detail-val mono">${entry.default}</div>
        </div>`;
      }
      if (entry.recommendations && entry.recommendations.length > 0) {
        html += `<div class="detail-row">
          <div class="detail-label">Recommendations</div>
          <div class="detail-val">${entry.recommendations.map(r => `• ${r}`).join('<br>')}</div>
        </div>`;
      }

      panel.innerHTML = html;
    }

    // ══════════════════════════════════════════════════════════════
    //  INIT
    // ══════════════════════════════════════════════════════════════
    async function init() {

      try {
        const [cfgRes, helpRes] = await Promise.all([
          fetch('api/config'),
          fetch('config_help.json')
        ]);
        allConfig = await cfgRes.json();
        helpData  = await helpRes.json();
      } catch (err) {
        document.getElementById('config-list').innerHTML =
          '<div class="cfg-empty">Failed to load configuration.</div>';
        console.error(err);
        return;
      }

      buildCatNav();
      renderConfigList();

      document.getElementById('config-search').addEventListener('input', () => {
        // When searching, switch to 'all' category
        if (document.getElementById('config-search').value.trim()) {
          activeCategory = 'all';
          document.querySelectorAll('.cat-item').forEach(e => {
            e.classList.toggle('active', e.dataset.cat === 'all');
          });
        }
        renderConfigList();
      });
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>

</body>

</html>
