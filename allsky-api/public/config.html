<html lang="en">

<head>

  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />

  <script src="js/allsky-common.js"></script>

  <link rel="stylesheet" href="allsky.css">
  <style>
    /* ── CONFIG MAIN ────────────────────────────────────────────── */
    #config-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── SERVICES ROW ───────────────────────────────────────────── */
    #services-row {
      display: flex;
      align-items: stretch;
      gap: 8px;
      padding: 10px 10px 0;
      flex-shrink: 0;
    }
    .svc-card {
      flex: 1;
      min-width: 0;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 9px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: border-color 0.2s;
    }
    .svc-card.running { border-color: rgba(34,197,94,0.25); }
    .svc-card.stopped { border-color: rgba(239,68,68,0.2); }
    .svc-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      background: #4b5563;
      transition: background 0.3s, box-shadow 0.3s;
    }
    .svc-dot.running { background: #22c55e; box-shadow: 0 0 8px rgba(34,197,94,0.5); }
    .svc-dot.stopped { background: #ef4444; }
    .svc-dot.loading {
      background: #6b7280;
      animation: pulse-dot 1.2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .svc-info { flex: 1; min-width: 0; }
    .svc-name {
      font-size: 12px; font-weight: 700;
      color: #e5e7eb;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .svc-status-text {
      font-size: 10px; color: #6b7280; margin-top: 2px;
    }
    .svc-btns { display: flex; gap: 4px; flex-shrink: 0; }
    .svc-btn {
      padding: 3px 9px;
      border-radius: 7px;
      font-size: 10px; font-weight: 600;
      cursor: pointer; font-family: inherit;
      transition: all 0.15s;
    }
    .svc-btn-start   { background:rgba(34,197,94,0.12);  color:#22c55e; border:1px solid rgba(34,197,94,0.28); }
    .svc-btn-start:hover   { background:rgba(34,197,94,0.25); }
    .svc-btn-stop    { background:rgba(239,68,68,0.12);  color:#ef4444; border:1px solid rgba(239,68,68,0.28); }
    .svc-btn-stop:hover    { background:rgba(239,68,68,0.25); }
    .svc-btn-restart { background:rgba(234,179,8,0.12);  color:#eab308; border:1px solid rgba(234,179,8,0.28); }
    .svc-btn-restart:hover { background:rgba(234,179,8,0.25); }
    .svc-btn:disabled { opacity: 0.4; cursor: default; }

    /* ── MSG BAR ────────────────────────────────────────────────── */
    #msg-bar {
      min-height: 20px;
      padding: 3px 10px 0;
      font-size: 10px;
      color: #6b7280;
      flex-shrink: 0;
    }
    #msg-bar.ok  { color: #22c55e; }
    #msg-bar.err { color: #ef4444; }

    /* ── CONFIG AREA ────────────────────────────────────────────── */
    #config-area {
      flex: 1;
      min-height: 0;
      display: flex;
      gap: 10px;
      padding: 8px 10px 10px;
    }

    /* ── CATEGORY NAV ───────────────────────────────────────────── */
    #cat-nav {
      width: 158px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
      overflow-y: auto;
    }
    .cat-section-label {
      font-size: 9px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.1em; color: #4b5563;
      padding: 8px 8px 3px;
    }
    .cat-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 8px;
      border-radius: 8px;
      font-size: 11px; font-weight: 600;
      color: #6b7280;
      cursor: pointer;
      transition: all 0.14s;
      user-select: none;
    }
    .cat-item:hover { background:rgba(255,255,255,0.07); color:#c9d1d9; }
    .cat-item.active { background:rgba(59,130,246,0.15); color:#3b82f6; }
    .cat-count {
      font-size: 9px; font-weight: 500;
      background: rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 1px 5px;
      min-width: 20px;
      text-align: center;
    }
    .cat-item.active .cat-count { background: rgba(59,130,246,0.2); }

    /* ── CONFIG CENTER ──────────────────────────────────────────── */
    #config-center {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    #search-wrap {
      flex-shrink: 0;
      position: relative;
    }
    #search-wrap svg {
      position: absolute;
      left: 9px; top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
    }
    #config-search {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 10px;
      padding: 6px 10px 6px 30px;
      color: #e5e7eb;
      font-size: 12px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }
    #config-search:focus { border-color: rgba(59,130,246,0.4); }
    #config-search::placeholder { color: #4b5563; }

    #config-list-wrap {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }
    #config-list { display: flex; flex-direction: column; gap: 1px; }

    .cfg-group-label {
      font-size: 9px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.1em; color: #4b5563;
      padding: 8px 8px 3px;
    }
    .cfg-item {
      display: grid;
      grid-template-columns: minmax(180px, 260px) 1fr;
      align-items: center;
      padding: 5px 8px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.12s;
      border: 1px solid transparent;
      gap: 8px;
    }
    .cfg-item:hover { background: rgba(255,255,255,0.05); }
    .cfg-item.selected {
      background: rgba(59,130,246,0.1);
      border-color: rgba(59,130,246,0.28);
    }
    .cfg-key {
      font-size: 11px; font-weight: 600;
      color: #60a5fa;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .cfg-value {
      font-size: 11px; color: #9ca3af;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .cfg-empty {
      color: #4b5563; font-size: 12px;
      padding: 20px 8px; text-align: center;
    }

    /* ── DETAIL PANEL ───────────────────────────────────────────── */
    #detail-panel {
      width: 280px;
      flex-shrink: 0;
      background: rgba(22,27,34,0.85);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px;
      padding: 14px 14px 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .detail-hint {
      color: #4b5563;
      font-size: 12px;
      text-align: center;
      margin-top: 28px;
      line-height: 1.7;
    }
    #detail-key-name {
      font-size: 12px; font-weight: 700;
      color: #60a5fa;
      word-break: break-all;
      margin-bottom: 3px;
    }
    #detail-key-value {
      font-size: 11px; color: #9ca3af;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      word-break: break-all;
    }
    .detail-row {
      padding: 7px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-label {
      font-size: 9px; text-transform: uppercase;
      letter-spacing: 0.1em; color: #6b7280;
      font-weight: 700; margin-bottom: 3px;
    }
    .detail-val { font-size: 12px; color: #e5e7eb; line-height: 1.5; }
    .detail-val.mono { font-family: 'Fira Mono', 'Consolas', monospace; font-size: 11px; color: #a3e635; }
  </style>
</head>

  <script>
    // ══════════════════════════════════════════════════════════════
    //  SERVICES
    // ══════════════════════════════════════════════════════════════
    const SERVICES = [
      { id: 'allsky360-camera.service',   label: 'Camera',   desc: 'Image capture service'  },
      { id: 'allsky360-api.service',      label: 'API',      desc: 'Web API service'         },
      { id: 'allsky360-meteo.service',    label: 'Meteo',    desc: 'Weather data service'   },
      { id: 'allsky360-aurora.service',   label: 'Aurora',   desc: 'Aurora data service'    },
      { id: 'allsky360-mount-position.service', label: 'Mount', desc: 'Mount position service' },
      { id: 'allsky360-sensors.service',  label: 'Sensors',  desc: 'RS485 sensors (one reading)' },
    ];

    function parseStatus(output) {
      if (!output) return 'unknown';
      const s = output.trim().toLowerCase();
      if (s === 'active')                                  return 'running';
      if (s === 'inactive' || s === 'failed' || s === 'dead') return 'stopped';
      return 'unknown';
    }

    function statusLabel(s) {
      if (s === 'running') return 'Running';
      if (s === 'stopped') return 'Stopped';
      return 'Unknown';
    }

    function buildServiceCards() {
      const row = document.getElementById('services-row');
      row.innerHTML = '';
      SERVICES.forEach(svc => {
        row.innerHTML += `
          <div class="svc-card" id="svc-card-${svc.id}">
            <div class="svc-dot loading" id="svc-dot-${svc.id}"></div>
            <div class="svc-info">
              <div class="svc-name">${svc.label}</div>
              <div class="svc-status-text" id="svc-status-${svc.id}">Checking…</div>
            </div>
            <div class="svc-btns">
              <button class="svc-btn svc-btn-start"   onclick="controlService('${svc.id}','start')"   title="Start ${svc.label}">Start</button>
              <button class="svc-btn svc-btn-restart" onclick="controlService('${svc.id}','restart')" title="Restart ${svc.label}">Restart</button>
              <button class="svc-btn svc-btn-stop"    onclick="controlService('${svc.id}','stop')"    title="Stop ${svc.label}">Stop</button>
            </div>
          </div>`;
      });
    }

    function setServiceStatus(serviceId, status) {
      const dot  = document.getElementById(`svc-dot-${serviceId}`);
      const text = document.getElementById(`svc-status-${serviceId}`);
      const card = document.getElementById(`svc-card-${serviceId}`);
      if (!dot) return;
      dot.className   = `svc-dot ${status}`;
      text.textContent = statusLabel(status);
      card.className  = `svc-card ${status}`;
    }

    async function fetchStatus(serviceId) {
      try {
        const res  = await fetch(`api/services/status?service=${encodeURIComponent(serviceId)}`);
        const data = await res.json();
        setServiceStatus(serviceId, parseStatus(data.output || ''));
      } catch {
        setServiceStatus(serviceId, 'unknown');
      }
    }

    // Service control requires the api-token from config.ini. It is asked for
    // once and kept in sessionStorage, so it is gone when the tab is closed.
    const TOKEN_KEY = 'allsky360-api-token';

    function getApiToken(forcePrompt) {
      let token = null;
      try { token = sessionStorage.getItem(TOKEN_KEY); } catch {}
      if (!token || forcePrompt) {
        token = window.prompt('API token (api-token in config.ini):', '');
        if (!token) return null;
        try { sessionStorage.setItem(TOKEN_KEY, token); } catch {}
      }
      return token;
    }

    function forgetApiToken() {
      try { sessionStorage.removeItem(TOKEN_KEY); } catch {}
    }

    async function postServiceAction(serviceId, action, token) {
      return fetch(`api/services/${action}?service=${encodeURIComponent(serviceId)}`, {
        method: 'POST',
        headers: { 'X-API-Token': token },
      });
    }

    async function controlService(serviceId, action) {
      const msg = document.getElementById('msg-bar');
      const svcLabel = SERVICES.find(s => s.id === serviceId)?.label || serviceId;
      const actionLabel = action === 'start' ? 'Starting' : action === 'stop' ? 'Stopping' : 'Restarting';
      const doneLabel   = action === 'start' ? 'started'  : action === 'stop' ? 'stopped'  : 'restarted';
      msg.className = '';
      msg.textContent = `${actionLabel} ${svcLabel}…`;
      setServiceStatus(serviceId, 'loading');
      document.getElementById(`svc-dot-${serviceId}`).className = 'svc-dot loading';

      try {
        let token = getApiToken(false);
        if (!token) {
          msg.className   = 'err';
          msg.textContent = `${svcLabel} ${action} cancelled: no API token entered.`;
          fetchStatus(serviceId);
          return;
        }

        let res = await postServiceAction(serviceId, action, token);
        if (res.status === 401) {
          // Stored token is wrong or outdated: ask once more
          forgetApiToken();
          token = getApiToken(true);
          if (token)
            res = await postServiceAction(serviceId, action, token);
        }
        if (res.status === 401)
          forgetApiToken();

        const data = await res.json();
        if (res.ok && data.status === 'success') {
          msg.className   = 'ok';
          msg.textContent = `${svcLabel} ${doneLabel} successfully.`;
        } else {
          msg.className   = 'err';
          msg.textContent = `${svcLabel} ${action} failed: ${data.error || 'Unknown error'}`;
        }
      } catch (e) {
        msg.className   = 'err';
        msg.textContent = `${svcLabel} ${action} failed: ${e.message}`;
      }

      // Re-fetch status after action
      setTimeout(() => fetchStatus(serviceId), 1500);
      setTimeout(() => { if (msg.textContent.includes(svcLabel)) msg.textContent = ''; }, 6000);
    }

    // ══════════════════════════════════════════════════════════════
    //  CATEGORIES
    // ══════════════════════════════════════════════════════════════
    const CATEGORY_DEFS = [
      { id: 'all',        label: 'All Parameters' },
      { id: 'location',   label: 'Location' },
      { id: 'connection', label: 'Connection' },
      { id: 'camera',     label: 'Camera' },
      { id: 'daytime',    label: 'Daytime' },
      { id: 'nighttime',  label: 'Nighttime' },
      { id: 'exposure',   label: 'Exposure & HDR' },
      { id: 'filters',    label: 'Filters' },
      { id: 'image',      label: 'Image & Output' },
      { id: 'panorama',   label: 'Panorama' },
      { id: 'sqm',        label: 'Sky Quality' },
      { id: 'storage',    label: 'Storage' },
      { id: 'weather',    label: 'Weather Sensor' },
      { id: 'debug',      label: 'Debug' },
    ];

    function getCategory(key) {
      const loc  = ['latitude','longitude','altitude','city','sunangle','owner'];
      const conn = ['indigoservername','indigoserver','indigoport','indigocamera','debayer','indigo_capture_timeout','capture_interval'];
      const exp  = ['measure_brightness_area','target_mean','black_clipping_point','white_clipping_point','median_brightness'];
      const flt  = ['gamma','saturation'];
      if (loc.includes(key))  return 'location';
      if (conn.includes(key)) return 'connection';
      if (exp.includes(key))  return 'exposure';
      if (flt.includes(key))  return 'filters';
      if (key.startsWith('camera_'))           return 'camera';
      if (key.startsWith('daytime_'))          return 'daytime';
      if (key.startsWith('nighttime_'))        return 'nighttime';
      if (key.startsWith('hdr') || key.startsWith('autostretch')) return 'exposure';
      if (key.startsWith('acdnr_') || key.startsWith('clarity_') || key.startsWith('wavelet_') ||
          key.startsWith('scnr_')  || key.startsWith('dehaze_') ) return 'filters';
      if (key.startsWith('image_') || key.startsWith('focus_') || key.startsWith('crop_') ||
          key.startsWith('lens_')  || key.startsWith('png_')   || key.startsWith('jpeg_') ||
          key === 'rotate_image'   || key.startsWith('thumbnail')) return 'image';
      if (key.startsWith('panorama')) return 'panorama';
      if (key.startsWith('sqm'))      return 'sqm';
      if (key.endsWith('_directory')) return 'storage';
      if (key.startsWith('weather_')) return 'weather';
      if (key.startsWith('debug_'))   return 'debug';
      return 'other';
    }

    // ══════════════════════════════════════════════════════════════
    //  STATE
    // ══════════════════════════════════════════════════════════════
    let allConfig   = {};   // { key: value }
    let helpData    = {};   // from config_help.json
    let activeCategory = 'all';
    let selectedKey    = null;

    // ══════════════════════════════════════════════════════════════
    //  CATEGORY NAV
    // ══════════════════════════════════════════════════════════════
    function buildCatNav() {
      const nav = document.getElementById('cat-nav');
      nav.innerHTML = '';

      // Count per category
      const counts = {};
      Object.keys(allConfig).forEach(k => {
        const cat = getCategory(k);
        counts[cat] = (counts[cat] || 0) + 1;
      });
      const total = Object.keys(allConfig).length;

      CATEGORY_DEFS.forEach(def => {
        const count = def.id === 'all' ? total : (counts[def.id] || 0);
        if (def.id !== 'all' && count === 0) return;
        const el = document.createElement('div');
        el.className  = 'cat-item' + (def.id === activeCategory ? ' active' : '');
        el.dataset.cat = def.id;
        el.innerHTML   = `<span>${def.label}</span><span class="cat-count">${count}</span>`;
        el.addEventListener('click', () => {
          activeCategory = def.id;
          document.querySelectorAll('.cat-item').forEach(e => e.classList.remove('active'));
          el.classList.add('active');
          document.getElementById('config-search').value = '';
          renderConfigList();
        });
        nav.appendChild(el);
      });
    }

    // ══════════════════════════════════════════════════════════════
    //  CONFIG LIST
    // ══════════════════════════════════════════════════════════════
    function renderConfigList() {
      const list        = document.getElementById('config-list');
      const searchQuery = document.getElementById('config-search').value.toLowerCase().trim();
      list.innerHTML    = '';

      const entries = Object.entries(allConfig).filter(([key]) => {
        const matchesCat    = activeCategory === 'all' || getCategory(key) === activeCategory;
        const matchesSearch = !searchQuery || key.toLowerCase().includes(searchQuery);
        return matchesCat && matchesSearch;
      });

      if (entries.length === 0) {
        list.innerHTML = '<div class="cfg-empty">No parameters found.</div>';
        return;
      }

      entries.forEach(([key, value]) => {
        const el = document.createElement('div');
        el.className  = 'cfg-item' + (key === selectedKey ? ' selected' : '');
        el.dataset.key = key;
        el.innerHTML   = `<span class="cfg-key">${key}</span><span class="cfg-value">${value}</span>`;
        el.addEventListener('click', () => {
          document.querySelectorAll('.cfg-item').forEach(e => e.classList.remove('selected'));
          el.classList.add('selected');
          selectedKey = key;
          showDetail(key, value);
        });
        list.appendChild(el);
      });
    }

    // ══════════════════════════════════════════════════════════════
    //  DETAIL PANEL
    // ══════════════════════════════════════════════════════════════
    function showDetail(key, value) {
      const panel = document.getElementById('detail-panel');
      const entry = helpData[key];

      let html = `<div id="detail-key-name">${key}</div>`;
      html += `<div id="detail-key-value">Current value: <strong style="color:#e5e7eb">${value}</strong></div>`;

      if (!entry) {
        html += '<p class="detail-hint" style="margin-top:12px">No description available.</p>';
        panel.innerHTML = html;
        return;
      }

      if (entry.description) {
        html += `<div class="detail-row">
          <div class="detail-label">Description</div>
          <div class="detail-val">${entry.description}</div>
        </div>`;
      }
      if (entry.unit) {
        html += `<div class="detail-row">
          <div class="detail-label">Unit</div>
          <div class="detail-val mono">${entry.unit}</div>
        </div>`;
      }
      if (entry.range) {
        html += `<div class="detail-row">
          <div class="detail-label">Range</div>
          <div class="detail-val mono">${entry.range}</div>
        </div>`;
      }
      if (entry.default !== undefined) {
        html += `<div class="detail-row">
          <div class="detail-label">Default</div>
          <div class="detail-val mono">${entry.default}</div>
        </div>`;
      }
      if (entry.recommendations && entry.recommendations.length > 0) {
        html += `<div class="detail-row">
          <div class="detail-label">Recommendations</div>
          <div class="detail-val">${entry.recommendations.map(r => `• ${r}`).join('<br>')}</div>
        </div>`;
      }

      panel.innerHTML = html;
    }

    // ══════════════════════════════════════════════════════════════
    //  INIT
    // ══════════════════════════════════════════════════════════════
    async function init() {
      buildServiceCards();
      SERVICES.forEach(svc => fetchStatus(svc.id));

      try {
        const [cfgRes, helpRes] = await Promise.all([
          fetch('api/config'),
          fetch('config_help.json')
        ]);
        allConfig = await cfgRes.json();
        helpData  = await helpRes.json();
      } catch (err) {
        document.getElementById('config-list').innerHTML =
          '<div class="cfg-empty">Failed to load configuration.</div>';
        console.error(err);
        return;
      }

      buildCatNav();
      renderConfigList();

      document.getElementById('config-search').addEventListener('input', () => {
        // When searching, switch to 'all' category
        if (document.getElementById('config-search').value.trim()) {
          activeCategory = 'all';
          document.querySelectorAll('.cat-item').forEach(e => {
            e.classList.toggle('active', e.dataset.cat === 'all');
          });
        }
        renderConfigList();
      });
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>

</body>
