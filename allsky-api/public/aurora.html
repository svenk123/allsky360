    <!-- ── AURORA MAIN ────────────────────────────────────────────── -->
    <main id="aurora-main">

      <!-- Controls -->
      <div id="controls-bar">
        <div class="ctrl-group">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8"  y1="2" x2="8"  y2="6"></line>
            <line x1="3"  y1="10" x2="21" y2="10"></line>
          </svg>
          <span class="ctrl-label-text">Date</span>
          <input type="date" id="datePicker" class="ctrl-date" />
        </div>
      </div>

      <!-- GridStack -->
      <div id="aurora-scroll">
        <div class="grid-stack" id="aurora-grid">

          <div class="grid-stack-item" gs-id="chart-probability-combined" gs-x="0" gs-y="0" gs-w="12" gs-h="4">
            <div class="grid-stack-item-content">
              <canvas id="chartProbabilityCombined"></canvas>
            </div>
          </div>

          <div class="grid-stack-item" gs-id="chart-kp-index" gs-x="0" gs-y="4" gs-w="6" gs-h="3">
            <div class="grid-stack-item-content">
              <canvas id="chartKpIndex"></canvas>
            </div>
          </div>

          <div class="grid-stack-item" gs-id="chart-bt" gs-x="6" gs-y="4" gs-w="6" gs-h="3">
            <div class="grid-stack-item-content">
              <canvas id="chartBt"></canvas>
            </div>
          </div>

          <div class="grid-stack-item" gs-id="chart-bz" gs-x="0" gs-y="7" gs-w="6" gs-h="3">
            <div class="grid-stack-item-content">
              <canvas id="chartBz"></canvas>
            </div>
          </div>

          <div class="grid-stack-item" gs-id="chart-density" gs-x="6" gs-y="7" gs-w="6" gs-h="3">
            <div class="grid-stack-item-content">
              <canvas id="chartDensity"></canvas>
            </div>
          </div>

          <div class="grid-stack-item" gs-id="chart-speed" gs-x="0" gs-y="10" gs-w="6" gs-h="3">
            <div class="grid-stack-item-content">
              <canvas id="chartSpeed"></canvas>
            </div>
          </div>

          <div class="grid-stack-item" gs-id="chart-temperature" gs-x="6" gs-y="10" gs-w="6" gs-h="3">
            <div class="grid-stack-item-content">
              <canvas id="chartTemperature"></canvas>
            </div>
          </div>

        </div>
      </div>

  <script>
    // ══════════════════════════════════════════════════════════════
    //  CHART FACTORY
    // ══════════════════════════════════════════════════════════════
    const charts = {};

    function createChart(id, label, datasets, type = "line", showLegend = false, yMin = null, yMax = null) {
      const yAxis = {
        ticks: {
          color: '#9ca3af',
          font: { size: 10 },
          callback: (v) => Number.isInteger(v) ? v.toString() : v.toFixed(1)
        },
        grid: { color: 'rgba(255,255,255,0.06)' }
      };
      if (yMin !== null) yAxis.min = yMin;
      if (yMax !== null) yAxis.max = yMax;

      return new Chart(document.getElementById(id), {
        type,
        data: { labels: [], datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          scales: {
            x: {
              type: 'time',
              time: {
                unit: 'minute',
                tooltipFormat: 'HH:mm',
                displayFormats: { hour: 'HH:mm', minute: 'HH:mm' }
              },
              ticks: { color: '#9ca3af', maxTicksLimit: 8, font: { size: 10 } },
              grid: { color: 'rgba(255,255,255,0.06)' }
            },
            y: yAxis
          },
          plugins: {
            title: {
              display: true,
              text: label,
              color: '#e5e7eb',
              font: { size: 12, weight: '600' },
              padding: { top: 6, bottom: 4 }
            },
            legend: {
              display: showLegend,
              labels: { color: '#9ca3af', boxWidth: 2, boxHeight: 2, font: { size: 11 } }
            }
          }
        }
      });
    }

    // ══════════════════════════════════════════════════════════════
    //  DATA UPDATE / CLEAR
    // ══════════════════════════════════════════════════════════════
    function updateCharts(data) {
      const ts = data.map(d => new Date(d.timestamp * 1000));

      charts.chartProbabilityCombined.data.labels = ts;
      charts.chartProbabilityCombined.data.datasets[0].data = data.map(d => d.probability_percent);
      charts.chartProbabilityCombined.data.datasets[1].data = data.map(d => d.probability_max);
      charts.chartProbabilityCombined.data.datasets[2].data = data.map(d => d.probability_avg);

      charts.chartKpIndex.data.labels = ts;
      charts.chartKpIndex.data.datasets[0].data = data.map(d => d.kp_index);

      charts.chartBt.data.labels = ts;
      charts.chartBt.data.datasets[0].data = data.map(d => d.bt);

      charts.chartBz.data.labels = ts;
      charts.chartBz.data.datasets[0].data = data.map(d => d.bz);

      charts.chartDensity.data.labels = ts;
      charts.chartDensity.data.datasets[0].data = data.map(d => d.density);

      charts.chartSpeed.data.labels = ts;
      charts.chartSpeed.data.datasets[0].data = data.map(d => d.speed);

      charts.chartTemperature.data.labels = ts;
      charts.chartTemperature.data.datasets[0].data = data.map(d => d.temperature);

      Object.values(charts).forEach(c => c.update());
    }

    function clearAllCharts() {
      Object.values(charts).forEach(c => {
        c.data.labels = [];
        c.data.datasets.forEach(ds => ds.data = []);
        c.update();
      });
    }

    // ══════════════════════════════════════════════════════════════
    //  LOAD MEASUREMENTS
    // ══════════════════════════════════════════════════════════════
    async function loadMeasurements() {
      const date = document.getElementById("datePicker").value;
      document.getElementById("hdr-date").textContent = date || '–';
      try {
        const res = await fetch(`/api/aurora?date=${date}`);
        if (res.status === 404) { clearAllCharts(); return; }
        if (!res.ok) throw new Error("HTTP " + res.status);
        const json = await res.json();
        if (Array.isArray(json)) updateCharts(json);
        else clearAllCharts();
      } catch (err) {
        console.error("Failed to load aurora data:", err);
        clearAllCharts();
      }
    }

    // ══════════════════════════════════════════════════════════════
    //  INIT
    // ══════════════════════════════════════════════════════════════
    function init() {
      const datePicker = document.getElementById("datePicker");
      const today = new Date().toISOString().slice(0, 10);
      datePicker.value = today;
      document.getElementById("hdr-date").textContent = today;
      datePicker.addEventListener("change", loadMeasurements);

      charts.chartProbabilityCombined = createChart("chartProbabilityCombined", "Aurora Probability (%)", [
        { label: "Probability %",     data: [], borderColor: "#34d399", backgroundColor: "rgba(52,211,153,0.12)", fill: true,  pointRadius: 0, tension: 0.15 },
        { label: "Max Probability %", data: [], borderColor: "#f97316",                                           fill: false, pointRadius: 0, tension: 0.15 },
        { label: "Avg Probability %", data: [], borderColor: "#fbbf24",                                           fill: false, pointRadius: 0, tension: 0.15 }
      ], "line", true, 0, 100);

      charts.chartKpIndex = createChart("chartKpIndex", "Kp Index", [
        { label: "Kp Index", data: [], backgroundColor: "rgba(232,121,249,0.55)", borderColor: "rgba(232,121,249,0.9)", pointRadius: 0 }
      ], "bar");

      charts.chartBt = createChart("chartBt", "Bt – Magnetic Field Total (nT)", [
        { label: "Bt", data: [], borderColor: "#60a5fa", fill: false, pointRadius: 0, tension: 0.15 }
      ]);

      charts.chartBz = createChart("chartBz", "Bz – Magnetic Field Z (nT)", [
        { label: "Bz", data: [], borderColor: "#818cf8", fill: false, pointRadius: 0, tension: 0.15 }
      ]);

      charts.chartDensity = createChart("chartDensity", "Solar Wind Density (p/cm³)", [
        { label: "Density", data: [], borderColor: "#c084fc", fill: false, pointRadius: 0, tension: 0.15 }
      ]);

      charts.chartSpeed = createChart("chartSpeed", "Solar Wind Speed (km/s)", [
        { label: "Speed", data: [], borderColor: "#f87171", fill: false, pointRadius: 0, tension: 0.15 }
      ]);

      charts.chartTemperature = createChart("chartTemperature", "Solar Wind Temperature (K)", [
        { label: "Temperature", data: [], borderColor: "#fb923c", fill: false, pointRadius: 0, tension: 0.15 }
      ]);

      loadMeasurements();
      setInterval(loadMeasurements, 60000);
    }

    document.addEventListener("DOMContentLoaded", init);

    // ══════════════════════════════════════════════════════════════
    //  GRIDSTACK
    // ══════════════════════════════════════════════════════════════
    document.addEventListener('DOMContentLoaded', () => {
      const gridEl = document.getElementById('aurora-grid');
      const grid = GridStack.init({
        cellHeight: 110,
        disableOneColumnMode: false,
        float: false,
        resizable: { handles: 'all' }
      }, gridEl);

      let gridUnlocked = false;
      const toggleBtn = document.getElementById('toggle-grid-btn');

      grid.enableMove(false);
      grid.enableResize(false);

      window.toggleGridInteraction = function () {
        gridUnlocked = !gridUnlocked;
        if (gridUnlocked) {
          grid.enableMove(true);
          grid.enableResize(true);
          toggleBtn.textContent = '🔓 Unlocked';
          toggleBtn.classList.remove('badge-gray');
          toggleBtn.classList.add('badge-blue');
        } else {
          grid.enableMove(false);
          grid.enableResize(false);
          toggleBtn.textContent = '🔒 Locked';
          toggleBtn.classList.remove('badge-blue');
          toggleBtn.classList.add('badge-gray');
        }
      };

      const LS_KEY = 'allsky360.aurora1.layout.v1';
      const defaultLayout = [
        { id: "chart-probability-combined", x: 0, y: 0,  w: 12, h: 4 },
        { id: "chart-kp-index",             x: 0, y: 4,  w: 6,  h: 3 },
        { id: "chart-bt",                   x: 6, y: 4,  w: 6,  h: 3 },
        { id: "chart-bz",                   x: 0, y: 7,  w: 6,  h: 3 },
        { id: "chart-density",              x: 6, y: 7,  w: 6,  h: 3 },
        { id: "chart-speed",                x: 0, y: 10, w: 6,  h: 3 },
        { id: "chart-temperature",          x: 6, y: 10, w: 6,  h: 3 }
      ];

      function applyLayout(layout) {
        const byId = Object.fromEntries(
          grid.engine.nodes.map(n => [n.id || n.el.getAttribute('gs-id'), n])
        );
        layout.forEach(l => {
          const node = byId[l.id];
          if (node) grid.update(node.el, { x: l.x, y: l.y, w: l.w, h: l.h });
        });
      }

      function loadLayout() {
        try {
          const raw = localStorage.getItem(LS_KEY);
          if (!raw) return null;
          const parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed : null;
        } catch { return null; }
      }

      function saveLayout() {
        const data = grid.save(true).map(n => ({
          id: n.id || n.el.getAttribute('gs-id'),
          x: n.x, y: n.y, w: n.w, h: n.h
        }));
        try { localStorage.setItem(LS_KEY, JSON.stringify(data)); } catch (_) {}
      }

      window.resetGridLayout = function () {
        applyLayout(defaultLayout);
        try { localStorage.removeItem(LS_KEY); } catch (_) {}
      };

      applyLayout(loadLayout() || defaultLayout);
      grid.on('change', saveLayout);
    });
  </script>
