<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Allsky360 – Calibration</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Allsky360 Calibration">
  <meta name="theme-color" content="#0d1117" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <script src="js/allsky-common.js"></script>
  <script src="js/astronomia.bundle.min.js" defer
    onerror="var s=document.createElement('script'); s.defer=true;
             s.src='https://cdn.jsdelivr.net/npm/astronomia@1.12.0/build/astronomia.umd.min.js';
             document.head.appendChild(s);"></script>

  <link rel="stylesheet" href="allsky.css">
  <style>
    /* calibration header uses tighter gap */
    #app-header { gap: 10px; }

    /* ── CALIB MAIN ─────────────────────────────────────────────── */
    #calib-main {
      flex: 1;
      min-width: 0;
      display: flex;
      overflow: hidden;
    }

    /* ── IMAGE AREA ─────────────────────────────────────────────── */
    #image-container {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      position: relative;
      background: #000;
      cursor: crosshair;
      display: flex;
      align-items: flex-start;
    }
    #image-wrap {
      position: relative;
      width: 100%;
    }
    #image {
      display: block;
      width: 100%;
      user-select: none;
      -webkit-user-drag: none;
    }
    #overlay {
      position: absolute;
      top: 0; left: 0;
      cursor: crosshair;
    }

    /* ── CONTROLS SIDEBAR ───────────────────────────────────────── */
    #controls-sidebar {
      width: 264px;
      flex-shrink: 0;
      background: rgba(13,17,23,0.98);
      border-left: 1px solid rgba(255,255,255,0.06);
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* ── CALIBRATION CARDS ──────────────────────────────────────── */
    .calib-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 11px 12px;
    }
    .calib-card-title {
      font-size: 10px; font-weight: 700;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      margin-bottom: 9px;
    }
    .calib-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 3px 0;
    }
    .calib-label {
      font-size: 11px; color: #9ca3af;
      flex: 1; min-width: 0;
    }
    .calib-input {
      width: 78px;
      flex-shrink: 0;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 7px;
      padding: 4px 7px;
      color: #e5e7eb;
      font-size: 11px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
      -moz-appearance: textfield;
    }
    .calib-input::-webkit-inner-spin-button,
    .calib-input::-webkit-outer-spin-button { -webkit-appearance: none; }
    .calib-input:focus { border-color: rgba(59,130,246,0.45); }

    .calib-select {
      width: 78px;
      flex-shrink: 0;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 7px;
      padding: 4px 7px;
      color: #e5e7eb;
      font-size: 11px;
      font-family: inherit;
      outline: none;
    }
    .calib-select option { background: #161b22; color: #e5e7eb; }

    .calib-check-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
    }
    .calib-check-row input[type="checkbox"] {
      width: 14px; height: 14px;
      accent-color: #3b82f6;
      flex-shrink: 0;
      cursor: pointer;
    }
    .calib-check-row label {
      font-size: 11px; color: #9ca3af;
      cursor: pointer;
      user-select: none;
    }

    .calib-divider {
      height: 1px;
      background: rgba(255,255,255,0.06);
      margin: 6px 0;
    }

    /* ── CONFIG OUTPUT ──────────────────────────────────────────── */
    #configOutput {
      width: 100%;
      min-height: 130px;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 8px 10px;
      color: #a3e635;
      font-family: 'Fira Mono', 'Consolas', monospace;
      font-size: 10px;
      line-height: 1.6;
      resize: vertical;
      outline: none;
    }
    .output-hint {
      font-size: 10px; color: #4b5563;
      margin-bottom: 6px;
      line-height: 1.4;
    }
  </style>
</head>

    <!-- ── CALIB MAIN ─────────────────────────────────────────────── -->
    <div id="calib-main">

      <!-- Image viewer -->
      <div id="image-container">
        <div id="image-wrap">
          <img id="image" src="" alt="Allsky image" draggable="false" />
          <canvas id="overlay"></canvas>
        </div>
      </div>

      <!-- Controls sidebar -->
      <aside id="controls-sidebar">

        <!-- Black Mask -->
        <div class="calib-card">
          <div class="calib-card-title">Black Mask</div>
          <div class="calib-row">
            <span class="calib-label">Mask radius (px)</span>
            <input type="number" id="image_mask_radius" class="calib-input" step="1" min="0"
              onchange="updateOverlayFromInputs()">
          </div>
          <div class="calib-row">
            <span class="calib-label">Center X (px)</span>
            <input type="number" id="image_center_x" class="calib-input" step="1" min="0"
              onchange="updateOverlayFromInputs()">
          </div>
          <div class="calib-row">
            <span class="calib-label">Center Y (px)</span>
            <input type="number" id="image_center_y" class="calib-input" step="1" min="0"
              onchange="updateOverlayFromInputs()">
          </div>
          <div class="calib-divider"></div>
          <div class="calib-check-row">
            <input type="checkbox" id="showMaskCheckbox" onchange="toggleMaskOverlay()">
            <label for="showMaskCheckbox">Show mask overlay</label>
          </div>
        </div>

        <!-- Azimuthal Grid -->
        <div class="calib-card">
          <div class="calib-card-title">Azimuthal Grid</div>
          <div class="calib-row">
            <span class="calib-label">Horizon radius (px)</span>
            <input type="number" id="image_horizon_radius" class="calib-input" step="1" min="0"
              onchange="updateOverlayFromInputs()">
          </div>
          <div class="calib-row">
            <span class="calib-label">Zenith X (px)</span>
            <input type="number" id="image_zenith_x" class="calib-input" step="1" min="0"
              onchange="updateOverlayFromInputs()">
          </div>
          <div class="calib-row">
            <span class="calib-label">Zenith Y (px)</span>
            <input type="number" id="image_zenith_y" class="calib-input" step="1" min="0"
              onchange="updateOverlayFromInputs()">
          </div>
          <div class="calib-row">
            <span class="calib-label">North direction (°)</span>
            <input type="number" id="crosshair_rotation" class="calib-input" step="0.1" min="-360" max="360"
              onchange="updateOverlayFromInputs()">
          </div>
          <div class="calib-divider"></div>
          <div class="calib-check-row">
            <input type="checkbox" id="azimutalGridCheckbox" onchange="toggleAzimutalGridOverlay()">
            <label for="azimutalGridCheckbox">Show azimuthal grid</label>
          </div>
          <div class="calib-check-row">
            <input type="checkbox" id="cardinalDirectionsCheckbox" onchange="toggleCardinalDirectionsOverlay()">
            <label for="cardinalDirectionsCheckbox">Show cardinal directions</label>
          </div>
        </div>

        <!-- Equatorial Grid -->
        <div class="calib-card">
          <div class="calib-card-title">Equatorial Grid</div>
          <div class="calib-check-row">
            <input type="checkbox" id="equatorialGridCheckbox" onchange="toggleEquatorialGridOverlay()">
            <label for="equatorialGridCheckbox">Show equatorial grid</label>
          </div>
          <div class="calib-row" style="margin-top:6px;">
            <span class="calib-label">Projection type</span>
            <select id="projectionTypeSelect" class="calib-select" onchange="updateProjectionType()">
              <option value="linear">Linear</option>
              <option value="sinus">Sinus</option>
            </select>
          </div>
        </div>

        <!-- Config output -->
        <div class="calib-card">
          <div class="calib-card-title">Config Output</div>
          <p class="output-hint">Copy these values into your config.ini:</p>

        <!-- Dynamic metadata placeholder (may be cleared by JS) -->
        <div id="configdata"></div>

  <script>
    const imageEl     = document.getElementById("image");
    const configdataEl = document.getElementById("configdata");
    const timerEl     = document.getElementById("timer");

    let latestImagePath = "";
    let refreshInterval = 10;
    let loading = false;
    let loadingConfig = false;
    let lastImageLoadTime = Date.now();
    let timerTimeout = null;

    let showCardinalDirections = false;

    let mouseX = null;
    let mouseY = null;
    let zoomFactor = 1.0;
    let panX = 0;
    let panY = 0;
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;

    let crosshairRadius  = 1090;
    let crosshairCenterX = 1180;
    let crosshairCenterY = 1187;
    let crosshairRotation = -1.5;

    let maskRadius  = 1090;
    let maskCenterX = 1180;
    let maskCenterY = 1187;
    let showMask    = false;
    let longitude   = 0.0;
    let latitude    = 0.0;
    let altitude    = 0;
    let isSouthernHemisphere = false;
    let showAzimutalGrid     = false;
    let maxVisibleElevation  = 90;
    let projectionType       = "linear";
    let originalImageSrc     = "";

    let showEquatorialGrid = false;
    let imageTimestamp     = 0;

    const img       = document.getElementById("image");
    const container = document.getElementById("image-container");

    // Overlay redraw throttling
    let overlayRafId  = 0;
    let pendingMouse  = null;
    function scheduleOverlayRedraw() {
      if (overlayRafId) return;
      overlayRafId = requestAnimationFrame(() => {
        overlayRafId = 0;
        if (pendingMouse) {
          const { canvasRect, clientX, clientY } = pendingMouse;
          mouseX = clientX - canvasRect.left;
          mouseY = clientY - canvasRect.top;
          pendingMouse = null;
        }
        updateOverlay();
      });
    }

    // Pan/zoom redraw throttling
    let panRafId = 0;
    function schedulePanRedraw() {
      if (panRafId) return;
      panRafId = requestAnimationFrame(() => {
        panRafId = 0;
        updateZoomAndPan();
      });
    }

    container.addEventListener("mousedown", (event) => {
      isDragging = true;
      dragStartX = event.clientX - panX;
      dragStartY = event.clientY - panY;
    });

    container.addEventListener("mousemove", (event) => {
      if (isDragging) {
        panX = event.clientX - dragStartX;
        panY = event.clientY - dragStartY;
        schedulePanRedraw();
      }
    }, { passive: true });

    container.addEventListener("mouseup",    () => { isDragging = false; });
    container.addEventListener("mouseleave", () => { isDragging = false; });

    function updateZoomAndPan() {
      const img = document.getElementById("image");
      img.style.transformOrigin = "center center";
      img.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomFactor})`;
      updateOverlay();
    }

    function zoomIn() {
      zoomFactor *= 1.2;
      if (zoomFactor != 1.0) {
        showCardinalDirections = false;
        showAzimutalGrid       = false;
        showEquatorialGrid     = false;
      } else {
        showCardinalDirections = true;
        showAzimutalGrid       = azimutalGridCheckbox.checked;
        showEquatorialGrid     = equatorialGridCheckbox.checked;
      }
      updateZoomAndPan();
    }

    function zoomOut() {
      zoomFactor /= 1.2;
      if (zoomFactor != 1.0) {
        showCardinalDirections = false;
        showAzimutalGrid       = false;
        showEquatorialGrid     = false;
      } else {
        showCardinalDirections = true;
        showAzimutalGrid       = azimutalGridCheckbox.checked;
        showEquatorialGrid     = equatorialGridCheckbox.checked;
      }
      updateZoomAndPan();
    }

    function resetZoomAndPan() {
      zoomFactor = 1.0;
      panX = 0;
      panY = 0;
      updateZoomAndPan();
    }

    function toggleAzimutalGridOverlay() {
      showAzimutalGrid = document.getElementById("azimutalGridCheckbox").checked;
      updateOverlay();
    }

    function toggleEquatorialGridOverlay() {
      showEquatorialGrid = document.getElementById("equatorialGridCheckbox").checked;
      updateOverlay();
    }

    function toggleMaskOverlay() {
      showMask = document.getElementById("showMaskCheckbox").checked;
      updateOverlay();
    }

    function toggleCardinalDirectionsOverlay() {
      showCardinalDirections = document.getElementById("cardinalDirectionsCheckbox").checked;
      updateOverlay();
    }

    function updateProjectionType() {
      projectionType = document.getElementById("projectionTypeSelect").value;
      updateOverlay();
      updateConfigOutput();
    }

    function updateConfigOutput() {
      const configOutput = document.getElementById("configOutput");
      if (!configOutput) return;
      configOutput.value =
`# Overlay calibration parameters
image_horizon_radius=${crosshairRadius}
image_zenith_x=${crosshairCenterX}
image_zenith_y=${crosshairCenterY}
image_north_angle=${crosshairRotation}

# Mask parameters
image_mask_radius=${maskRadius}
image_center_x=${maskCenterX}
image_center_y=${maskCenterY}

# Projection type
projection_type=${projectionType}`;
    }

    function updateOverlayFromInputs() {
      const horizonRadiusInput    = document.getElementById("image_horizon_radius");
      const zenithXInput          = document.getElementById("image_zenith_x");
      const zenithYInput          = document.getElementById("image_zenith_y");
      const crosshairRotationInput= document.getElementById("crosshair_rotation");
      const maskRadiusInput       = document.getElementById("image_mask_radius");
      const maskCenterXInput      = document.getElementById("image_center_x");
      const maskCenterYInput      = document.getElementById("image_center_y");

      if (horizonRadiusInput     && horizonRadiusInput.value !== "")     crosshairRadius  = parseInt(horizonRadiusInput.value);
      if (zenithXInput           && zenithXInput.value !== "")           crosshairCenterX = parseInt(zenithXInput.value);
      if (zenithYInput           && zenithYInput.value !== "")           crosshairCenterY = parseInt(zenithYInput.value);
      if (crosshairRotationInput && crosshairRotationInput.value !== "") crosshairRotation= parseFloat(crosshairRotationInput.value);
      if (maskRadiusInput        && maskRadiusInput.value !== "")        maskRadius       = parseInt(maskRadiusInput.value);
      if (maskCenterXInput       && maskCenterXInput.value !== "")       maskCenterX      = parseInt(maskCenterXInput.value);
      if (maskCenterYInput       && maskCenterYInput.value !== "")       maskCenterY      = parseInt(maskCenterYInput.value);

      updateOverlay();
      updateConfigOutput();
    }

    async function loadConfig() {
      if (loadingConfig) return;
      loadingConfig = true;

      const configData = await fetchConfig();
      if (!configData) { loadingConfig = false; return; }

      crosshairRadius  = configData.image_horizon_radius;
      crosshairCenterX = configData.image_zenith_x;
      crosshairCenterY = configData.image_zenith_y;
      crosshairRotation= configData.image_north_angle;

      maskRadius  = configData.image_mask_radius  || crosshairRadius;
      maskCenterX = configData.image_center_x     || crosshairCenterX;
      maskCenterY = configData.image_center_y     || crosshairCenterY;

      // Support both field name conventions
      latitude  = configData.location_latitude  ?? configData.latitude  ?? 0.0;
      longitude = configData.location_longitude ?? configData.longitude ?? 0.0;
      altitude  = configData.location_altitude  ?? configData.altitude  ?? 0;
      isSouthernHemisphere = latitude < 0.0;

      const horizonRadiusInput    = document.getElementById("image_horizon_radius");
      const zenithXInput          = document.getElementById("image_zenith_x");
      const zenithYInput          = document.getElementById("image_zenith_y");
      const crosshairRotationInput= document.getElementById("crosshair_rotation");
      const maskRadiusInput       = document.getElementById("image_mask_radius");
      const maskCenterXInput      = document.getElementById("image_center_x");
      const maskCenterYInput      = document.getElementById("image_center_y");
      const projectionTypeSelect  = document.getElementById("projectionTypeSelect");

      if (horizonRadiusInput)     horizonRadiusInput.value     = crosshairRadius;
      if (zenithXInput)           zenithXInput.value           = crosshairCenterX;
      if (zenithYInput)           zenithYInput.value           = crosshairCenterY;
      if (crosshairRotationInput) crosshairRotationInput.value = crosshairRotation;
      if (maskRadiusInput)        maskRadiusInput.value        = maskRadius;
      if (maskCenterXInput)       maskCenterXInput.value       = maskCenterX;
      if (maskCenterYInput)       maskCenterYInput.value       = maskCenterY;
      if (projectionTypeSelect)   projectionTypeSelect.value   = projectionType;

      updateConfigOutput();
      loadingConfig = false;
    }

    async function loadLatestImage() {
      if (loading) return;
      loading = true;

      try {
        const latestImageResponse = await fetch('api/latest_image', { cache: "no-cache" });
        const latestImageData     = await latestImageResponse.json();
        const todayStr       = latestImageData.date;
        const imageTimeStr   = latestImageData.image;
        const imageFiletype  = latestImageData.filetype;
        const imageDateTime  = `${todayStr}${imageTimeStr}`;
        imageTimestamp       = latestImageData.image_timestamp;

        originalImageSrc = `images/${todayStr}/image-${imageDateTime}.${imageFiletype}`;
        imageEl.src = originalImageSrc;

        const imageMetaPath = `images/${todayStr}/image-${imageDateTime}.json`;
        let imageMeta = null;
        try {
          const imgMetaResp = await fetch(imageMetaPath, { cache: "no-cache" });
          imageMeta = await imgMetaResp.json();
        } catch (e) {
          console.warn("⚠️ Image metadata not found:", imageMetaPath);
        }

        imageEl.onload = () => {
          loading = false;
          lastImageLoadTime = Date.now();
          updateOverlay();
        };

        imageEl.onerror = () => {
          console.error("❌ Image load error:", originalImageSrc);
          loading = false;
          lastImageLoadTime = Date.now();
        };

        if (!imageMeta) {
          configdataEl.innerHTML = "";
          return;
        }

        imageTimestamp = imageMeta.timestamp;

        refreshInterval = (typeof imageMeta.capture_interval === "number" && imageMeta.capture_interval > 0)
          ? Math.round(imageMeta.capture_interval)
          : 10;

        timerEl.textContent = refreshInterval;
        restartTimer();

      } catch (err) {
        console.error("⚠️ Unexpected load error:", err);
        loading = false;
        lastImageLoadTime = Date.now();
      }
    }

    function tick() {
      const elapsed   = Math.floor((Date.now() - lastImageLoadTime) / 1000);
      const remaining = Math.max(refreshInterval - elapsed, 0);
      timerEl.textContent = remaining;

      if (remaining <= 0 && !loading) {
        loadLatestImage();
        lastImageLoadTime = Date.now();
      }

      timerTimeout = setTimeout(tick, 1000);
    }

    function restartTimer() {
      if (timerTimeout !== null) clearTimeout(timerTimeout);
      lastImageLoadTime = Date.now();
      tick();
    }

    function isPointInsideMask(x, y) {
      const scaleX = img.clientWidth  / img.naturalWidth;
      const scaleY = img.clientHeight / img.naturalHeight;

      const maskCenterXScaled = maskCenterX * scaleX * zoomFactor + panX;
      const maskCenterYScaled = maskCenterY * scaleY * zoomFactor + panY;
      const maskRadiusScaled  = maskRadius  * scaleX * zoomFactor;
      const effectiveRadius   = maskRadiusScaled + 20;

      return Math.sqrt((x - maskCenterXScaled) ** 2 + (y - maskCenterYScaled) ** 2) <= effectiveRadius;
    }

    function updateOverlay() {
      const canvas = document.getElementById("overlay");
      const img    = document.getElementById("image");

      canvas.width  = img.clientWidth;
      canvas.height = img.clientHeight;
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const scaleX = img.clientWidth  / img.naturalWidth;
      const scaleY = img.clientHeight / img.naturalHeight;

      // Black mask
      if (showMask) {
        const mCX = maskCenterX * scaleX * zoomFactor + panX;
        const mCY = maskCenterY * scaleY * zoomFactor + panY;
        const mR  = maskRadius  * scaleX * zoomFactor;
        ctx.save();
        ctx.fillStyle = "rgba(50,50,50,0.8)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.globalCompositeOperation = "destination-out";
        ctx.beginPath();
        ctx.arc(mCX, mCY, mR, 0, 2 * Math.PI);
        ctx.fill();
        ctx.restore();
      }

      // Pixel grid
      ctx.save();
      ctx.strokeStyle = "rgba(128,128,128,1.0)";
      ctx.lineWidth = 0.5;
      for (let x = 0; x < canvas.width; x += 100) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 100) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }
      ctx.restore();

      const centerX = crosshairCenterX * scaleX * zoomFactor + panX;
      const centerY = crosshairCenterY * scaleY * zoomFactor + panY;
      const radius  = crosshairRadius  * scaleX * zoomFactor;

      // Cardinal directions
      if (showCardinalDirections) {
        ctx.save();
        ctx.strokeStyle = "rgba(255,0,0,0.8)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
        ctx.stroke();

        const directions = ["N","NW","W","SW","S","SE","E","NE"];
        const total = directions.length;
        for (let i = 0; i < total; i++) {
          const idx      = isSouthernHemisphere ? total - 1 - i : i;
          const angleRad = (crosshairRotation + (360 / total) * i) * Math.PI / 180;
          const x = centerX + Math.sin(angleRad) * radius;
          const y = centerY - Math.cos(angleRad) * radius;
          if (isPointInsideMask(x, y)) {
            ctx.beginPath(); ctx.arc(x, y, 3, 0, 2 * Math.PI);
            ctx.fillStyle = "red"; ctx.fill();
            const tx = centerX + Math.sin(angleRad) * (radius + 14);
            const ty = centerY - Math.cos(angleRad) * (radius + 14);
            if (isPointInsideMask(tx, ty)) {
              ctx.fillStyle = "red";
              ctx.font = "12px sans-serif";
              ctx.textAlign = "center"; ctx.textBaseline = "middle";
              ctx.fillText(directions[idx], tx, ty);
            }
          }
        }

        if (isPointInsideMask(centerX, centerY)) {
          ctx.beginPath(); ctx.arc(centerX, centerY, 2, 0, 2 * Math.PI);
          ctx.fillStyle = "red"; ctx.fill();
          const zlx = centerX + 6, zly = centerY + 6;
          if (isPointInsideMask(zlx, zly)) {
            ctx.fillStyle = "red";
            ctx.font = "12px sans-serif";
            ctx.textAlign = "left"; ctx.textBaseline = "top";
            ctx.fillText("Zenith", zlx, zly);
          }
        }
        ctx.restore();
      }

      // Equatorial grid
      if (showEquatorialGrid) {
        const lat = latitude, lon = longitude, ts = imageTimestamp;
        ctx.save();
        const mCX = maskCenterX * scaleX * zoomFactor + panX;
        const mCY = maskCenterY * scaleY * zoomFactor + panY;
        const mR  = maskRadius  * scaleX * zoomFactor;
        ctx.beginPath(); ctx.arc(mCX, mCY, mR, 0, 2 * Math.PI); ctx.clip();

        ctx.strokeStyle = "rgba(0,255,0,0.4)";
        ctx.lineWidth = 1;
        ctx.fillStyle = "lime";
        ctx.font = "10px sans-serif";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";

        for (let dec = -60; dec <= 60; dec += 15) {
          let points = [];
          for (let ra = 0; ra < 360; ra += 5) {
            const { azimuth, altitude } = raDecToAzAlt(ra, dec, lat, lon, ts);
            if (altitude >= 0 && altitude <= 90) {
              const { x, y } = azAltToImageXY(azimuth, altitude);
              if (isPointInsideMask(x, y)) points.push({ x, y });
            }
          }
          if (points.length > 1) {
            ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
            ctx.stroke();
          }
        }

        for (let ra = 0; ra < 360; ra += 15) {
          let points = [];
          for (let dec = -80; dec <= 80; dec += 5) {
            const { azimuth, altitude } = raDecToAzAlt(ra, dec, lat, lon, ts);
            if (altitude >= 0 && altitude <= 90) {
              const { x, y } = azAltToImageXY(azimuth, altitude);
              if (isPointInsideMask(x, y)) points.push({ x, y });
            }
          }
          if (points.length > 1) {
            ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
            ctx.stroke();
            const { x, y } = points[Math.floor(points.length / 2)];
            if (isPointInsideMask(x, y)) ctx.fillText(`${(ra / 15) % 24}h`, x, y);
          }
        }
        ctx.restore();
      }

      // Azimuthal grid
      if (showAzimutalGrid) {
        ctx.save();
        const mCX = maskCenterX * scaleX * zoomFactor + panX;
        const mCY = maskCenterY * scaleY * zoomFactor + panY;
        const mR  = maskRadius  * scaleX * zoomFactor;
        ctx.beginPath(); ctx.arc(mCX, mCY, mR, 0, 2 * Math.PI); ctx.clip();

        ctx.strokeStyle = "rgba(255,0,0,0.9)";
        ctx.lineWidth = 1;
        const baseRadius = crosshairRadius * scaleX;
        ctx.font = "10px sans-serif";
        ctx.fillStyle = "rgba(255,0,0,0.9)";
        ctx.textAlign = "left"; ctx.textBaseline = "middle";

        [15, 30, 45, 60, 75].forEach((elevation) => {
          let r = baseRadius * (90 - elevation) / 90;
          if (projectionType === "sinus") r = baseRadius * Math.sin((90 - elevation) * Math.PI / 180);
          ctx.beginPath(); ctx.arc(centerX, centerY, r, 0, 2 * Math.PI); ctx.stroke();
          const labelX = centerX + r + 4;
          if (isPointInsideMask(labelX, centerY)) ctx.fillText(`${elevation}°`, labelX, centerY - 1);
        });

        for (let i = 0; i < 8; i++) {
          const rad = (i * 45 + crosshairRotation) * Math.PI / 180;
          const x = centerX + baseRadius * Math.cos(rad);
          const y = centerY + baseRadius * Math.sin(rad);
          ctx.beginPath(); ctx.moveTo(centerX, centerY); ctx.lineTo(x, y); ctx.stroke();
        }
        ctx.restore();
      }

      // Mouse coordinates + Az/El/RA/Dec readout
      if (mouseX !== null && mouseY !== null) {
        const imageX = (mouseX - panX) / (scaleX * zoomFactor);
        const imageY = (mouseY - panY) / (scaleY * zoomFactor);
        ctx.fillStyle = "rgba(255,255,255,0.85)";
        ctx.font = "12px sans-serif";
        ctx.textAlign = "right"; ctx.textBaseline = "top";
        ctx.fillText(`X: ${Math.round(imageX)}, Y: ${Math.round(imageY)}`, canvas.width - 10, 10);

        const dxScreen = mouseX - centerX;
        const dyScreen = mouseY - centerY;
        const rScreen  = Math.hypot(dxScreen, dyScreen);

        if (rScreen <= radius) {
          const dNorm = rScreen / radius;
          let elevation;
          if (projectionType === "sinus") {
            elevation = 90 - Math.asin(Math.min(1, Math.max(0, dNorm))) * (180 / Math.PI);
          } else {
            elevation = 90 - dNorm * 90;
          }
          let azimuthDisp = Math.atan2(dxScreen, -dyScreen) * (180 / Math.PI);
          azimuthDisp = (azimuthDisp - crosshairRotation + 360) % 360;
          const MIRROR = true;
          const azimuthTrue = MIRROR ? (360 - azimuthDisp) % 360 : azimuthDisp;

          ctx.fillText(`Az: ${azimuthDisp.toFixed(1)}°, El: ${elevation.toFixed(1)}°`, canvas.width - 10, 28);
          const { raDeg, decDeg } = azAltToRaDec(latitude, longitude, azimuthTrue, elevation, imageTimestamp);
          ctx.fillText(`RA: ${formatRaHMS(raDeg)}, Dec: ${formatDecDMS(decDeg)}`, canvas.width - 10, 44);
        }
      }
    }

    const canvas = document.getElementById("overlay");

    canvas.addEventListener("mousemove", (event) => {
      const rect = canvas.getBoundingClientRect();
      pendingMouse = { canvasRect: rect, clientX: event.clientX, clientY: event.clientY };
      scheduleOverlayRedraw();
    }, { passive: true });

    canvas.addEventListener("mouseleave", () => {
      mouseX = null; mouseY = null;
      scheduleOverlayRedraw();
    }, { passive: true });

    window.addEventListener("resize", updateOverlay);

    // Mousewheel zoom
    container.addEventListener("wheel", (e) => {
      e.preventDefault();
      zoomFactor *= e.deltaY < 0 ? 1.15 : (1 / 1.15);
      if (zoomFactor < 1.0) { zoomFactor = 1.0; panX = 0; panY = 0; }
      updateZoomAndPan();
    }, { passive: false });

    loadConfig();
    loadLatestImage();
    restartTimer();
  </script>

</body>

</html>
