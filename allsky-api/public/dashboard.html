<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Allsky360 – Dashboard</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Allsky360">
  <meta name="theme-color" content="#0d1117" />

  <script src="js/allsky-common.js"></script>
  <script src="js/meteors.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="js/astronomia.bundle.min.js" defer
    onerror="var s=document.createElement('script'); s.defer=true; s.src='https://cdn.jsdelivr.net/npm/astronomia@1.12.0/build/astronomia.umd.min.js'; document.head.appendChild(s);"></script>

  <link rel="stylesheet" href="allsky.css">
  <style>
    /* ── SIDEBAR WIDTHS ─────────────────────────────────────────── */
    #left-sidebar  { width: 302px; border-right: 1px solid rgba(255,255,255,0.06); }
    #right-sidebar { width: 288px; border-left:  1px solid rgba(255,255,255,0.06); }

    /* ── OVERRIDES ──────────────────────────────────────────────── */
    .metadata-section h2 { margin-top: 2px; }
    #controls-bar { gap: 6px; }

    /* ── CENTER AREA ────────────────────────────────────────────── */
    #center-area {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      padding: 10px;
      gap: 9px;
      overflow: hidden;
      background: #0d1117;
    }

    /* ── ALLSKY PANEL ───────────────────────────────────────────── */
    #allsky-panel {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #allsky-circle-wrap {
      height: 100%;
      aspect-ratio: 1 / 1;
      max-width: 58%;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.02);
    }

    .allsky-zoom-controls {
      position: absolute; top: 6px; right: 8px;
      display: flex; gap: 4px; z-index: 3;
    }

    #image-container {
      position: relative;
      width: 100%;
      height: 100%;
    }
    #image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    #allsky-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }

    #allsky-info-overlay {
      position: absolute;
      bottom: 18px; left: 50%;
      transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      pointer-events: none; z-index: 5;
    }
    .sky-badge-row { display: flex; gap: 6px; }
    .sky-badge {
      background: rgba(0,0,0,0.62);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 10px; padding: 3px 9px;
      font-size: 11px; font-weight: 600; color: #fff;
      white-space: nowrap;
    }

    /* ── SIDE PANEL ─────────────────────────────────────────────── */
    #side-panel {
      flex: 1;
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    #panorama-container {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.02);
    }
    .pano-label {
      position: absolute; top: 8px; left: 10px;
      font-size: 10px; font-weight: 700; color: #6b7280;
      text-transform: uppercase; letter-spacing: 0.09em;
      z-index: 2; pointer-events: none;
    }
    /* Size and position are set by layoutPanorama() */
    #panorama {
      display: block;
      position: absolute;
      top: 0; left: 0;
      max-width: none;
      visibility: hidden;   /* shown by updatePanoZoom() once it is sized */
    }
    #panorama-overlay {
      position: absolute; top: 0; left: 0;
      pointer-events: none;
    }
    #pano-inner {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      cursor: grab;
    }
    #pano-inner.dragging { cursor: grabbing; }
    .pano-zoom-controls {
      position: absolute; top: 6px; right: 8px;
      display: flex; gap: 4px; z-index: 3;
    }

    /* ── CONDITIONS (right sidebar) ────────────────────────────── */
    .h2-sub { font-weight: 400; color: #6b7280; text-transform: none; letter-spacing: 0; }
    .metadata-section > div span.warn { color: #f59e0b; }
    .metadata-section > div span.bad  { color: #ef4444; }
    .metadata-section > div span.good { color: #22c55e; }
    .cloud-swatch {
      display: inline-block; width: 1.2em; height: 0.8em;
      border-radius: 2px; vertical-align: -1px; margin-left: 4px;
    }
    .cond-link { border: none !important; margin-top: 6px; }
    .cond-note { font-size: 11px; color: #6b7280; border: none !important; }

    /* ── ANIMATIONS ─────────────────────────────────────────────── */
    @keyframes fadeInUp {
      from { opacity:0; transform:translateY(10px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .card {
      animation: fadeInUp 0.35s ease-out both;
    }
  </style>
</head>

<body>
  <!-- allsky-common.js registers a document click handler that reads these IDs;
       they must exist in the DOM to avoid null.contains() TypeError. -->
  <div id="nav-menu"          style="display:none;"></div>
  <div id="hamburger-menu-btn" style="display:none;"></div>

  <!-- ═══════════════════ HEADER ═══════════════════════════════════ -->
  <header id="app-header">
    <a class="hdr-brand" href="dashboard.html">
      <img src="allsky360_256x256.png" alt="Allsky360" width="30" height="30" />
      <div class="hdr-brand-text">
        <div class="hdr-title">Allsky360</div>
        <div class="hdr-crumb">Dashboard · Live View</div>
      </div>
    </a>

<div class="hdr-badges">
      <button class="badge badge-gray" id="time-mode-btn" type="button"></button>
      <span class="badge badge-green">
        <span class="badge-dot live-pulse"></span>LIVE
      </span>
      <span class="badge badge-blue"   id="hdr-timer">-- s</span>
      <span class="badge badge-orange" id="hdr-mode">--</span>
      <span class="badge badge-violet" id="hdr-stars">-- ★</span>
    </div>
  </header>

  <!-- ═══════════════════ MAIN LAYOUT ══════════════════════════════ -->
  <div id="main-layout">

    <!-- ── ICON NAV ─────────────────────────────────────────────── -->
    <nav id="icon-nav"></nav>
    <script>renderIconNav();</script>

    <!-- ── LEFT SIDEBAR ──────────────────────────────────────────── -->
    <aside id="left-sidebar" class="sidebar">

      <div class="card">
        <div id="image-data"><div style="color:#6b7280;font-size:12px;">Loading…</div></div>
      </div>

      <div class="card">
        <div id="sunandmoon"><div style="color:#6b7280;font-size:12px;">Loading…</div></div>
        <div style="position:relative;height:130px;margin-top:8px;">
          <canvas id="chartSunMoonAltitude"></canvas>
        </div>
      </div>

      <div class="card" id="mount-card" style="display:none;">
        <div id="mount-widget"></div>
      </div>

      <div class="card" id="spektrum-card" style="display:none;">
        <div id="spektrum-widget"></div>
      </div>

    </aside>

    <!-- ── CENTER AREA ───────────────────────────────────────────── -->
    <main id="center-area">

      <!-- Controls bar -->
      <div id="controls-bar">
        <label class="ctrl-label">
          <input type="checkbox" id="azimutalGridCheckbox" onchange="toggleAzimutalGridOverlay()"> Az Grid
        </label>
        <label class="ctrl-label">
          <input type="checkbox" id="equatorialGridCheckbox" onchange="toggleEquatorialGridOverlay()"> RA/DEC
        </label>
        <label class="ctrl-label">
          <input type="checkbox" id="brightestStarsGridCheckbox" onchange="toggleBrightestStarsOverlay()"> Stars
        </label>
        <label class="ctrl-label">
          <input type="checkbox" id="meteorRadiansCheckbox" onchange="toggleMeteorRadiantsOverlay()"> Meteors
        </label>
        <label class="ctrl-label">
          <input type="checkbox" id="sunMoonCheckbox" onchange="toggleSunMoonOverlay()"> Sun/Moon
        </label>
        <label class="ctrl-label">
          <input type="checkbox" id="detectedStarsCheckbox" onchange="toggleDetectedStarsOverlay()"> Detected ★
        </label>
        <label class="ctrl-label">
          <input type="checkbox" id="mountPositionCheckbox" onchange="toggleMountPosition()"> Mount
        </label>
      </div>

      <!-- Allsky panel (circle + side panel) -->
      <div id="allsky-panel">

        <!-- Allsky image -->
        <div id="allsky-circle-wrap">
          <div class="allsky-zoom-controls">
            <button class="pano-zoom-btn" onclick="zoomIn()"          title="Zoom in">+</button>
            <button class="pano-zoom-btn" onclick="zoomOut()"         title="Zoom out">−</button>
            <button class="pano-zoom-btn" onclick="resetZoomAndPan()" title="Reset">⟳</button>
          </div>
          <div id="image-container">
            <img id="image" src="" alt="Allsky image" />
            <canvas id="allsky-overlay"></canvas>
          </div>
          <div id="allsky-info-overlay">
            <div class="sky-badge-row">
              <span class="sky-badge" id="sky-mode">--</span>
              <span class="sky-badge" id="sky-sqm">SQM --</span>
              <span class="sky-badge" id="sky-stars">-- ★</span>
            </div>
            <div class="sky-badge-row" id="coord-row" style="display:none;">
              <span class="sky-badge" id="coord-xy">X: –, Y: –</span>
              <span class="sky-badge" id="coord-azel">Az: –°, El: –°</span>
              <span class="sky-badge" id="coord-radec">RA: –, Dec: –</span>
            </div>
          </div>
        </div>

        <!-- Side panel: panorama + bottom row -->
        <div id="side-panel">

          <!-- Panorama -->
          <div id="panorama-container">
            <div class="pano-label">Horizon View</div>
            <div id="pano-inner">
              <img id="panorama" src="" alt="Horizon View" draggable="false" />
              <canvas id="panorama-overlay"></canvas>
            </div>
            <div class="pano-zoom-controls">
              <button class="pano-zoom-btn" onclick="panoZoomIn()"    title="Zoom in">+</button>
              <button class="pano-zoom-btn" onclick="panoZoomOut()"   title="Zoom out">−</button>
              <button class="pano-zoom-btn" onclick="panoResetZoom()" title="Reset zoom">⟳</button>
            </div>
          </div>

        </div><!-- #side-panel -->

      </div><!-- #allsky-panel -->

    </main><!-- #center-area -->

    <!-- ── RIGHT SIDEBAR ─────────────────────────────────────────── -->
    <aside id="right-sidebar" class="sidebar">

      <div class="card">
        <div id="weather"><div style="color:#6b7280;font-size:12px;">Loading…</div></div>
      </div>

      <div class="card">
        <div id="tonight"><div style="color:#6b7280;font-size:12px;">Loading…</div></div>
      </div>

      <div class="card">
        <div id="aurora"><div style="color:#6b7280;font-size:12px;">Loading…</div></div>
      </div>

    </aside>

  </div><!-- #main-layout -->

  <script>
    // ══════════════════════════════════════════════════════════════
    //  CHARTS
    // ══════════════════════════════════════════════════════════════
    const charts = {};

    const backgroundSunPlugin = {
      id: 'backgroundSun',
      beforeDraw: (chart) => {
        const { ctx, chartArea, scales } = chart;
        const { x } = scales;
        const periods = chart.options.plugins.backgroundSun?.periods || [];
        if (!chartArea || !periods.length) return;
        periods.forEach(period => {
          const startX = x.getPixelForValue(period.start);
          const endX   = x.getPixelForValue(period.end);
          if (startX < chartArea.right && endX > chartArea.left) {
            ctx.save();
            ctx.fillStyle = period.color;
            ctx.fillRect(
              Math.max(startX, chartArea.left), chartArea.top,
              Math.min(endX, chartArea.right) - Math.max(startX, chartArea.left),
              chartArea.bottom - chartArea.top
            );
            ctx.restore();
          }
        });
      }
    };

    function initCharts() {
      Chart.register(backgroundSunPlugin);

      // Sun/Moon altitude chart (linear x-axis)
      const sunMoonCanvas = document.getElementById("chartSunMoonAltitude");
      if (sunMoonCanvas) {
        const ctx2 = sunMoonCanvas.getContext('2d');
        charts.chartSunMoonAltitude = new Chart(ctx2, {
          type: 'line',
          data: {
            labels: [],
            datasets: [
              { label:"Sun Altitude",  data:[], borderColor:"gold",      fill:false, pointRadius:0, spanGaps:true },
              { label:"Moon Altitude", data:[], borderColor:"lightgray", fill:false, pointRadius:0, spanGaps:true }
            ]
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            scales: {
              x: {
                type: 'linear', position: 'bottom',
                title: { display: true, text: 'Hours from now', color: '#6b7280', font:{size:9} },
                ticks: { color: '#6b7280', stepSize: 4, maxTicksLimit: 7 },
                grid:  { color: 'rgba(255,255,255,0.06)' }
              },
              y: {
                type: 'linear', min: 0,
                title: { display: true, text: 'Altitude (°)', color: '#6b7280', font:{size:9} },
                ticks: { color: '#6b7280' },
                grid:  { color: 'rgba(255,255,255,0.06)' }
              }
            },
            plugins: {
              title:  { display: true, text: "Sun/Moon Altitude (24h)", color: "#9ca3af", font:{size:11}, padding:{bottom:4} },
              legend: { display: true, labels: { color: '#9ca3af', boxWidth: 2, boxHeight: 2, font:{size:10} } },
              backgroundSun: { periods: [] }
            }
          }
        });
      }

      loadConditions();
      // Station time zone learnt or UTC/local switched: show everything anew
      // loadLatestImage() returns at once while a load is running: retry
      // until it is free, so the switch is never lost
      const reloadImagePanel = () => {
        if (loading) { setTimeout(reloadImagePanel, 300); return; }
        loadLatestImage();
      };
      window.addEventListener('allsky-timezone-change', () => {
        loadConditions();
        reloadImagePanel();
      });
      setInterval(loadConditions, 60000);
    }

    // ══════════════════════════════════════════════════════════════
    //  CONDITIONS (right sidebar): station sensors, forecast, aurora
    // ══════════════════════════════════════════════════════════════
    const isNum = (v) => typeof v === 'number' && Number.isFinite(v);
    const SENSOR_FRESH_S = 30 * 60;      // older station readings: model values instead
    const FORECAST_STALE_S = 90 * 60;    // the meteo timer runs every 30 min
    const AURORA_STALE_S = 30 * 60;      // the aurora timer runs every 5 min

    function cardinal(deg) {
      const dirs = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE',
                    'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
      return dirs[Math.round((((deg % 360) + 360) % 360) / 22.5) % 16];
    }
    const row = (label, value, cls = '', title = '') =>
      `<div${title ? ` title="${title}"` : ''}>${label} <span${cls ? ` class="${cls}"` : ''}>${value}</span></div>`;
    const cloudSwatch = (v) => `<span class="cloud-swatch" style="background:${cloudCoverToRGB(v)}"></span>`;

    async function fetchJson(url) {
      try {
        const r = await fetch(url, { cache: 'no-cache' });
        return r.ok ? await r.json() : null;
      } catch { return null; }
    }

    // Measured values of the station; the Open-Meteo model only fills in
    // what the station cannot measure (clouds, jetstream) or when the
    // sensors are missing or stale
    function renderWeather(sensor, model) {
      const now = Date.now() / 1000;
      const fresh = sensor && isNum(sensor.timestamp) && now - sensor.timestamp < SENSOR_FRESH_S;
      const src = fresh ? `station · ${formatClock(sensor.timestamp)}` : model ? 'Open-Meteo model' : '';
      let html = `<div class="metadata-section"><h2>Weather${src ? ` <span class="h2-sub">· ${src}</span>` : ''}</h2>`;
      const w = fresh ? sensor : model;
      if (w) {
        if (isNum(w.temperature)) html += row('Temperature', `${w.temperature.toFixed(1)} °C`);
        if (isNum(w.humidity))    html += row('Humidity', `${w.humidity.toFixed(0)} %`);
        if (isNum(w.temperature) && isNum(w.dew_point)) {
          const spread = w.temperature - w.dew_point;
          html += row('Dew point', `${w.dew_point.toFixed(1)} °C · ${spread.toFixed(1)} K`,
                      spread < FORECAST_DEW_SPREAD_WARN ? 'warn' : '', 'Dew point and how far the air is above it');
        }
        if (fresh) {
          if (isNum(sensor.pressure)) html += row('Pressure', `${sensor.pressure.toFixed(0)} hPa`);
          // anemometer first, the weather sensor's wind otherwise (m/s)
          const ws = isNum(sensor.wind_speed) ? sensor.wind_speed : sensor.ws_wind_speed;
          const wd = isNum(sensor.wind_speed) ? sensor.wind_direction : sensor.ws_wind_direction;
          if (isNum(ws)) html += row('Wind', `${(ws * 3.6).toFixed(0)} km/h${isNum(wd) ? ' ' + cardinal(wd) : ''}`);
          if (isNum(sensor.rainfall) && sensor.rainfall > 0) html += row('Rain', `${sensor.rainfall.toFixed(1)} mm`, 'warn');
        } else {
          if (isNum(w.pressure_msl)) html += row('Pressure MSL', `${w.pressure_msl.toFixed(0)} hPa`);
          if (isNum(w.wind_speed_10m))
            html += row('Wind 10 m', `${w.wind_speed_10m.toFixed(0)} km/h${isNum(w.wind_dir_10m) ? ' ' + cardinal(w.wind_dir_10m) : ''}`);
        }
      }
      if (model) {
        if (isNum(model.cloud_cover))
          html += row('Clouds (model)', `${model.cloud_cover.toFixed(0)} %${cloudSwatch(model.cloud_cover)}`, '',
                      ['low', 'mid', 'high'].map(k => isNum(model['cloud_' + k]) ? `${k} ${model['cloud_' + k].toFixed(0)} %` : '').filter(Boolean).join(' · '));
        if (isNum(model.wind_speed_300hPa))
          html += row('Seeing (jetstream)', `${model.wind_speed_300hPa.toFixed(0)} km/h ${getSeeingLabel(model.wind_speed_300hPa)}`);
      }
      if (!w && !model) html += '<div class="cond-note">No weather data yet.</div>';
      html += '<div class="cond-link"><a href="meteo.html">Weather &amp; sensors →</a></div></div>';
      document.getElementById('weather').innerHTML = html;
    }

    // The coming night from forecast_meteo.json (written by the meteo tool)
    function renderTonight(fc) {
      const now = Date.now() / 1000;
      const hours = (fc && Array.isArray(fc.hours) ? fc.hours : []).filter(h => isNum(h.timestamp) && h.timestamp + 3600 > now);
      let html = '<div class="metadata-section"><h2>Tonight <span class="h2-sub">· forecast</span></h2>';
      if (!hours.length) {
        html += '<div class="cond-note">No forecast yet (allsky360-meteo.timer writes it every 30 min).</div>';
      } else {
        const t = forecastTonight(hours);
        if (t.night) {
          const nh = t.nightHours;
          html += row(t.night[0] === 0 ? 'Dark until' : 'Dark',
                      t.night[0] === 0 ? formatClock(nh[nh.length - 1].timestamp + 3600) : hourSpanText(hours, t.night));
          html += row('Clear sky', t.clear.length ? t.clear.map(r => hourSpanText(nh, r)).join('<br>') : 'not expected',
                      t.clear.length ? 'good' : '', `Total cloud cover ≤ ${FORECAST_CLEAR_MAX} % for at least ${FORECAST_CLEAR_MIN_HOURS} h`);
          const jets = nh.map(h => h.wind_speed_300hPa).filter(isNum);
          if (jets.length) {
            const avg = jets.reduce((a, b) => a + b, 0) / jets.length;
            html += row('Seeing', `${Math.min(...jets).toFixed(0)}–${Math.max(...jets).toFixed(0)} km/h ${getSeeingLabel(avg)}`,
                        '', 'Jetstream at 9.2 km during the dark hours');
          }
          if (t.dewHours.length)
            html += row('Dew risk', `${t.dewHours.length} h`, 'warn', `Air less than ${FORECAST_DEW_SPREAD_WARN} K above the dew point`);
        } else {
          html += row('Dark', 'not within 24 h');
        }
        if (t.rain) html += row('Rain likely', hourSpanText(hours, t.rain), 'warn');
        if (t.maxGust >= FORECAST_GUST_WARN) html += row('Gusts', `up to ${t.maxGust.toFixed(0)} km/h`, 'warn');
        if (isNum(fc.generated) && now - fc.generated > FORECAST_STALE_S)
          html += `<div class="cond-note">Forecast from ${formatDateTime(fc.generated, { seconds: false })}: check allsky360-meteo.timer</div>`;
      }
      html += '<div class="cond-link"><a href="meteo.html">Hourly forecast →</a></div></div>';
      document.getElementById('tonight').innerHTML = html;
    }

    // Rough assessment for mid latitudes: the probability is the OVATION
    // value at the station, Kp and a southward Bz drive activity
    function auroraLevel(a) {
      const p = isNum(a.probability_percent) ? a.probability_percent : 0;
      if (p >= 10 || (isNum(a.kp_index) && a.kp_index >= 6)) return { text: 'chance of aurora', cls: 'good' };
      if ((isNum(a.kp_index) && a.kp_index >= 4) || (isNum(a.bz) && a.bz <= -5)) return { text: 'active', cls: 'warn' };
      return { text: 'quiet', cls: '' };
    }
    function renderAurora(a) {
      let html = '<div class="metadata-section">';
      if (!a) {
        html += '<h2>Aurora</h2><div class="cond-note">No aurora data yet.</div>';
      } else {
        const level = auroraLevel(a);
        html += `<h2>Aurora <span class="h2-sub">· <span class="${level.cls}" style="font-weight:600">${level.text}</span></span></h2>`;
        html += row('Kp index', fmtNum(a.kp_index, 1), isNum(a.kp_index) && a.kp_index >= 5 ? 'good' : '');
        html += row('Probability', `${fmtNum(a.probability_percent, 0)} %`);
        html += row('Bz', isNum(a.bz) ? `${a.bz.toFixed(1)} nT${a.bz < 0 ? ' (south)' : ''}` : '–',
                    isNum(a.bz) && a.bz <= -10 ? 'bad' : isNum(a.bz) && a.bz <= -5 ? 'warn' : '',
                    'Southward (negative) Bz couples the solar wind to the magnetosphere');
        html += row('Solar wind', isNum(a.speed) ? `${a.speed.toFixed(0)} km/s` : '–');
        const obs = a.observation_time;
        if (isNum(obs) && Date.now() / 1000 - obs > AURORA_STALE_S)
          html += `<div class="cond-note">Data from ${formatDateTime(obs, { seconds: false })}: check allsky360-aurora.timer</div>`;
      }

    // RAF throttling

    function scheduleOverlayRedraw() {
      if (overlayRafId) return;
      overlayRafId = requestAnimationFrame(() => {
        overlayRafId = 0;
        if (pendingMouse) {
          const { canvasRect, clientX, clientY } = pendingMouse;
          mouseX = clientX - canvasRect.left;
          mouseY = clientY - canvasRect.top;
          pendingMouse = null;
        }
        updateAllskyOverlay();
      });
    }

    container.addEventListener("wheel", (e) => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.2 : (1 / 1.2);
      zoomFactor *= factor;
      if (zoomFactor < 1.0) { zoomFactor = 1.0; panX = 0; panY = 0; }
      updateZoomAndPan();
    }, { passive: false });

    container.addEventListener("mousedown", (e) => {
      isDragging = true;
      dragStartX = e.clientX - panX;
      dragStartY = e.clientY - panY;

    container.addEventListener("mousemove", (e) => {
      if (isDragging) {
        panX = e.clientX - dragStartX;
        panY = e.clientY - dragStartY;
        schedulePanRedraw();
      }
    }, { passive: true });
    container.addEventListener("mouseup",    () => { isDragging = false; });

                 e.clientX - rect.left, e.clientY - rect.top);
    }, { passive: false });

    panoContainer.addEventListener("dblclick", (e) => {
      if (e.target.closest(".pano-zoom-controls")) return;

    panoContainer.addEventListener("mousedown", (e) => {
      if (e.button !== 0 || e.target.closest(".pano-zoom-controls")) return;
      const r = panoRect();
      if (!r || (r.w <= r.cw && r.h <= r.ch)) return;   // nothing to pan
      e.preventDefault();                         // block native image drag
      panoIsDragging = true;
      panoDragStartX = e.clientX - panoPanX;
      panoDragStartY = e.clientY - panoPanY;
      const inner = document.getElementById("pano-inner");
      if (inner) inner.classList.add("dragging");

      // Attach move/up on window so fast mouse movement outside container still works
      function onMove(ev) {
        panoPanX = ev.clientX - panoDragStartX;
        panoPanY = ev.clientY - panoDragStartY;
        if (panoRafId) return;
        panoRafId = requestAnimationFrame(() => { panoRafId = 0; updatePanoZoom(); });
      }
      function onUp() {
        panoIsDragging = false;
        const inner2 = document.getElementById("pano-inner");
        if (inner2) inner2.classList.remove("dragging");
        window.removeEventListener("mousemove", onMove);
        window.removeEventListener("mouseup",   onUp);
      }
      window.addEventListener("mousemove", onMove);
      window.addEventListener("mouseup",   onUp);
    });

    // set: an onload assigned after the src can miss a fast (cached) load and

    panoramaEl.addEventListener("load", () => { try { updatePanoZoom(); } catch (e) {} });
    if (panoramaEl.complete && panoramaEl.naturalWidth) updatePanoZoom();

      new ResizeObserver(() => updatePanoZoom()).observe(panoContainer);

    function updateZoomAndPan() {

    function zoomOut() {
      zoomFactor /= 1.2;
      if (zoomFactor !== 1.0) {
        showAzimutalGrid = false;
        showEquatorialGrid = false; showBrightestStars = false;
        showMeteorRadiants = false; showDetectedStars = false;

    // ── Panorama zoom/pan functions ──────────────────────────────────
    // Displayed size of the panorama: at panoZoom 1 its width equals the
    // widget width. Pan offsets are clamped so the image cannot be dragged
    // out of view; an axis that fits completely stays centred.
    function panoRect() {
      const img = panoramaEl;
      if (!img || !img.naturalWidth || !img.naturalHeight) return null;
      const cw = panoContainer.clientWidth;
      const ch = panoContainer.clientHeight;
      if (!cw || !ch) return null;
      const w = cw * panoZoom;
      const h = w * img.naturalHeight / img.naturalWidth;
      const maxX = Math.max(0, (w - cw) / 2);
      const maxY = Math.max(0, (h - ch) / 2);
      panoPanX = Math.min(maxX, Math.max(-maxX, panoPanX));
      panoPanY = Math.min(maxY, Math.max(-maxY, panoPanY));
      return { cw, ch, w, h,
               left: (cw - w) / 2 + panoPanX,
               top:  (ch - h) / 2 + panoPanY };
    }

    function updatePanoZoom() {
      const r = panoRect();
      if (!r) return;
      panoramaEl.style.left   = `${r.left}px`;
      panoramaEl.style.top    = `${r.top}px`;
      panoramaEl.style.width  = `${r.w}px`;
      panoramaEl.style.height = `${r.h}px`;
      panoramaEl.style.visibility = "visible";
      updatePanoramaOverlay();
    }

    // Zoom by factor, keeping the point (px, py) of the widget in place
    function panoZoomBy(factor, px, py) {
      const old = panoRect();
      const z = Math.min(PANO_ZOOM_MAX, Math.max(PANO_ZOOM_MIN, panoZoom * factor));
      if (!old || z === panoZoom) { panoZoom = z; updatePanoZoom(); return; }
      if (px === undefined) { px = old.cw / 2; py = old.ch / 2; }
      // Image point under (px, py), relative to the image centre
      const f = z / panoZoom;
      const ix = px - (old.left + old.w / 2);
      const iy = py - (old.top + old.h / 2);
      panoZoom = z;
      panoPanX += ix - ix * f;
      panoPanY += iy - iy * f;
      updatePanoZoom();
    }
    function panoZoomIn()  { panoZoomBy(1.2); }
    function panoZoomOut() { panoZoomBy(1 / 1.2); }
    function panoResetZoom() {
      panoZoom = PANO_ZOOM_MIN; panoPanX = 0; panoPanY = 0;
      updatePanoZoom();
    }

    function updateMountWidget() {
      const card = document.getElementById('mount-card');
      const el   = document.getElementById('mount-widget');
      if (!el) return;
      if (!mountData) {
        if (card) card.style.display = 'none';
        return;
      }
      const eq = mountData.equatorial || {};
      const hz = mountData.horizontal || {};
      const raH   = eq.ra_h   != null ? eq.ra_h   : null;
      const decD  = eq.dec_deg != null ? eq.dec_deg : null;
      const altD  = hz.alt_deg != null ? hz.alt_deg : null;
      const azD   = hz.az_deg  != null ? hz.az_deg  : null;
      function raToHMS(h) {
        const hh = Math.floor(h);
        const mm = Math.floor((h - hh) * 60);
        const ss = Math.round(((h - hh) * 60 - mm) * 60);
        return `${String(hh).padStart(2,'0')}h ${String(mm).padStart(2,'0')}m ${String(ss).padStart(2,'0')}s`;
      }
      function decToDMS(d) {
        const sign = d < 0 ? '−' : '+';
        const abs  = Math.abs(d);
        const dd   = Math.floor(abs);
        const mm   = Math.floor((abs - dd) * 60);
        const ss   = Math.round(((abs - dd) * 60 - mm) * 60);
        return `${sign}${String(dd).padStart(2,'0')}° ${String(mm).padStart(2,'0')}′ ${String(ss).padStart(2,'0')}″`;
      }
      const trackingColor = mountData.tracking ? '#4ade80' : '#f87171';
      const trackingLabel = mountData.tracking ? 'On' : 'Off';
      const pierLabel     = mountData.side_of_pier || '—';
      el.innerHTML = `<div class="metadata-section">
        <h2>Mount</h2>
        ${mountData.mount ? `<div>Name <span>${mountData.mount}</span></div>` : ''}
        ${raH  != null ? `<div>RA  <span>${raToHMS(raH)}</span></div>` : ''}
        ${decD != null ? `<div>Dec <span>${decToDMS(decD)}</span></div>` : ''}
        ${altD != null ? `<div>Alt <span>${altD.toFixed(2)}°</span></div>` : ''}
        ${azD  != null ? `<div>Az  <span>${azD.toFixed(2)}°</span></div>` : ''}
        <div>Pier <span>${pierLabel}</span></div>
        <div>Tracking <span style="color:${trackingColor}">${trackingLabel}</span></div>
      </div>`;
      if (card) card.style.display = '';
    }

    // ── SPEKTRUM WIDGET ─────────────────────────────────────────────

    let spektrumData = null;

    async function loadSpektrumData() {
      try {
        const resp = await fetch('images/spektrum.json', { cache: "no-cache" });
        spektrumData = resp.ok ? await resp.json() : null;
      } catch { spektrumData = null; }

    function updateSpektrumWidget() {
      const card = document.getElementById('spektrum-card');
      const el   = document.getElementById('spektrum-widget');
      if (!el) return;
      if (!spektrumData || !spektrumData.spectrum || spektrumData.spectrum.length === 0) {
        if (card) card.style.display = 'none';
        return;
      }
      if (card) card.style.display = '';

      /* Find peak wavelength */
      const spec = spektrumData.spectrum;
      let peakIdx = 0;
      for (let j = 1; j < spec.length; j++) {
        if (spec[j] > spec[peakIdx]) peakIdx = j;
      }
      const peakNm = (spektrumData.wavelengths_nm && spektrumData.wavelengths_nm[peakIdx] != null)
        ? spektrumData.wavelengths_nm[peakIdx]
        : 400 + peakIdx * 10;

      const rgb   = spektrumData.mean_rgb || [0, 0, 0];
      const npix  = spektrumData.pixels_used || 0;

      el.innerHTML = `
        <div class="metadata-section">
          <h2>Spektrum</h2>
          <div>Peak <span>${peakNm} nm</span></div>
          <div>Pixel <span>${npix.toLocaleString()}</span></div>
          <div>RGB <span>${rgb[0].toFixed(4)} / ${rgb[1].toFixed(4)} / ${rgb[2].toFixed(4)}</span></div>
        </div>
        <canvas id="spektrum-canvas" style="width:100%;height:110px;display:block;margin-top:6px;"></canvas>`;

      /* Draw after DOM is updated */
      requestAnimationFrame(() => drawSpektrumCanvas(spec, peakIdx));
    }

    function drawSpektrumCanvas(spec, peakIdx) {
      const canvas = document.getElementById('spektrum-canvas');
      if (!canvas) return;

      /* Match CSS size to device pixels */
      const W = canvas.offsetWidth  || 260;
      const H = canvas.offsetHeight || 110;
      canvas.width  = W;
      canvas.height = H;

      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, W, H);

      const PAD_L = 6, PAD_R = 6, PAD_T = 6, PAD_B = 22;
      const gW = W - PAD_L - PAD_R;
      const gH = H - PAD_T - PAD_B;
      const N  = spec.length;   /* 31 bins, 400–700 nm */

      /* Map bin index → canvas X */
      function binX(j) { return PAD_L + (j / (N - 1)) * gW; }
      /* Map value [0–1] → canvas Y */
      function valY(v) { return PAD_T + gH - v * gH; }

      /* ── Visible-light spectrum gradient (horizontal) ── */
      const grad = ctx.createLinearGradient(PAD_L, 0, PAD_L + gW, 0);
      /* Stops tuned to the actual CIE chromaticity of visible light */
      grad.addColorStop(0.000, 'rgba(100,  0,180, 0.85)');  /* 400 nm  violet  */
      grad.addColorStop(0.100, 'rgba( 60, 20,220, 0.85)');  /* 430 nm  indigo  */
      grad.addColorStop(0.200, 'rgba(  0, 80,255, 0.85)');  /* 460 nm  blue    */
      grad.addColorStop(0.333, 'rgba(  0,210,200, 0.85)');  /* 500 nm  cyan    */
      grad.addColorStop(0.450, 'rgba(  0,200,  0, 0.85)');  /* 535 nm  green   */
      grad.addColorStop(0.600, 'rgba(200,220,  0, 0.85)');  /* 580 nm  yellow  */
      grad.addColorStop(0.700, 'rgba(255,140,  0, 0.85)');  /* 610 nm  orange  */
      grad.addColorStop(0.850, 'rgba(220,  0,  0, 0.85)');  /* 655 nm  red     */
      grad.addColorStop(1.000, 'rgba(120,  0,  0, 0.85)');  /* 700 nm  dark red*/

      /* ── Build spectrum path ── */
      ctx.beginPath();
      ctx.moveTo(binX(0), valY(spec[0]));
      for (let j = 1; j < N; j++) ctx.lineTo(binX(j), valY(spec[j]));

      /* ── Filled area under curve with gradient ── */
      ctx.save();
      ctx.stroke();   /* draw outline first with default to measure clip */
      ctx.restore();

      /* Clip to area below the curve */
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(binX(0), valY(spec[0]));
      for (let j = 1; j < N; j++) ctx.lineTo(binX(j), valY(spec[j]));
      ctx.lineTo(binX(N - 1), PAD_T + gH);
      ctx.lineTo(binX(0),     PAD_T + gH);
      ctx.closePath();
      ctx.clip();
      ctx.fillStyle = grad;
      ctx.fillRect(PAD_L, PAD_T, gW, gH);
      ctx.restore();

      /* ── Bright curve line on top ── */
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(binX(0), valY(spec[0]));
      for (let j = 1; j < N; j++) ctx.lineTo(binX(j), valY(spec[j]));
      ctx.strokeStyle = 'rgba(255,255,255,0.55)';
      ctx.lineWidth   = 1.5;
      ctx.lineJoin    = 'round';
      ctx.stroke();
      ctx.restore();

      /* ── Peak marker ── */
      ctx.save();
      const px = binX(peakIdx);
      const py = valY(spec[peakIdx]);
      ctx.beginPath();
      ctx.arc(px, py, 3, 0, 2 * Math.PI);
      ctx.fillStyle   = '#ffffff';
      ctx.strokeStyle = 'rgba(0,0,0,0.4)';
      ctx.lineWidth   = 1;
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      /* ── X-axis wavelength labels ── */
      ctx.fillStyle = 'rgba(180,180,180,0.8)';
      ctx.font      = '9px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      const labelNm = [400, 450, 500, 550, 600, 650, 700];
      for (const nm of labelNm) {
        const j = (nm - 400) / 10;
        ctx.fillText(nm, binX(j), PAD_T + gH + 4);
      }

      /* ── Baseline ── */
      ctx.beginPath();
      ctx.moveTo(PAD_L, PAD_T + gH);
      ctx.lineTo(PAD_L + gW, PAD_T + gH);
      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx.lineWidth   = 1;
      ctx.stroke();
    }

          } catch { starPositions = []; }
        } else {
          starPositions = [];
        }

        // Image metadata
        let imageMeta = null;
        try {
          const r = await fetch(`images/${todayStr}/image-${imageDateTime}.json`, { cache: "no-cache" });
          imageMeta = await r.json();
        } catch { /* optional */ }

        const handleImageLoaded = () => {
          // Reset loading state FIRST — before anything that might throw — so the
          // timer is never stuck even if overlay rendering fails.
          loading = false;
          lastImageLoadTime = Date.now();
          try { updateAllskyOverlay(); } catch (e) { console.warn("overlay update error:", e); }
        };

        if (imageAlreadyLoaded) {
          handleImageLoaded();
        } else {
          imageEl.onload  = handleImageLoaded;
          imageEl.onerror = () => { loading = false; lastImageLoadTime = Date.now(); };
        }

        panoramaEl.onerror = () => {};

        if (!imageMeta) {
          if (imageDataEl)  imageDataEl.innerHTML  = "";
          if (sunandmoonEl) sunandmoonEl.innerHTML = "";
          loading = false;
          refreshInterval = 10;
          lastImageLoadTime = Date.now();
          if (timerEl) timerEl.textContent = refreshInterval;
          restartTimer();
          return;
        }

        imageTimestamp  = imageMeta.timestamp;
        timezoneOffset  = imageMeta.timezone_offset;

        refreshInterval = (typeof imageMeta.capture_interval === "number" && imageMeta.capture_interval > 0)
          ? Math.round(imageMeta.capture_interval) : 10;

        if (timerEl) timerEl.textContent = refreshInterval;
        restartTimer();

        // Update header badges
        updateHeaderBadges(imageMeta);

        // Update sky overlay badges
        updateSkyBadges(imageMeta);

        // Build image data HTML
        let imageDataHtml = `<div class="metadata-section">
          <h2>Image Data</h2>
          <div>Timestamp <span>${formatDateTime(imageMeta.timestamp)}</span></div>
          <div>${getTimeMode() === 'utc' ? 'Local' : 'UTC'} <span>${formatDateTime(imageMeta.timestamp, { tz: getTimeMode() === 'utc' ? getStationTimeZone() : 'UTC' })}</span></div>
          <div>Exposure t0 (s) <span>${imageMeta.exposure_t0.toFixed(5)}</span></div>`;
        if (imageMeta.hdr > 1) imageDataHtml += `<div>Exposure t1 (s) <span>${imageMeta.exposure_t1.toFixed(5)}</span></div>`;
        if (imageMeta.hdr > 2) imageDataHtml += `<div>Exposure t2 (s) <span>${imageMeta.exposure_t2.toFixed(5)}</span></div>`;
        if (imageMeta.hdr > 3) imageDataHtml += `<div>Exposure t3 (s) <span>${imageMeta.exposure_t3.toFixed(5)}</span></div>`;
        if (imageMeta.hdr > 4) imageDataHtml += `<div>Exposure t4 (s) <span>${imageMeta.exposure_t4.toFixed(5)}</span></div>`;
        imageDataHtml += `<div>Gain <span>${imageMeta.gain.toFixed(1)}</span></div>`;
        if (imageMeta.night_mode) {
          imageDataHtml += `
            <div>BG noise t0 <span>${imageMeta.sigma_noise_t0.toFixed(8)}</span></div>
            <div>BG noise t1 <span>${imageMeta.sigma_noise_t1.toFixed(8)}</span></div>
            <div>BG noise t2 <span>${imageMeta.sigma_noise_t2.toFixed(8)}</span></div>
            <div>BG noise t3 <span>${imageMeta.sigma_noise_t3.toFixed(8)}</span></div>
            <div>BG noise t4 <span>${imageMeta.sigma_noise_t4.toFixed(8)}</span></div>`;
        }
        if (imageMeta.width)  imageDataHtml += `<div>Width  <span>${imageMeta.width} px</span></div>`;
        if (imageMeta.height) imageDataHtml += `<div>Height <span>${imageMeta.height} px</span></div>`;
        imageDataHtml += `<div>Sensor temp (°C) <span>${imageMeta.sensor_temperature.toFixed(1)}</span></div>`;
        imageDataHtml += `<div>Brightness <span>${imageMeta.mean_brightness.toFixed(2)} → ${imageMeta.target_brightness.toFixed(2)}</span></div>`;
        if (imageMeta.focus) imageDataHtml += `<div>Focus <span>${imageMeta.focus.toFixed(2)}</span></div>`;
        if (imageMeta.night_mode) {
          imageDataHtml += `<div>Star count <span>${imageMeta.stars}</span></div>
            <div>SQM (mag/arcs²) <span>${imageMeta.sqm.toFixed(1)}</span></div>`;
        }
        imageDataHtml += `<div>Interval (s) <span>${imageMeta.capture_interval}</span></div>
          <div>Night mode <span>${getSymbol(imageMeta.night_mode)}</span></div>
          <div>HDR <span>${imageMeta.hdr}</span></div>
        </div>`;

        // Set image-data immediately — independent of sun/moon calculations
        if (imageDataEl) imageDataEl.innerHTML = imageDataHtml;

        // Sun/Moon HTML — requires astronomia library (loaded with defer); wrap so failures
        // don't block the widgets above. On first load the library may not be ready yet.
        try {
          const moonTimes = getMoonRiseAndSet(imageTimestamp, latitude, longitude, timezoneOffset);
          const moonRiseStr = moonTimes.moonRise ? formatTimeString(moonTimes.moonRise, timezoneOffset) : "N/A";
          const moonSetStr  = moonTimes.moonSet  ? formatTimeString(moonTimes.moonSet,  timezoneOffset) : "N/A";
          const moonTimeUntil = getTimeUntilMoonRiseSet(moonTimes.moonRise, moonTimes.moonSet, imageTimestamp, timezoneOffset);
          const sunTimesObj   = getSunRiseAndSet(imageTimestamp, latitude, longitude, timezoneOffset);
          const sunRiseStr    = sunTimesObj.sunRise ? formatTimeString(sunTimesObj.sunRise, timezoneOffset) : "N/A";
          const sunSetStr     = sunTimesObj.sunSet  ? formatTimeString(sunTimesObj.sunSet,  timezoneOffset) : "N/A";
          const sunTimeUntil  = getTimeUntilSunRiseSet(sunTimesObj.sunRise, sunTimesObj.sunSet, imageTimestamp, timezoneOffset);

          const sunandmoonHtml = `<div class="metadata-section">
            <h2>Sun &amp; Moon <span style="font-weight:400;color:#6b7280">· times ${timeZoneLabel(imageTimestamp)}</span></h2>
            <div>Sun altitude (°) <span>${imageMeta.sun_altitude != null ? imageMeta.sun_altitude.toFixed(1) : "N/A"}</span></div>
            <div>Sun rise <span>${sunRiseStr}</span></div>
            <div>Sun set  <span>${sunSetStr}</span></div>
            <div>To sun rise <span>${sunTimeUntil.timeUntilRise || "N/A"}</span></div>
            <div>To sun set  <span>${sunTimeUntil.timeUntilSet  || "N/A"}</span></div>
            <div>Moon phase (%) <span>${imageMeta.moon_phase_percentage != null ? imageMeta.moon_phase_percentage.toFixed(1) : "N/A"}</span></div>
            <div>Moon altitude (°) <span>${imageMeta.moon_altitude != null ? imageMeta.moon_altitude.toFixed(1) : "N/A"}</span></div>
            <div>Moon rise <span>${moonRiseStr}</span></div>
            <div>Moon set  <span>${moonSetStr}</span></div>
            <div>To moon rise <span>${moonTimeUntil.timeUntilRise || "N/A"}</span></div>
            <div>To moon set  <span>${moonTimeUntil.timeUntilSet  || "N/A"}</span></div>
          </div>`;
          if (sunandmoonEl) sunandmoonEl.innerHTML = sunandmoonHtml;
        } catch (e) {
          console.warn("Sun/Moon calc error (astronomia may not be ready):", e);
          if (sunandmoonEl) sunandmoonEl.innerHTML =
            '<div class="metadata-section"><h2>Sun &amp; Moon</h2><p style="color:#888;margin:8px 0">Calculating...</p></div>';
        }

        updateSunMoonAltitudeChart();

      } catch (err) {
        console.error("⚠️ Unexpected load error:", err);
        loading = false;
        // Ensure the timer doesn't rapid-fire on repeated fetch errors
        lastImageLoadTime = Date.now();
      }
    }

    function updateHeaderBadges(imageMeta) {
      const modeEl  = document.getElementById('hdr-mode');
      const starsEl = document.getElementById('hdr-stars');
      if (modeEl) modeEl.textContent = imageMeta.night_mode ? '🌙 Night' : '☀️ Day';
      if (starsEl && imageMeta.night_mode && imageMeta.stars !== undefined)
        starsEl.textContent = `${imageMeta.stars} ★`;
      else if (starsEl) starsEl.textContent = '--';
    }

    function updateSkyBadges(imageMeta) {
      const modeEl  = document.getElementById('sky-mode');
      const sqmEl   = document.getElementById('sky-sqm');
      const starsEl = document.getElementById('sky-stars');
      if (modeEl)  modeEl.textContent  = imageMeta.night_mode ? '🌙 Night' : '☀️ Day';
      if (sqmEl)   sqmEl.textContent   = imageMeta.night_mode ? `SQM ${imageMeta.sqm.toFixed(1)}` : 'SQM --';
      if (starsEl) starsEl.textContent = imageMeta.night_mode ? `${imageMeta.stars} ★` : '--';
    }

    function updateSunMoonAltitudeChart() {
      if (!charts.chartSunMoonAltitude || !imageTimestamp || latitude === undefined || longitude === undefined) return;
      const hours = [], sunAlts = [], moonAlts = [];
      for (let offset = -12 * 3600; offset <= 12 * 3600; offset += 1800) {
        const t = imageTimestamp + offset;
        hours.push(offset / 3600);
        const sun  = getSunRaDec(t);
        const sunA = raDecToAzAlt(sun.ra, sun.dec, latitude, longitude, t);
        sunAlts.push(sunA.altitude > 0 ? sunA.altitude : null);
        const moon  = getMoonRaDec(t);
        const moonA = raDecToAzAlt(moon.ra, moon.dec, latitude, longitude, t);
        moonAlts.push(moonA.altitude > 0 ? moonA.altitude : null);
      }
      let maxAlt = 0;
      sunAlts.forEach(v => { if (v !== null && v > maxAlt) maxAlt = v; });
      moonAlts.forEach(v => { if (v !== null && v > maxAlt) maxAlt = v; });

      charts.chartSunMoonAltitude.data.labels = hours;
      charts.chartSunMoonAltitude.data.datasets[0].data = sunAlts;
      charts.chartSunMoonAltitude.data.datasets[1].data = moonAlts;

      const stObj = getSunRiseAndSet(imageTimestamp, latitude, longitude, timezoneOffset);
      const bgPeriods = [];
      if (stObj.sunRise && stObj.sunSet) {
        const riseH = (stObj.sunRise + timezoneOffset - (imageTimestamp + timezoneOffset)) / 3600;
        const setH  = (stObj.sunSet  + timezoneOffset - (imageTimestamp + timezoneOffset)) / 3600;
        const w = [-12, 12];
        if (riseH > w[0]) bgPeriods.push({ start: w[0], end: Math.max(w[0], riseH), color:'rgba(0,0,100,0.35)' });
        if (riseH < w[1] && setH > w[0]) bgPeriods.push({ start: Math.max(w[0], riseH), end: Math.min(w[1], setH), color:'rgba(160,190,255,0.25)' });
        if (setH < w[1]) bgPeriods.push({ start: Math.min(w[1], setH), end: w[1], color:'rgba(0,0,100,0.35)' });
      }
      if (charts.chartSunMoonAltitude.options.plugins.backgroundSun)
        charts.chartSunMoonAltitude.options.plugins.backgroundSun.periods = bgPeriods;
      charts.chartSunMoonAltitude.options.scales.y.max = Math.ceil(maxAlt + 5);
      charts.chartSunMoonAltitude.update();
    }

    // ══════════════════════════════════════════════════════════════
    //  TIMER
    // ══════════════════════════════════════════════════════════════
    function tick() {
      const elapsed   = Math.floor((Date.now() - lastImageLoadTime) / 1000);
      const remaining = Math.max(refreshInterval - elapsed, 0);

      if (timerEl) timerEl.textContent = remaining;

      // Update premium countdown display
      const cntdVal = document.getElementById('cntd-value');
      if (cntdVal) cntdVal.textContent = remaining;
      const hdrTimer = document.getElementById('hdr-timer');
      if (hdrTimer) hdrTimer.textContent = `${remaining} s`;

      if (remaining <= 0 && !loading) loadLatestImage();
      timerTimeout = setTimeout(tick, 1000);
    }

    function restartTimer() {
      if (timerTimeout !== null) clearTimeout(timerTimeout);
      lastImageLoadTime = Date.now();
      tick();
    }

    // ══════════════════════════════════════════════════════════════
    //  ALLSKY OVERLAY
    // ══════════════════════════════════════════════════════════════
    function updateAllskyOverlay() {
      const canvas = document.getElementById("allsky-overlay");
      const imgEl2 = document.getElementById("image");
      canvas.width  = imgEl2.clientWidth;
      canvas.height = imgEl2.clientHeight;
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      /* image px -> canvas px (object-fit: contain, zoom around the
       * centre, see imageToCanvas() in allsky-common.js) */
      const pxScale = imageFitScale(imgEl2) * zoomFactor;
      const zc = imageToCanvas(imgEl2, crosshairCenterX, crosshairCenterY);
      const centerX = zc.x;
      const centerY = zc.y;
      const radius  = crosshairRadius * pxScale;

      if (showAzimutalGrid) {
	// Cardinal directions
        ctx.save();
        ctx.strokeStyle = "rgba(255,80,80,0.85)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
        ctx.stroke();

        const directions = ["N","NW","W","SW","S","SE","E","NE"];
        const total = directions.length;
        for (let i = 0; i < total; i++) {
          const idx      = isSouthernHemisphere ? total - 1 - i : i;
          const angleDeg = crosshairRotation + (360 / total) * i;
          const angleRad = angleDeg * Math.PI / 180;
          const x = centerX + Math.sin(angleRad) * radius;
          const y = centerY - Math.cos(angleRad) * radius;
          ctx.beginPath();
          ctx.arc(x, y, 3, 0, 2 * Math.PI);
          ctx.fillStyle = "rgba(255,80,80,0.9)";
          ctx.fill();
          const tx = centerX + Math.sin(angleRad) * (radius + 14);
          const ty = centerY - Math.cos(angleRad) * (radius + 14);
          ctx.fillStyle = "rgba(255,80,80,0.9)";
          ctx.font = "12px sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(directions[idx], tx, ty);
        }
        ctx.beginPath();
        ctx.arc(centerX, centerY, 2, 0, 2 * Math.PI);
        ctx.fillStyle = "rgba(255,80,80,0.9)";
        ctx.fill();
        ctx.fillStyle = "rgba(255,80,80,0.9)";
        ctx.font = "12px sans-serif";
        ctx.textAlign = "left"; ctx.textBaseline = "top";
        ctx.fillText("Zenith", centerX + 6, centerY + 6);
        ctx.restore();
      }

      if (showEquatorialGrid) {
        ctx.save();
        if (imageMaskRadius > 0 && imageCenterX > 0 && imageCenterY > 0) {
          const mc  = imageToCanvas(imgEl2, imageCenterX, imageCenterY);
          const mcx = mc.x, mcy = mc.y;
          const mr  = imageMaskRadius * pxScale;
          ctx.beginPath();
          ctx.arc(mcx, mcy, mr, 0, 2 * Math.PI);
          ctx.clip();
        }
        ctx.strokeStyle = "rgba(0,255,0,0.4)";
        ctx.lineWidth = 1;
        ctx.fillStyle = "lime";
        ctx.font = "10px sans-serif";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        for (let dec = -60; dec <= 60; dec += 15) {
          let pts = [];
          for (let ra = 0; ra < 360; ra += 5) {
            const { azimuth, altitude } = raDecToAzAlt(ra, dec, latitude, longitude, imageTimestamp);
            if (altitude >= 0 && altitude <= 90) pts.push(azAltToImageXY(azimuth, altitude));
          }
          if (pts.length > 1) { ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); pts.slice(1).forEach(p => ctx.lineTo(p.x, p.y)); ctx.stroke(); }
        }
        for (let ra = 0; ra < 360; ra += 15) {
          let pts = [];
          for (let dec2 = -80; dec2 <= 80; dec2 += 5) {
            const { azimuth, altitude } = raDecToAzAlt(ra, dec2, latitude, longitude, imageTimestamp);
            if (altitude >= 0 && altitude <= 90) pts.push(azAltToImageXY(azimuth, altitude));
          }
          if (pts.length > 1) {
            ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); pts.slice(1).forEach(p => ctx.lineTo(p.x, p.y)); ctx.stroke();
            const mid = pts[Math.floor(pts.length / 2)];
            ctx.fillText(`${(ra / 15) % 24}h`, mid.x, mid.y);
          }
        }
        ctx.restore();
      }

      if (showBrightestStars) {
        ctx.save();
        if (imageMaskRadius > 0 && imageCenterX > 0 && imageCenterY > 0) {
          const mc  = imageToCanvas(imgEl2, imageCenterX, imageCenterY);
          const mcx = mc.x, mcy = mc.y;
          const mr  = imageMaskRadius * pxScale;
          ctx.beginPath();
          ctx.arc(mcx, mcy, mr, 0, 2 * Math.PI);
          ctx.clip();
        }
        ctx.font = "10px sans-serif"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
        for (const poi of brightestStarsPoi) {
          const { azimuth, altitude } = raDecToAzAlt(poi.ra, poi.dec, latitude, longitude, imageTimestamp);
          if (altitude >= 0) {
            const { x, y } = azAltToImageXY(azimuth, altitude);
            ctx.beginPath(); ctx.arc(x, y, 3, 0, 2 * Math.PI);
            ctx.fillStyle = poi.color || "white"; ctx.fill();
            ctx.fillStyle = poi.color || "white";
            ctx.fillText(poi.name, x + 20, y + 10);
          }
        }
        ctx.restore();
      }

      if (showAzimutalGrid) {
        ctx.save();
        ctx.strokeStyle = "rgba(255,80,80,0.3)";
        ctx.lineWidth = 1;
        const baseRadius = radius;
        ctx.font = "10px sans-serif"; ctx.fillStyle = "rgba(255,80,80,0.6)";
        ctx.textAlign = "left"; ctx.textBaseline = "middle";
        [15, 30, 45, 60, 75].forEach(el2 => {
          let r = baseRadius * (90 - el2) / 90;
          if (projectionType === "sinus") r = baseRadius * Math.sin((90 - el2) * Math.PI / 180);
          ctx.beginPath(); ctx.arc(centerX, centerY, r, 0, 2 * Math.PI); ctx.stroke();
          ctx.fillText(`${el2}°`, centerX + r + 4, centerY - 1);
        });
        for (let i = 0; i < 8; i++) {
          const angle = (i * 45 + crosshairRotation) * Math.PI / 180;
          const ex = centerX + baseRadius * Math.cos(angle);
          const ey = centerY + baseRadius * Math.sin(angle);
          ctx.beginPath(); ctx.moveTo(centerX, centerY); ctx.lineTo(ex, ey); ctx.stroke();
        }
        ctx.restore();
      }

      if (showMeteorRadiants) {
        const now = new Date(imageTimestamp * 1000);
        ctx.save();
        ctx.strokeStyle = "rgba(255,165,0,0.9)"; ctx.fillStyle = "orange";
        ctx.font = "10px sans-serif"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
        for (const code in meteorShowers) {
          const shower = meteorShowers[code];
          if (!isShowerActive(shower, now)) continue;
          const { ra, dec } = getRadiantPosition(shower);
          const { azimuth, altitude } = raDecToAzAlt(ra, dec, latitude, longitude, imageTimestamp);
          if (altitude <= 0) continue;
          const { x, y } = azAltToImageXY(azimuth, altitude);
          ctx.beginPath(); ctx.arc(x, y, 6, 0, 2 * Math.PI); ctx.stroke();
          ctx.fillText(shower.name, x + 8, y);
        }
        ctx.restore();
      }

      if (showSunMoon) {
        const sun  = getSunRaDec(imageTimestamp);
        const moon = getMoonRaDec(imageTimestamp);
        drawEquatorialPOI(ctx, "Sun",  sun.ra,  sun.dec,  latitude, longitude, "gold",      12);
        drawEquatorialPOI(ctx, "Moon", moon.ra, moon.dec, latitude, longitude, "lightgray", 12);
      }

      if (showMountPosition && mountData && mountData.equatorial) {
        const raDeg  = mountData.equatorial.ra_h * 15;
        const decDeg = mountData.equatorial.dec_deg;
        const { azimuth, altitude } = raDecToAzAlt(raDeg, decDeg, latitude, longitude, imageTimestamp);
        if (altitude >= 0) {
          const { x, y } = azAltToImageXY(azimuth, altitude);
          const r = 12;
          ctx.save();
          ctx.strokeStyle = "orange";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, 2 * Math.PI);
          ctx.stroke();
          ctx.strokeRect(x - r, y - r, r * 2, r * 2);
          ctx.fillStyle = "orange";
          ctx.font = "11px sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "bottom";
          ctx.fillText("Mount", x, y - r - 4);
          ctx.restore();
        }
      }

      if (showDetectedStars) {
        if (starPositions.length > 0) {
          ctx.fillStyle = "cyan";
          for (const star of starPositions) {
            const p = imageToCanvas(imgEl2, star.x, star.y);
            ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, 2 * Math.PI); ctx.fill();
          }
        }
        if (sqmRadius > 0 && sqmCenterX > 0 && sqmCenterY > 0) {
          ctx.save();
          ctx.strokeStyle = "rgba(0,255,255,0.7)";
          ctx.lineWidth = 1.5;
          const c = imageToCanvas(imgEl2, sqmCenterX, sqmCenterY);
          const r = sqmRadius * pxScale;
          ctx.beginPath(); ctx.arc(c.x, c.y, r, 0, 2 * Math.PI); ctx.stroke();
          ctx.restore();
        }
      }

      if (mouseX !== null && mouseY !== null) {
        const mi = canvasToImage(imgEl2, mouseX, mouseY);
        const imageX = mi.x;
        const imageY = mi.y;
        const coordRow   = document.getElementById('coord-row');
        const coordXY    = document.getElementById('coord-xy');
        const coordAzEl  = document.getElementById('coord-azel');
        const coordRaDec = document.getElementById('coord-radec');
        coordRow.style.display = 'flex';
        coordXY.textContent = `X: ${Math.round(imageX)}, Y: ${Math.round(imageY)}`;
        const dxS = mouseX - centerX, dyS = mouseY - centerY;
        const rS  = Math.hypot(dxS, dyS);
        if (rS <= radius) {
          const dNorm = rS / radius;
          let elevation = projectionType === "sinus"
            ? 90 - Math.asin(Math.min(1, Math.max(0, dNorm))) * (180 / Math.PI)
            : 90 - dNorm * 90;
          let azDisp = Math.atan2(dxS, -dyS) * (180 / Math.PI);
          azDisp = (azDisp - crosshairRotation + 360) % 360;
          const azTrue = (360 - azDisp) % 360;
          coordAzEl.textContent = `Az: ${azDisp.toFixed(1)}°, El: ${elevation.toFixed(1)}°`;
          coordAzEl.style.display = '';
          const { raDeg, decDeg } = azAltToRaDec(latitude, longitude, azTrue, elevation, imageTimestamp);
          coordRaDec.textContent = `RA: ${formatRaHMS(raDeg)}, Dec: ${formatDecDMS(decDeg)}`;
          coordRaDec.style.display = '';
        } else {
          coordAzEl.style.display = 'none';
          coordRaDec.style.display = 'none';
        }
      }
    }

    // Mouse on allsky canvas
    const allskyCanvas = document.getElementById("allsky-overlay");
    allskyCanvas.addEventListener("mousemove", (e) => {
      const rect = allskyCanvas.getBoundingClientRect();
      pendingMouse = { canvasRect: rect, clientX: e.clientX, clientY: e.clientY };
      scheduleOverlayRedraw();
    }, { passive: true });
    allskyCanvas.addEventListener("mouseleave", () => {
      mouseX = null; mouseY = null;
      document.getElementById('coord-row').style.display = 'none';
      scheduleOverlayRedraw();
    }, { passive: true });

    // ══════════════════════════════════════════════════════════════
    //  PANORAMA OVERLAY
    // ══════════════════════════════════════════════════════════════
    function updatePanoramaOverlay() {
      const canvas  = document.getElementById("panorama-overlay");
      const panoImg = document.getElementById("panorama");
      if (!panoImg || !panoImg.complete || panoImg.naturalWidth === 0) return;

      // The canvas covers only the visible widget area (a canvas as large as
      // the zoomed image would need hundreds of MB); the drawing is shifted
      // to the image position, so labels keep their size at every zoom level.
      const r = panoRect();
      if (!r) return;
      const aw  = r.w, ah = r.h;
      const dpr = window.devicePixelRatio || 1;
      canvas.width  = Math.round(r.cw * dpr);
      canvas.height = Math.round(r.ch * dpr);
      canvas.style.left   = "0px";
      canvas.style.top    = "0px";
      canvas.style.width  = `${r.cw}px`;
      canvas.style.height = `${r.ch}px`;

      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, r.cw, r.ch);
      ctx.translate(r.left, r.top);

      // Visible part of the image in image coordinates: scales and labels
      // stay at the visible edges when zoomed in
      const xL = Math.max(0, -r.left);
      const xR = Math.min(aw, r.cw - r.left);
      const yB = Math.min(ah, r.ch - r.top);

      ctx.fillStyle   = "rgba(255,80,80,0.85)";
      ctx.strokeStyle = "rgba(255,80,80,0.85)";
      ctx.lineWidth = 1;
      ctx.font = "12px sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "top";

      const dirs = [
        { label:"N", deg:0   }, { label:"NE", deg:45  }, { label:"E",  deg:90  },
        { label:"SE",deg:135 }, { label:"S",  deg:180 }, { label:"SW", deg:225 },
        { label:"W", deg:270 }, { label:"NW", deg:315 }, { label:"N",  deg:360 }
      ];
      dirs.forEach(d => {
        const x = (d.deg / 360) * aw;
        ctx.beginPath(); ctx.moveTo(x, yB - 12); ctx.lineTo(x, yB); ctx.stroke();
        ctx.fillText(d.label, x, yB - 24);
      });

      ctx.textAlign = "right"; ctx.textBaseline = "middle";
      for (let i = 0; i <= 90; i += 15) {
        const y = ah - (i / 90) * ah;
        ctx.beginPath(); ctx.moveTo(xR - 8, y); ctx.lineTo(xR, y); ctx.stroke();
        if (i !== 0 && i !== 90) ctx.fillText(`${i}°`, xR - 10, y);
      }
      ctx.textAlign = "left";
      for (let i = 0; i <= 90; i += 15) {
        const y = ah - (i / 90) * ah;
        ctx.beginPath(); ctx.moveTo(xL, y); ctx.lineTo(xL + 8, y); ctx.stroke();
        if (i !== 0 && i !== 90) ctx.fillText(`${i}°`, xL + 10, y);
      }

      if (showAzimutalGrid) {
        ctx.strokeStyle = "rgba(255,80,80,0.3)";
        [15, 30, 45, 60, 75].forEach(el3 => {
          const y = ah - (el3 / 90) * ah;
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(aw, y); ctx.stroke();
        });
        for (let i = 0; i <= 8; i++) {
          const x = (i * 45 / 360) * aw;
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, ah); ctx.stroke();
        }
      }
    }

    // ══════════════════════════════════════════════════════════════
    //  RESIZE HANDLER
    // ══════════════════════════════════════════════════════════════
    window.addEventListener("resize", () => {
      updateAllskyOverlay();
      updatePanoramaOverlay();
    });

    // ══════════════════════════════════════════════════════════════
    //  INIT
    // ══════════════════════════════════════════════════════════════
    initTimeModeToggle(document.getElementById('time-mode-btn'));
    loadConfig();
    loadLatestImage();
    loadSpektrumData();
    restartTimer();
    initCharts();

    setInterval(loadMountData,    10000);
    setInterval(loadSpektrumData, 60000);
  </script>

</body>
