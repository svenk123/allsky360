<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Allsky360 Archive">

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <script src="js/allsky-common.js"></script>

  <link rel="stylesheet" href="allsky.css">
  <style>
    .thumb { width: 100px; }

    /* ── META SIDEBAR ───────────────────────────────────────────── */
    #meta-sidebar {
      width: 260px;
      flex-shrink: 0;
      background: rgba(22,27,34,0.85);
      border-left: 1px solid rgba(255,255,255,0.06);
      padding: 12px 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .meta-hint {
      color: #4b5563;
      font-size: 12px;
      text-align: center;
      margin-top: 24px;
      line-height: 1.6;
    }
    #meta-thumb-preview {
      width: 100%;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      display: none;
      cursor: pointer;
    }

    /* ── LIGHTBOX ───────────────────────────────────────────────── */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      backdrop-filter: blur(10px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    #lightbox.open { display: flex; }
    #lb-img {
      max-width: 90vw;
      max-height: 88vh;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 32px 96px rgba(0,0,0,0.8);
      object-fit: contain;
    }
    #lb-close {
      position: absolute;
      top: 14px; right: 16px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      color: #e5e7eb; font-size: 18px;
      width: 36px; height: 36px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    #lb-close:hover { background: rgba(255,255,255,0.2); color: #fff; }
    .lb-arrow {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      color: #e5e7eb; font-size: 26px;
      width: 44px; height: 70px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .lb-arrow:hover { background: rgba(255,255,255,0.18); color: #fff; }
    .lb-arrow:disabled { opacity: 0.2; cursor: default; }
    #lb-prev { left: 14px; }
    #lb-next { right: 14px; }
    #lb-label {
      position: absolute;
      bottom: 16px; left: 50%;
      transform: translateX(-50%);
      background: rgba(13,17,23,0.85);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 5px 16px;
      font-size: 12px; color: #e5e7eb;
      white-space: nowrap;
      backdrop-filter: blur(8px);
    }
    #lb-counter {
      position: absolute;
      top: 16px; left: 50%;
      transform: translateX(-50%);
      background: rgba(13,17,23,0.85);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 4px 14px;
      font-size: 11px; color: #9ca3af;
      backdrop-filter: blur(8px);
    }
    #lb-open-btn {
      position: absolute;
      top: 14px; right: 60px;
      background: rgba(59,130,246,0.15);
      border: 1px solid rgba(59,130,246,0.35);
      border-radius: 10px;
      color: #3b82f6; font-size: 11px; font-weight: 600;
      padding: 0 12px; height: 36px;
      cursor: pointer;
      display: flex; align-items: center; gap: 5px;
      transition: all 0.15s;
      text-decoration: none;
    }
    #lb-open-btn:hover { background: rgba(59,130,246,0.28); color: #60a5fa; }
  </style>
</head>

  <script>
    // ══════════════════════════════════════════════════════════════
    //  STATE
    // ══════════════════════════════════════════════════════════════
    let allTimestamps  = [];   // flat ordered list of timestamps for lightbox nav
    let currentLbIdx   = -1;
    let currentDateStr = '';   // yyyymmdd
    let currentType    = 'image';
    let activeThumb    = null; // currently highlighted thumbnail element

    // ══════════════════════════════════════════════════════════════
    //  CONFIG
    // ══════════════════════════════════════════════════════════════
    let loadingConfig = false;
    let longitude = 0.0;
    let latitude  = 0.0;
    let altitude  = 0;

    async function loadConfig() {
      if (loadingConfig) return;
      loadingConfig = true;
      try {
        const resp = await fetch('api/config', { cache: 'no-cache' });
        if (!resp.ok) throw new Error('config failed');
        const d = await resp.json();
        latitude  = d.location_latitude  ?? d.latitude  ?? 0.0;
        longitude = d.location_longitude ?? d.longitude ?? 0.0;
        altitude  = d.location_altitude  ?? d.altitude  ?? 0;
      } catch (e) {
        console.warn('⚠️ config not available:', e);
      }
      loadingConfig = false;
    }

    // ══════════════════════════════════════════════════════════════
    //  HELPERS
    // ══════════════════════════════════════════════════════════════
    // ts = "yyyymmddHHMMSS", the UTC capture time of the file name
    function tsToUnix(ts) {
      return Date.UTC(+ts.slice(0, 4), +ts.slice(4, 6) - 1, +ts.slice(6, 8),
                      +ts.slice(8, 10), +ts.slice(10, 12), +(ts.slice(12, 14) || 0)) / 1000;
    }

    // Shown in the display time zone (station time or UTC)
    function formatThumbTime(ts) {
      return formatClock(tsToUnix(ts), { seconds: ts.length >= 14 });
    }

    function formatThumbDate(ts) {
      return formatDateTime(tsToUnix(ts));
    }

    function safeFixed(v, digits) {
      return (v != null && !isNaN(v)) ? Number(v).toFixed(digits) : 'N/A';
    }

    function buildMetaHtml(m) {
      let html = '<div class="metadata-section">';
      html += '<h2>Image Data</h2>';
      if (m.timestamp != null)
        html += `<div>Timestamp <span>${formatTimestamp(m.timestamp, m.timezone_offset)}</span></div>`;
      if (m.exposure_t0 != null)
        html += `<div>Exposure t0 (s) <span>${safeFixed(m.exposure_t0, 5)}</span></div>`;
      if (m.hdr > 1 && m.exposure_t1 != null)
        html += `<div>Exposure t1 (s) <span>${safeFixed(m.exposure_t1, 5)}</span></div>`;
      if (m.hdr > 2 && m.exposure_t2 != null)
        html += `<div>Exposure t2 (s) <span>${safeFixed(m.exposure_t2, 5)}</span></div>`;
      if (m.hdr > 3 && m.exposure_t3 != null)
        html += `<div>Exposure t3 (s) <span>${safeFixed(m.exposure_t3, 5)}</span></div>`;
      if (m.hdr > 4 && m.exposure_t4 != null)
        html += `<div>Exposure t4 (s) <span>${safeFixed(m.exposure_t4, 5)}</span></div>`;
      if (m.gain != null)
        html += `<div>Gain <span>${safeFixed(m.gain, 1)}</span></div>`;
      if (m.sensor_temperature != null)
        html += `<div>Sensor temp (°C) <span>${safeFixed(m.sensor_temperature, 1)}</span></div>`;
      if (m.mean_brightness != null)
        html += `<div>Brightness <span>${safeFixed(m.mean_brightness, 2)} → ${safeFixed(m.target_brightness, 2)}</span></div>`;
      if (m.night_mode && m.stars != null)
        html += `<div>Stars <span>${m.stars}</span></div>`;
      if (m.night_mode && m.sqm != null)
        html += `<div>SQM (mag/arcs²) <span>${safeFixed(m.sqm, 1)}</span></div>`;
      if (m.capture_interval != null)
        html += `<div>Interval (s) <span>${m.capture_interval}</span></div>`;
      html += `<div>Night mode <span>${m.night_mode ? '✓ Yes' : '✗ No'}</span></div>`;
      if (m.hdr != null)
        html += `<div>HDR <span>${m.hdr}</span></div>`;
      html += '</div>';

      if (m.sun_altitude != null || m.moon_altitude != null || m.moon_phase_percentage != null) {
        html += '<div class="metadata-section"><h2>Environment</h2>';
        if (m.sun_altitude != null)
          html += `<div>Sun altitude (°) <span>${safeFixed(m.sun_altitude, 1)}</span></div>`;
        if (m.moon_altitude != null)
          html += `<div>Moon altitude (°) <span>${safeFixed(m.moon_altitude, 1)}</span></div>`;
        if (m.moon_phase_percentage != null)
          html += `<div>Moon phase (%) <span>${safeFixed(m.moon_phase_percentage, 1)}</span></div>`;
        html += '</div>';
      }
      return html;
    }

    function thumbPath(ts) {
      return currentType === 'video'
        ? `videos/${currentDateStr}/thumbnails/video-${ts}.jpg`
        : `images/${ts.slice(0, 8)}/thumbnails/image-${ts}.jpg`;
    }

    function fullPath(ts) {
      return currentType === 'video'
        ? `videos/${currentDateStr}/video-${ts}.mp4`
        : `images/${ts.slice(0, 8)}/image-${ts}.jpg`;
    }

    function metaPath(ts) {
      return currentType === 'video'
        ? `videos/${currentDateStr}/video-${ts}.json`
        : `images/${ts.slice(0, 8)}/image-${ts}.json`;
    }

    // ══════════════════════════════════════════════════════════════
    //  GALLERY LOADING
    // ══════════════════════════════════════════════════════════════
    function loadThumbnails() {
      const dateInput = document.getElementById('datePicker').value;
      const order     = document.getElementById('orderSelect').value;
      currentType     = document.getElementById('imageType').value;

      const gallery = document.getElementById('gallery');
      const hdrDate = document.getElementById('hdr-date');
      const hdrCount = document.getElementById('hdr-count');

      if (!dateInput) {
        gallery.innerHTML = '<div id="gallery-status">Please select a date.</div>';
        return;
      }

      currentDateStr = dateInput.replace(/-/g, '');
      hdrDate.textContent = dateInput;
      gallery.innerHTML = '<div id="gallery-status">Loading…</div>';
      clearMeta();
      allTimestamps = [];
      currentLbIdx  = -1;
      activeThumb   = null;

      // Images: the selected day is a calendar day in the display time zone;
      // the image folders are UTC days, so join the one or two it spans and
      // keep the images of the day. Videos keep their (UTC) date.
      const listPromise = currentType === 'video'
        ? fetch(`/api/thumbnails?date=${dateInput}&type=video`).then(r => {
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            return r.json();
          })
        : (async () => {
            const { start, end } = dayRangeInZone(dateInput);
            const parts = await Promise.all(utcDaysForRange(start, end).map(day =>
              fetch(`/api/thumbnails?date=${day}&type=image`)
                .then(r => (r.ok ? r.json() : []))
                .catch(() => [])));
            return parts.flat()
              .filter(ts => { const t = tsToUnix(ts); return t >= start && t < end; })
              .sort();
          })();

      listPromise
        .then(list => {
          gallery.innerHTML = '';

          if (!Array.isArray(list) || list.length === 0) {
            gallery.innerHTML = '<div id="gallery-status">No images found for this date.</div>';
            hdrCount.textContent = '0 images';
            return;
          }

          if (order === 'descending') list = list.slice().reverse();

          allTimestamps = list;
          hdrCount.textContent = `${list.length} ${currentType === 'video' ? 'videos' : 'images'}`;

          let currentHour = null;

          list.forEach((ts, idx) => {
            // Hour in the display time zone; the zone label also tells the
            // two 02:00 hours apart on the night of the autumn DST change
            const zp = zonedParts(tsToUnix(ts));
            const hour = `${String(zp.hour).padStart(2, '0')}:00 ${zp.zone}`;
            if (hour !== currentHour) {
              currentHour = hour;
              const sep = document.createElement('div');
              sep.className = 'hour-sep';
              sep.textContent = hour;
              gallery.appendChild(sep);
            }

            const wrap = document.createElement('div');
            wrap.className = 'thumb-wrap';

            const img = document.createElement('img');
            img.className = 'thumb';
            img.src   = thumbPath(ts);
            img.alt   = ts;
            img.title = formatThumbDate(ts);
            img.loading = 'lazy';

            const timeLabel = document.createElement('div');
            timeLabel.className = 'thumb-time';
            timeLabel.textContent = formatThumbTime(ts);

            wrap.appendChild(img);
            wrap.appendChild(timeLabel);

            // Hover → show metadata in sidebar
            img.addEventListener('mouseenter', () => showMeta(ts, img));
            img.addEventListener('mouseleave', () => {
              // keep meta visible until another thumb is hovered or gallery changes
            });

            // Click → open lightbox
            img.addEventListener('click', () => {
              setActiveThumb(img);
              openLightbox(idx);
            });

            gallery.appendChild(wrap);
          });
        })
        .catch(err => {
          console.error('Error loading thumbnails:', err);
          gallery.innerHTML = '<div id="gallery-status">No data available for this date.</div>';
          hdrCount.textContent = '0 images';
        });
    }

    async function showMeta(ts, imgEl) {
      // Highlight thumbnail
      if (activeThumb && activeThumb !== imgEl) {
        activeThumb.classList.remove('active');
      }
      imgEl.classList.add('active');
      activeThumb = imgEl;

      // Show preview in sidebar
      const preview = document.getElementById('meta-thumb-preview');
      preview.src = thumbPath(ts);
      preview.style.display = 'block';

      const metaEl = document.getElementById('metadata');
      metaEl.innerHTML = '<p class="meta-hint">Loading…</p>';

      try {
        const resp = await fetch(metaPath(ts), { cache: 'no-cache' });
        if (!resp.ok) throw new Error('not found');
        const m = await resp.json();
        metaEl.innerHTML = buildMetaHtml(m);
      } catch {
        metaEl.innerHTML = '<p class="meta-hint">No metadata available.</p>';
      }
    }

    function clearMeta() {
      document.getElementById('metadata').innerHTML =
        '<p class="meta-hint">Hover over a thumbnail<br>to see image metadata.</p>';
      const preview = document.getElementById('meta-thumb-preview');
      preview.src = '';
      preview.style.display = 'none';
    }

    function setActiveThumb(imgEl) {
      if (activeThumb) activeThumb.classList.remove('active');
      imgEl.classList.add('active');
      activeThumb = imgEl;
    }

    // ══════════════════════════════════════════════════════════════
    //  LIGHTBOX
    // ══════════════════════════════════════════════════════════════
    const lightbox  = document.getElementById('lightbox');
    const lbImg     = document.getElementById('lb-img');
    const lbLabel   = document.getElementById('lb-label');
    const lbCounter = document.getElementById('lb-counter');
    const lbOpenBtn = document.getElementById('lb-open-btn');
    const lbPrev    = document.getElementById('lb-prev');
    const lbNext    = document.getElementById('lb-next');

    function openLightbox(idx) {
      if (idx < 0 || idx >= allTimestamps.length) return;
      currentLbIdx = idx;
      const ts   = allTimestamps[idx];
      const path = fullPath(ts);
      lbImg.src  = path;
      lbLabel.textContent = formatThumbDate(ts);
      lbOpenBtn.href = path;
      lbCounter.textContent = `${idx + 1} / ${allTimestamps.length}`;
      lbPrev.disabled = idx === 0;
      lbNext.disabled = idx === allTimestamps.length - 1;
      lightbox.classList.add('open');
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      lbImg.src = '';
    }

    function lbNavigate(delta) {
      const newIdx = currentLbIdx + delta;
      if (newIdx >= 0 && newIdx < allTimestamps.length) {
        openLightbox(newIdx);
        // Sync active thumbnail in gallery
        const thumbs = document.querySelectorAll('.thumb');
        const orderSel = document.getElementById('orderSelect').value;
        // Find the thumb element corresponding to allTimestamps[newIdx]
        const ts  = allTimestamps[newIdx];
        thumbs.forEach(t => {
          if (t.alt === ts) {
            setActiveThumb(t);
            showMeta(ts, t);
          }
        });
      }
    }

    document.getElementById('lb-close').addEventListener('click', closeLightbox);
    lbPrev.addEventListener('click', () => lbNavigate(-1));
    lbNext.addEventListener('click', () => lbNavigate(+1));

    // Close on backdrop click
    lightbox.addEventListener('click', e => {
      if (e.target === lightbox) closeLightbox();
    });

    // Keyboard navigation
    document.addEventListener('keydown', e => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape')      closeLightbox();
      if (e.key === 'ArrowLeft')   lbNavigate(-1);
      if (e.key === 'ArrowRight')  lbNavigate(+1);
    });

    // ══════════════════════════════════════════════════════════════
    //  INIT
    // ══════════════════════════════════════════════════════════════
    document.addEventListener('DOMContentLoaded', () => {
      const datePicker  = document.getElementById('datePicker');
      const orderSelect = document.getElementById('orderSelect');
      const imageType   = document.getElementById('imageType');

      datePicker.addEventListener('change',  loadThumbnails);
      orderSelect.addEventListener('change', loadThumbnails);
      imageType.addEventListener('change',   loadThumbnails);

      // Default: today in the display time zone
      datePicker.value = dayStringInZone();
      initTimeModeToggle(document.getElementById('time-mode-btn'));
      let shownToday = datePicker.value;
      window.addEventListener('allsky-timezone-change', () => {
        const t = dayStringInZone();
        if (datePicker.value === shownToday) datePicker.value = t;
        shownToday = t;
        loadThumbnails();
      });

      loadConfig();
      loadThumbnails();
    });
  </script>

</body>
</html>
