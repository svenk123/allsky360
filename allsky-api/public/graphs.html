<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Allsky360 – Camera Statistics</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Allsky360 Stats">
  <meta name="theme-color" content="#0d1117" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@9.2.2/dist/gridstack.min.css">

  <script src="js/allsky-common.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@1.4.0/dist/chartjs-plugin-annotation.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gridstack@9.2.2/dist/gridstack-all.js" defer></script>

  <link rel="stylesheet" href="allsky.css">
  <style>
    /* ── GRAPHS MAIN ────────────────────────────────────────────── */
    #graphs-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #controls-bar { padding: 10px 10px 0; }

    /* ── GRAPHS SCROLL ──────────────────────────────────────────── */
    #graphs-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 8px 8px 20px;
    }


    /* ── LATEST IMAGE: histogram and HDR exposures (from the dashboard) ── */
    .cam-card { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; overflow: hidden; }
    .cam-title { text-align: center; font-size: 12px; font-weight: 600; color: #e5e7eb; }
    .cam-title span { font-weight: 400; color: #6b7280; }
    #histogram { display: block; width: 100%; flex: 1; min-height: 0; border-radius: 6px; background: rgba(0,0,0,0.35); }
    #histogram-stats { display: flex; flex-wrap: wrap; gap: 0 12px; font-size: 11px; color: #6b7280; }
    #histogram-stats > div { margin-bottom: 0 !important; }
    .exposure-gallery { flex: 1; min-height: 0; display: flex; gap: 6px; overflow-x: auto; }
    .exposure-gallery figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; }
    .exposure-gallery img {
      flex: 1; min-height: 0; max-width: 100%; width: auto; object-fit: contain;
      border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); background: #000;
    }
    .exposure-gallery figcaption { font-size: 10px; color: #6b7280; font-variant-numeric: tabular-nums; white-space: nowrap; }
  </style>
</head>

<body>
  <!-- allsky-common.js click handler requires these elements -->
  <div id="nav-menu"           style="display:none;"></div>
  <div id="hamburger-menu-btn" style="display:none;"></div>

  <!-- ═══════════════════ HEADER ════════════════════════════════════ -->
  <header id="app-header">
    <a class="hdr-brand" href="dashboard.html">
      <img src="allsky360_256x256.png" alt="Allsky360" width="30" height="30" />
      <div class="hdr-brand-text">
        <div class="hdr-title">Allsky360</div>
        <div class="hdr-crumb">Camera · Statistics</div>
      </div>
    </a>

    <div class="hdr-badges">
      <button class="badge badge-gray" id="time-mode-btn" type="button"></button>
      <span class="badge badge-gray" id="hdr-date">–</span>
      <button class="badge badge-gray" id="toggle-grid-btn" onclick="toggleGridInteraction()">🔒 Locked</button>
      <button class="badge badge-gray" id="reset-layout-btn" onclick="resetGridLayout()">↺ Reset</button>
    </div>
  </header>

  <!-- ═══════════════════ MAIN LAYOUT ═══════════════════════════════ -->
  <div id="main-layout">

    <!-- ── ICON NAV ─────────────────────────────────────────────── -->
    <nav id="icon-nav"></nav>
    <script>renderIconNav();</script>

    <!-- ── GRAPHS MAIN ────────────────────────────────────────────── -->
    <main id="graphs-main">

      <!-- Controls -->
      <div id="controls-bar">
        <div class="ctrl-group">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8"  y1="2" x2="8"  y2="6"></line>
            <line x1="3"  y1="10" x2="21" y2="10"></line>
          </svg>
          <span class="ctrl-label-text">Date</span>
          <input type="date" id="datePicker" class="ctrl-date" />
        </div>
      </div>

      <!-- GridStack -->
      <div id="graphs-scroll">
        <div class="grid-stack" id="graphs-grid">

          <div class="grid-stack-item" gs-id="latest-histogram" gs-x="0" gs-y="0" gs-w="7" gs-h="2">
            <div class="grid-stack-item-content cam-card">
              <div class="cam-title">Histogram · latest image <span id="hist-time"></span></div>
              <canvas id="histogram" width="512" height="100"></canvas>
              <div id="histogram-stats"></div>
            </div>
          </div>

          <div class="grid-stack-item" gs-id="hdr-gallery" gs-x="7" gs-y="0" gs-w="5" gs-h="2">
            <div class="grid-stack-item-content cam-card">
              <div class="cam-title">HDR exposures · latest image</div>
              <div id="exposure-gallery" class="exposure-gallery"></div>
            </div>
          </div>

          <div class="grid-stack-item" gs-id="chart-exposure" gs-x="0" gs-y="2" gs-w="6" gs-h="3">
            <div class="grid-stack-item-content">
              <canvas id="chartExposure"></canvas>
            </div>
          </div>

          <div class="grid-stack-item" gs-id="chart-gain" gs-x="6" gs-y="2" gs-w="6" gs-h="3">
            <div class="grid-stack-item-content">
              <canvas id="chartGain"></canvas>
            </div>
          </div>

          <div class="grid-stack-item" gs-id="chart-noise" gs-x="0" gs-y="5" gs-w="6" gs-h="3">
            <div class="grid-stack-item-content">
              <canvas id="chartNoise"></canvas>
            </div>
          </div>

          <div class="grid-stack-item" gs-id="chart-sqm" gs-x="6" gs-y="5" gs-w="3" gs-h="3">
            <div class="grid-stack-item-content">
              <canvas id="chartSQM"></canvas>
            </div>
          </div>

          <div class="grid-stack-item" gs-id="chart-stars" gs-x="9" gs-y="5" gs-w="3" gs-h="3">
            <div class="grid-stack-item-content">
              <canvas id="chartStars"></canvas>
            </div>
          </div>

          <div class="grid-stack-item" gs-id="chart-hdr" gs-x="0" gs-y="8" gs-w="4" gs-h="3">
            <div class="grid-stack-item-content">
              <canvas id="chartHDR"></canvas>
            </div>
          </div>

          <div class="grid-stack-item" gs-id="chart-focus" gs-x="4" gs-y="8" gs-w="4" gs-h="3">
            <div class="grid-stack-item-content">
              <canvas id="chartFocus"></canvas>
            </div>
          </div>

          <div class="grid-stack-item" gs-id="chart-brightness" gs-x="8" gs-y="8" gs-w="4" gs-h="3">
            <div class="grid-stack-item-content">
              <canvas id="chartBrightness"></canvas>
            </div>
          </div>

          <div class="grid-stack-item" gs-id="chart-mean-brightness-rgb" gs-x="0" gs-y="11" gs-w="12" gs-h="3">
            <div class="grid-stack-item-content">
              <canvas id="chartMeanBrightnessRGB"></canvas>
            </div>
          </div>

        </div>
      </div>

    </main>

  </div><!-- #main-layout -->

  <script>
    // ══════════════════════════════════════════════════════════════
    //  CONFIG
    // ══════════════════════════════════════════════════════════════
    let captureIntervalSec = 60;
    let configLat = null;
    let configLon = null;

    async function loadConfig() {
      try {
        const res = await fetch("api/config");
        if (res.ok) {
          const cfg = await res.json();
          if (typeof cfg.capture_interval === 'number') {
            captureIntervalSec = cfg.capture_interval;
          }
          // Support both field name conventions
          const lat = cfg.location_latitude  ?? cfg.latitude;
          const lon = cfg.location_longitude ?? cfg.longitude;
          if (typeof lat === 'number' && typeof lon === 'number') {
            configLat = lat;
            configLon = lon;
          }
        }
      } catch (e) {
        console.warn("loadConfig: using defaults.", e);
      }
    }

    // ══════════════════════════════════════════════════════════════
    //  SUN TIMES
    // ══════════════════════════════════════════════════════════════
    let sunTimes = {};

    function updateSunTimes(dateStr, lat, lon) {
      // The day in the display time zone (station or UTC)
      const day      = dayRangeInZone(dateStr);
      const date     = new Date((day.start + 12 * 3600) * 1000);
      const today    = SunCalc.getTimes(date, lat, lon);
      const tomorrow = new Date(date.getTime() + 24 * 3600 * 1000);
      const tmr = SunCalc.getTimes(tomorrow, lat, lon);

      sunTimes = {
        startOfDay:    new Date(day.start * 1000).toISOString(),
        dawnStart:     today.nightEnd.toISOString(),
        dawnEnd:       today.sunrise.toISOString(),
        duskStart:     today.sunset.toISOString(),
        duskEnd:       today.night.toISOString(),
        nextDawnStart: tmr.nightEnd.toISOString()
      };
    }

    function getSunPeriods() {
      return [
        { start: sunTimes.startOfDay,    end: sunTimes.dawnStart,    color: 'rgba(0,10,60,0.50)'      },
        { start: sunTimes.dawnStart,     end: sunTimes.dawnEnd,      color: 'rgba(80,80,110,0.35)'    },
        { start: sunTimes.dawnEnd,       end: sunTimes.duskStart,    color: 'rgba(96,160,255,0.18)'   },
        { start: sunTimes.duskStart,     end: sunTimes.duskEnd,      color: 'rgba(80,80,110,0.35)'    },
        { start: sunTimes.duskEnd,       end: sunTimes.nextDawnStart,color: 'rgba(0,10,60,0.50)'      }
      ];
    }

    // ══════════════════════════════════════════════════════════════
    //  BACKGROUND SUN PLUGIN
    // ══════════════════════════════════════════════════════════════
    const backgroundSunPlugin = {
      id: 'backgroundSun',
      beforeDatasetsDraw(chart, _args, options) {
        if (!options || !options.periods) return;
        const { ctx, chartArea: area, scales } = chart;
        ctx.save();
        for (const p of options.periods) {
          const x0 = scales.x.getPixelForValue(new Date(p.start));
          const x1 = scales.x.getPixelForValue(new Date(p.end));
          ctx.fillStyle = p.color;
          ctx.fillRect(x0, area.top, x1 - x0, area.bottom - area.top);
        }
        ctx.restore();
      }
    };

    // ══════════════════════════════════════════════════════════════
    //  CHART FACTORY
    // ══════════════════════════════════════════════════════════════
    const charts = {};

    function createChart(ctxId, label, datasets, type = "line", showLegend = false, logScale = false) {
      const ctx = document.getElementById(ctxId).getContext('2d');
      return new Chart(ctx, {
        type,
        data: { labels: [], datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          scales: {
            x: {
              type: 'time',
              time: {
                unit: 'minute',
                tooltipFormat: 'HH:mm',
                displayFormats: { hour: 'HH:mm', minute: 'HH:mm' }
              },
              // Labels in the display time zone (station or UTC)
              ticks: chartTimeTicks({ color: '#9ca3af', maxTicksLimit: 8, font: { size: 10 } }),
              grid: { color: 'rgba(255,255,255,0.06)' }
            },
            y: {
              type: logScale ? 'logarithmic' : 'linear',
              min: logScale ? 0.00001 : undefined,
              beginAtZero: !logScale,
              ticks: {
                color: '#9ca3af',
                font: { size: 10 },
                callback: (v) => logScale ? v.toFixed(6) : v.toString()
              },
              grid: { color: 'rgba(255,255,255,0.06)' }
            }
          },
          plugins: {
            tooltip: { callbacks: { title: chartTooltipTitle } },
            title: {
              display: true,
              text: label,
              color: '#e5e7eb',
              font: { size: 12, weight: '600' },
              padding: { top: 6, bottom: 4 }
            },
            legend: {
              display: showLegend,
              labels: { color: '#9ca3af', boxWidth: 2, boxHeight: 2, font: { size: 11 } }
            },
            backgroundSun: {
              periods: getSunPeriods()
            }
          }
        }
      });
    }

    // ══════════════════════════════════════════════════════════════
    //  DATA UPDATE / CLEAR
    // ══════════════════════════════════════════════════════════════
    function updateCharts(data) {
      const ts = data.map(p => new Date(p.timestamp * 1000));

      charts.chartExposure.data.labels = ts;
      charts.chartExposure.data.datasets[0].data = data.map(p => p.exposure);

      charts.chartGain.data.labels = ts;
      charts.chartGain.data.datasets[0].data = data.map(p => p.gain);

      charts.chartNoise.data.labels = ts;
      charts.chartNoise.data.datasets[0].data = data.map(p => p.noise);

      charts.chartSQM.data.labels = ts;
      charts.chartSQM.data.datasets[0].data = data.map(p => p.sqm);

      charts.chartStars.data.labels = ts;
      charts.chartStars.data.datasets[0].data = data.map(p => p.stars);

      charts.chartFocus.data.labels = ts;
      charts.chartFocus.data.datasets[0].data = data.map(p => p.focus);

      charts.chartHDR.data.labels = ts;
      charts.chartHDR.data.datasets[0].data = data.map(p => p.hdr);

      charts.chartBrightness.data.labels = ts;
      charts.chartBrightness.data.datasets[0].data = data.map(p => p.brightness);

      charts.chartMeanBrightnessRGB.data.labels = ts;
      charts.chartMeanBrightnessRGB.data.datasets[0].data = data.map(p => p.mean_r);
      charts.chartMeanBrightnessRGB.data.datasets[1].data = data.map(p => p.mean_g);
      charts.chartMeanBrightnessRGB.data.datasets[2].data = data.map(p => p.mean_b);

      Object.values(charts).forEach(c => c.update());
    }

    function clearAllCharts() {
      Object.values(charts).forEach(c => {
        c.data.labels = [];
        c.data.datasets.forEach(ds => ds.data = []);
        c.update();
      });
    }

    // ══════════════════════════════════════════════════════════════
    //  LOAD MEASUREMENTS
    // ══════════════════════════════════════════════════════════════
    async function loadMeasurements() {
      const date = document.getElementById("datePicker").value;
      document.getElementById("hdr-date").textContent = date || '–';
      try {
        // The day in the display time zone can span two UTC databases
        const rows = await fetchDayRows('/api/image', date);
        if (rows.length) updateCharts(rows);
        else clearAllCharts();
      } catch (err) {
        console.error("Failed to load measurement data:", err);
        clearAllCharts();
      }
    }

    // ══════════════════════════════════════════════════════════════
    //  INIT
    // ══════════════════════════════════════════════════════════════
    async function init() {
      const datePicker = document.getElementById("datePicker");
      const today = dayStringInZone();
      datePicker.value = today;
      document.getElementById("hdr-date").textContent = today;

      await loadConfig();

      if (configLat !== null && configLon !== null) {
        updateSunTimes(datePicker.value, configLat, configLon);
      }

      Chart.register(backgroundSunPlugin);

      charts.chartExposure = createChart("chartExposure", "Exposure (s)", [
        { label: "Exposure", data: [], borderColor: "#f97316", fill: false, pointRadius: 0, tension: 0.15 }
      ], "line", false, true);

      charts.chartGain = createChart("chartGain", "Gain", [
        { label: "Gain", data: [], borderColor: "#60a5fa", fill: false, pointRadius: 0, tension: 0.15 }
      ]);

      charts.chartNoise = createChart("chartNoise", "Noise Level (σ)", [
        { label: "Noise", data: [], borderColor: "#f87171", fill: false, pointRadius: 0, tension: 0.15 }
      ]);

      charts.chartSQM = createChart("chartSQM", "Sky Quality (SQM)", [
        { label: "SQM", data: [], borderColor: "#34d399", fill: false, pointRadius: 0, tension: 0.15 }
      ]);

      charts.chartStars = createChart("chartStars", "Star Count", [
        { label: "Stars", data: [], borderColor: "#fbbf24", fill: false, pointRadius: 0, tension: 0.15 }
      ]);

      charts.chartFocus = createChart("chartFocus", "Focus Score", [
        { label: "Focus", data: [], borderColor: "#fb923c", fill: false, pointRadius: 0, tension: 0.15 }
      ]);

      charts.chartHDR = createChart("chartHDR", "HDR Exposures", [
        { label: "HDR frames", data: [], backgroundColor: "rgba(168,85,247,0.55)", borderColor: "rgba(168,85,247,0.85)", pointRadius: 0 }
      ], "bar");

      charts.chartBrightness = createChart("chartBrightness", "Median Brightness (G)", [
        { label: "Brightness", data: [], borderColor: "#a3e635", fill: false, pointRadius: 0, tension: 0.15 }
      ]);

      charts.chartMeanBrightnessRGB = createChart("chartMeanBrightnessRGB", "Mean Brightness (RGB)", [
        { label: "Red",   data: [], borderColor: "#f87171", fill: false, pointRadius: 0, tension: 0.15 },
        { label: "Green", data: [], borderColor: "#34d399", fill: false, pointRadius: 0, tension: 0.15 },
        { label: "Blue",  data: [], borderColor: "#60a5fa", fill: false, pointRadius: 0, tension: 0.15 }
      ], "line", true);

      await loadMeasurements();

      initTimeModeToggle(document.getElementById('time-mode-btn'));
      let shownToday = today;
      window.addEventListener('allsky-timezone-change', () => {
        const t = dayStringInZone();
        if (datePicker.value === shownToday) datePicker.value = t;
        shownToday = t;
        datePicker.dispatchEvent(new Event('change'));
      });

      datePicker.addEventListener("change", () => {
        document.getElementById("hdr-date").textContent = datePicker.value;
        if (configLat !== null && configLon !== null) {
          updateSunTimes(datePicker.value, configLat, configLon);
          Object.values(charts).forEach(c => {
            if (c.options.plugins.backgroundSun) {
              c.options.plugins.backgroundSun.periods = getSunPeriods();
            }
          });
        }
        loadMeasurements();
      });

      setInterval(loadMeasurements, captureIntervalSec * 1000);
    }

    // ══════════════════════════════════════════════════════════════
    //  LATEST IMAGE: histogram and HDR exposures (were on the dashboard)
    // ══════════════════════════════════════════════════════════════
    const histImg = new Image();
    let latestStamp = '';
    let latestTimestamp = null;

    function renderExposureGallery(meta, stamp) {
      const n = meta && meta.hdr > 0 ? meta.hdr : 1;
      const exp = (i) => meta && typeof meta[`exposure_t${i}`] === 'number' ? ` · ${meta[`exposure_t${i}`].toPrecision(3)} s` : '';
      // ?v= the image time: the latest_image_t*.jpg files keep their names
      document.getElementById('exposure-gallery').innerHTML = Array.from({ length: n }, (_, i) =>
        `<figure><img src="images/latest_image_t${i}.jpg?v=${stamp}" alt="Exposure t${i}" loading="lazy">` +
        `<figcaption>t${i}${exp(i)}</figcaption></figure>`).join('');
    }

    async function loadLatestCamera() {
      try {
        const res = await fetch('api/latest_image', { cache: 'no-cache' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const li = await res.json();
        const stamp = `${li.date}${li.image}`;
        latestTimestamp = li.image_timestamp ?? null;
        document.getElementById('hist-time').textContent = latestTimestamp ? '· ' + formatDateTime(latestTimestamp) : '';
        if (stamp === latestStamp) return;
        latestStamp = stamp;

        let meta = null;
        try {
          const r = await fetch(`images/${li.date}/image-${stamp}.json`, { cache: 'no-cache' });
          if (r.ok) meta = await r.json();
        } catch { /* optional */ }
        renderExposureGallery(meta, stamp);

        histImg.onload = () => updateRGBHistogram(histImg, document.getElementById('histogram'));
        histImg.src = `images/${li.date}/image-${stamp}.${li.filetype || 'jpg'}`;
      } catch (err) {
        console.error('Failed to load the latest image:', err);
      }
    }

    document.addEventListener("DOMContentLoaded", init);
    document.addEventListener("DOMContentLoaded", () => {
      loadLatestCamera();
      setInterval(loadLatestCamera, 60000);
      window.addEventListener('allsky-timezone-change', () => {
        if (latestTimestamp) document.getElementById('hist-time').textContent = '· ' + formatDateTime(latestTimestamp);
      });
    });

    // ══════════════════════════════════════════════════════════════
    //  GRIDSTACK
    // ══════════════════════════════════════════════════════════════
    document.addEventListener('DOMContentLoaded', () => {
      const gridEl = document.getElementById('graphs-grid');
      const grid = GridStack.init({
        cellHeight: 110,
        disableOneColumnMode: false,
        float: false,
        resizable: { handles: 'all' }
      }, gridEl);

      let gridUnlocked = false;
      const toggleBtn = document.getElementById('toggle-grid-btn');

      grid.enableMove(false);
      grid.enableResize(false);

      window.toggleGridInteraction = function () {
        gridUnlocked = !gridUnlocked;
        if (gridUnlocked) {
          grid.enableMove(true);
          grid.enableResize(true);
          toggleBtn.textContent = '🔓 Unlocked';
          toggleBtn.classList.remove('badge-gray');
          toggleBtn.classList.add('badge-blue');
        } else {
          grid.enableMove(false);
          grid.enableResize(false);
          toggleBtn.textContent = '🔒 Locked';
          toggleBtn.classList.remove('badge-blue');
          toggleBtn.classList.add('badge-gray');
        }
      };

      const LS_KEY = 'allsky360.graphs1.layout.v2';
      // v2: histogram and HDR exposures moved here from the dashboard
      const defaultLayout = [
        { id: "latest-histogram",         x: 0, y:  0, w: 7,  h: 2 },
        { id: "hdr-gallery",              x: 7, y:  0, w: 5,  h: 2 },
        { id: "chart-exposure",           x: 0, y:  2,  w: 6,  h: 3 },
        { id: "chart-gain",               x: 6, y:  2,  w: 6,  h: 3 },
        { id: "chart-noise",              x: 0, y:  5,  w: 6,  h: 3 },
        { id: "chart-sqm",                x: 6, y:  5,  w: 3,  h: 3 },
        { id: "chart-stars",              x: 9, y:  5,  w: 3,  h: 3 },
        { id: "chart-hdr",                x: 0, y:  8,  w: 4,  h: 3 },
        { id: "chart-focus",              x: 4, y:  8,  w: 4,  h: 3 },
        { id: "chart-brightness",         x: 8, y:  8,  w: 4,  h: 3 },
        { id: "chart-mean-brightness-rgb",x: 0, y: 11,  w: 12, h: 3 }
      ];

      function applyLayout(layout) {
        const byId = Object.fromEntries(
          grid.engine.nodes.map(n => [n.id || n.el.getAttribute('gs-id'), n])
        );
        layout.forEach(l => {
          const node = byId[l.id];
          if (node) grid.update(node.el, { x: l.x, y: l.y, w: l.w, h: l.h });
        });
      }

      function loadLayout() {
        try {
          const raw = localStorage.getItem(LS_KEY);
          if (!raw) return null;
          const parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed : null;
        } catch { return null; }
      }

      function saveLayout() {
        const data = grid.save(true).map(n => ({
          id: n.id || n.el.getAttribute('gs-id'),
          x: n.x, y: n.y, w: n.w, h: n.h
        }));
        try { localStorage.setItem(LS_KEY, JSON.stringify(data)); } catch (_) {}
      }

      window.resetGridLayout = function () {
        applyLayout(defaultLayout);
        try { localStorage.removeItem(LS_KEY); } catch (_) {}
      };

      applyLayout(loadLayout() || defaultLayout);
      grid.on('change', saveLayout);
    });
  </script>

</body>

</html>
