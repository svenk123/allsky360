<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Allsky360 – Videos</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Allsky360 Videos">
  <meta name="theme-color" content="#0d1117" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <script src="js/allsky-common.js"></script>

  <link rel="stylesheet" href="allsky.css">
  <style>
    /* Purple accent overrides for Videos page */
    .nav-item.active { background: rgba(168,85,247,0.18); color: #a855f7; }
    .thumb-wrap { cursor: pointer; }
    .thumb {
      width: 120px;
      cursor: default; /* thumb-wrap handles cursor */
    }
    .thumb:hover {
      border-color: rgba(168,85,247,0.55);
      box-shadow: 0 4px 16px rgba(168,85,247,0.2);
    }
    .thumb.active { border-color: #a855f7; box-shadow: 0 0 0 1px rgba(168,85,247,0.5); }

    /* Play icon overlay */
    .thumb-play {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none; border-radius: 8px;
    }
    .thumb-play-icon {
      width: 30px; height: 30px;
      background: rgba(0,0,0,0.55); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: 1.5px solid rgba(255,255,255,0.45);
      transition: all 0.15s; backdrop-filter: blur(4px);
    }
    .thumb-wrap:hover .thumb-play-icon {
      background: rgba(168,85,247,0.6);
      border-color: rgba(168,85,247,0.8);
      transform: scale(1.1);
    }

    /* ── VIDEO SIDEBAR ──────────────────────────────────────────── */
    #video-sidebar {
      width: 50%;
      min-width: 360px;
      flex-shrink: 0;
      background: rgba(22,27,34,0.85);
      border-left: 1px solid rgba(255,255,255,0.06);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #video-panel {
      flex-shrink: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      position: relative;
    }

    #video-player {
      width: 100%;
      display: block;
      max-height: 80vh;
      background: #000;
      outline: none;
    }

    #video-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 40px 20px;
      color: #4b5563;
      text-align: center;
      width: 100%;
    }
    #video-placeholder svg { opacity: 0.35; }
    #video-placeholder p { font-size: 12px; line-height: 1.6; }

    #video-info {
      flex: 1;
      overflow-y: auto;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #video-title {
      font-size: 11px;
      font-weight: 600;
      color: #e5e7eb;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    #video-actions {
      display: flex;
      gap: 6px;
    }
    .action-btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 10px; border-radius: 8px; font-size: 11px;
      font-weight: 600; cursor: pointer; text-decoration: none;
      transition: all 0.15s; border: 1px solid;
      font-family: inherit;
    }
    .action-btn-purple {
      background: rgba(168,85,247,0.12); color: #a855f7;
      border-color: rgba(168,85,247,0.3);
    }
    .action-btn-purple:hover { background: rgba(168,85,247,0.25); }
    .action-btn-gray {
      background: rgba(255,255,255,0.05); color: #9ca3af;
      border-color: rgba(255,255,255,0.1);
    }
    .action-btn-gray:hover { background: rgba(255,255,255,0.1); color: #e5e7eb; }

    /* Metadata rows */
    .meta-section-title {
      font-size: 10px; font-weight: 700; color: #6b7280;
      text-transform: uppercase; letter-spacing: 0.09em;
      margin-bottom: 6px; margin-top: 10px;
    }
    .meta-section-title:first-child { margin-top: 0; }
    .meta-row {
      display: flex; justify-content: space-between;
      font-size: 11.5px; padding: 2.5px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      color: #9ca3af;
    }
    .meta-row span { color: #e5e7eb; font-weight: 500; }

    .meta-hint {
      color: #4b5563;
      font-size: 12px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <!-- allsky-common.js click handler requires these elements to exist -->
  <div id="nav-menu"           style="display:none;"></div>
  <div id="hamburger-menu-btn" style="display:none;"></div>

  <!-- ═══════════════════ HEADER ════════════════════════════════════ -->
  <header id="app-header">
    <a class="hdr-brand" href="dashboard.html">
      <img src="allsky360_256x256.png" alt="Allsky360" width="30" height="30" />
      <div class="hdr-brand-text">
        <div class="hdr-title">Allsky360</div>
        <div class="hdr-crumb">Videos · Timelapse Browser</div>
      </div>
    </a>

    <div class="hdr-badges">
      <span class="badge badge-gray"   id="hdr-date">–</span>
      <span class="badge badge-purple" id="hdr-count">0 videos</span>
    </div>
  </header>

  <!-- ═══════════════════ MAIN LAYOUT ═══════════════════════════════ -->
  <div id="main-layout">

    <!-- ── ICON NAV ─────────────────────────────────────────────── -->
    <nav id="icon-nav"></nav>
    <script>renderIconNav();</script>

    <!-- ── GALLERY AREA ──────────────────────────────────────────── -->
    <main id="gallery-area">

      <!-- Controls -->
      <div id="controls-bar">
        <div class="ctrl-group">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <span class="ctrl-label-text">Date</span>
          <input type="date" id="datePicker" class="ctrl-date" />
        </div>

        <div class="ctrl-group">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2">
            <line x1="8" y1="6" x2="21" y2="6"></line>
            <line x1="8" y1="12" x2="21" y2="12"></line>
            <line x1="8" y1="18" x2="21" y2="18"></line>
            <line x1="3" y1="6" x2="3.01" y2="6"></line>
            <line x1="3" y1="12" x2="3.01" y2="12"></line>
            <line x1="3" y1="18" x2="3.01" y2="18"></line>
          </svg>
          <span class="ctrl-label-text">Order</span>
          <select id="orderSelect" class="ctrl-select">
            <option value="descending">Descending</option>
            <option value="ascending">Ascending</option>
          </select>
        </div>
      </div>

      <!-- Gallery grid -->
      <div id="gallery-wrap">
        <div id="gallery">
          <div id="gallery-status">Select a date to browse timelapse videos.</div>
        </div>
      </div>

    </main>

    <!-- ── VIDEO SIDEBAR ─────────────────────────────────────────── -->
    <aside id="video-sidebar">

      <!-- Video player -->
      <div id="video-panel">
        <div id="video-placeholder">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="1.5">
            <polygon points="23 7 16 12 23 17 23 7"></polygon>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
          </svg>
          <p>Click a thumbnail<br>to play the video</p>
        </div>
        <video id="video-player" controls playsinline style="display:none;" preload="metadata">
          Your browser does not support HTML5 video.
        </video>
      </div>

      <!-- Info panel -->
      <div id="video-info">
        <div id="video-title" class="meta-hint">No video selected</div>

        <div id="video-actions" style="display:none;">
          <a id="btn-open" href="#" target="_blank" class="action-btn action-btn-purple">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
              <polyline points="15 3 21 3 21 9"></polyline>
              <line x1="10" y1="14" x2="21" y2="3"></line>
            </svg>
            Open
          </a>
          <button id="btn-download" class="action-btn action-btn-gray" onclick="downloadCurrentVideo()">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Download
          </button>
        </div>

        <div id="metadata-content">
          <p class="meta-hint">Click a thumbnail to load video details.</p>
        </div>
      </div>

    </aside>

  </div><!-- #main-layout -->

  <script>
    // ══════════════════════════════════════════════════════════════
    //  STATE
    // ══════════════════════════════════════════════════════════════
    let allTimestamps  = [];
    let currentDateStr = '';   // yyyymmdd
    let activeThumb    = null;
    let currentVideoPath = '';

    // ══════════════════════════════════════════════════════════════
    //  HELPERS
    // ══════════════════════════════════════════════════════════════
    function formatThumbTime(ts) {
      // ts = e.g. "night_avg_20251205" → return type label "night_avg"
      return ts.replace(/_\d{8}$/, '');
    }

    function formatThumbDate(ts) {
      // ts = e.g. "night_avg_20251205" → return "2025-12-05"
      const d = ts.slice(-8);
      return `${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}`;
    }

    function safeFixed(v, digits) {
      return (v != null && !isNaN(v)) ? Number(v).toFixed(digits) : 'N/A';
    }

    function thumbPath(ts) {
      return `videos/${ts}.png`;
    }

    function videoPath(ts) {
      return `videos/${ts}.mp4`;
    }

    function metaPath(ts) {
      return `videos/${ts}.json`;
    }

    // ══════════════════════════════════════════════════════════════
    //  GALLERY LOADING
    // ══════════════════════════════════════════════════════════════
    function loadThumbnails() {
      const dateInput = document.getElementById('datePicker').value;
      const order     = document.getElementById('orderSelect').value;
      const gallery   = document.getElementById('gallery');
      const hdrDate   = document.getElementById('hdr-date');
      const hdrCount  = document.getElementById('hdr-count');

      if (!dateInput) {
        gallery.innerHTML = '<div id="gallery-status">Please select a date.</div>';
        return;
      }

      currentDateStr = dateInput.replace(/-/g, '');
      hdrDate.textContent = dateInput;
      gallery.innerHTML = '<div id="gallery-status">Loading…</div>';
      resetPlayer();
      allTimestamps = [];
      activeThumb   = null;

      fetch(`/api/thumbnails?date=${dateInput}&type=video`)
        .then(r => {
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          return r.json();
        })
        .then(list => {
          gallery.innerHTML = '';

          if (!Array.isArray(list) || list.length === 0) {
            gallery.innerHTML = '<div id="gallery-status">No videos found for this date.</div>';
            hdrCount.textContent = '0 videos';
            return;
          }

          if (order === 'descending') list = list.slice().reverse();

          allTimestamps = list;
          hdrCount.textContent = `${list.length} video${list.length !== 1 ? 's' : ''}`;

          let currentType = null;

          list.forEach((ts) => {
            const vtype = ts.replace(/_\d{8}$/, '');
            if (vtype !== currentType) {
              currentType = vtype;
              const sep = document.createElement('div');
              sep.className = 'hour-sep';
              sep.textContent = vtype;
              gallery.appendChild(sep);
            }

            const wrap = document.createElement('div');
            wrap.className = 'thumb-wrap';

            const img = document.createElement('img');
            img.className = 'thumb';
            img.src     = thumbPath(ts);
            img.alt     = ts;
            img.title   = formatThumbDate(ts);
            img.loading = 'lazy';

            // Play icon overlay
            const playOverlay = document.createElement('div');
            playOverlay.className = 'thumb-play';
            playOverlay.innerHTML = `
              <div class="thumb-play-icon">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                  <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
              </div>`;

            const timeLabel = document.createElement('div');
            timeLabel.className = 'thumb-time';
            timeLabel.textContent = formatThumbTime(ts);

            wrap.appendChild(img);
            wrap.appendChild(playOverlay);
            wrap.appendChild(timeLabel);

            wrap.addEventListener('click', () => {
              setActiveThumb(img);
              playVideo(ts);
            });

            gallery.appendChild(wrap);
          });
        })
        .catch(err => {
          console.error('Error loading thumbnails:', err);
          gallery.innerHTML = '<div id="gallery-status">No data available for this date.</div>';
          hdrCount.textContent = '0 videos';
        });
    }

    // ══════════════════════════════════════════════════════════════
    //  VIDEO PLAYER
    // ══════════════════════════════════════════════════════════════
    function resetPlayer() {
      const player      = document.getElementById('video-player');
      const placeholder = document.getElementById('video-placeholder');
      const actions     = document.getElementById('video-actions');
      const titleEl     = document.getElementById('video-title');
      const metaEl      = document.getElementById('metadata-content');

      player.pause();
      player.removeAttribute('src');
      player.removeAttribute('poster');
      player.load();
      player.style.display = 'none';
      placeholder.style.display = 'flex';
      actions.style.display = 'none';
      titleEl.className = 'meta-hint';
      titleEl.textContent = 'No video selected';
      metaEl.innerHTML = '<p class="meta-hint">Click a thumbnail to load video details.</p>';
      currentVideoPath = '';
    }

    async function playVideo(ts) {
      const player      = document.getElementById('video-player');
      const placeholder = document.getElementById('video-placeholder');
      const actions     = document.getElementById('video-actions');
      const titleEl     = document.getElementById('video-title');
      const metaEl      = document.getElementById('metadata-content');
      const btnOpen     = document.getElementById('btn-open');

      const vPath = videoPath(ts);
      currentVideoPath = vPath;

      placeholder.style.display = 'none';
      player.style.display = 'block';
      // Last frame (written by the timelapse tool) as poster until playback starts
      player.poster = thumbPath(ts);
      player.src = vPath;
      player.load();
      player.play().catch(() => {}); // autoplay may be blocked

      titleEl.className = '';
      titleEl.textContent = `${ts}.mp4`;
      btnOpen.href = vPath;
      actions.style.display = 'flex';

      metaEl.innerHTML = '<p class="meta-hint">Loading metadata…</p>';

      try {
        const resp = await fetch(metaPath(ts), { cache: 'no-cache' });
        if (!resp.ok) throw new Error('not found');
        const m = await resp.json();
        metaEl.innerHTML = buildMetaHtml(m, ts);
      } catch {
        metaEl.innerHTML = '<p class="meta-hint">No metadata available.</p>';
      }
    }

    function buildMetaHtml(m, ts) {
      let html = '';

      html += '<div class="meta-section-title">Video Data</div>';
      html += `<div class="meta-row">Date/Time <span>${formatThumbDate(ts)}</span></div>`;
      if (m.timestamp != null)
        html += `<div class="meta-row">Timestamp <span>${formatTimestamp(m.timestamp, m.timezone_offset)}</span></div>`;
      if (m.exposure_t0 != null)
        html += `<div class="meta-row">Exposure t0 (s) <span>${safeFixed(m.exposure_t0, 5)}</span></div>`;
      if (m.gain != null)
        html += `<div class="meta-row">Gain <span>${safeFixed(m.gain, 1)}</span></div>`;
      if (m.sensor_temperature != null)
        html += `<div class="meta-row">Sensor temp (°C) <span>${safeFixed(m.sensor_temperature, 1)}</span></div>`;
      if (m.capture_interval != null)
        html += `<div class="meta-row">Interval (s) <span>${m.capture_interval}</span></div>`;
      if (m.night_mode != null)
        html += `<div class="meta-row">Night mode <span>${m.night_mode ? '✓ Yes' : '✗ No'}</span></div>`;
      if (m.hdr != null)
        html += `<div class="meta-row">HDR <span>${m.hdr}</span></div>`;

      if (m.sun_altitude != null || m.moon_altitude != null || m.moon_phase_percentage != null) {
        html += '<div class="meta-section-title">Environment</div>';
        if (m.sun_altitude != null)
          html += `<div class="meta-row">Sun altitude (°) <span>${safeFixed(m.sun_altitude, 1)}</span></div>`;
        if (m.moon_altitude != null)
          html += `<div class="meta-row">Moon altitude (°) <span>${safeFixed(m.moon_altitude, 1)}</span></div>`;
        if (m.moon_phase_percentage != null)
          html += `<div class="meta-row">Moon phase (%) <span>${safeFixed(m.moon_phase_percentage, 1)}</span></div>`;
      }

      return html;
    }

    function downloadCurrentVideo() {
      if (!currentVideoPath) return;
      const a = document.createElement('a');
      a.href = currentVideoPath;
      a.download = currentVideoPath.split('/').pop();
      a.click();
    }

    function setActiveThumb(imgEl) {
      if (activeThumb) activeThumb.classList.remove('active');
      imgEl.classList.add('active');
      activeThumb = imgEl;
    }

    // ══════════════════════════════════════════════════════════════
    //  INIT
    // ══════════════════════════════════════════════════════════════
    document.addEventListener('DOMContentLoaded', () => {
      const datePicker  = document.getElementById('datePicker');
      const orderSelect = document.getElementById('orderSelect');

      datePicker.addEventListener('change',  loadThumbnails);
      orderSelect.addEventListener('change', loadThumbnails);

      // Night videos are named after the UTC day of the end-of-night run
      datePicker.value = dayStringInZone(Date.now() / 1000, 'UTC');

      loadThumbnails();
    });
  </script>

</body>
</html>
