<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Allsky360 – System Status</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180" />
  <link rel="manifest" href="manifest.json" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0d1117" />

  <script src="js/allsky-common.js"></script>

  <link rel="stylesheet" href="allsky.css">
  <style>
    #status-main {
      flex: 1; min-width: 0;
      overflow-y: auto;
      padding: 12px 14px 24px;
    }
    .st-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 10px;
      align-items: start;
    }
    .st-wide { grid-column: 1 / -1; }

    /* ── health checks ── */
    .chk { display: flex; align-items: baseline; gap: 8px; font-size: 12px; padding: 4px 0;
           border-bottom: 1px solid rgba(255,255,255,0.04); }
    .chk-label { color: #e5e7eb; min-width: 140px; }
    .chk-text { color: #9ca3af; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; align-self: center; background: #4b5563; }
    .dot.ok    { background: #22c55e; }
    .dot.warn  { background: #f59e0b; }
    .dot.error { background: #ef4444; }
    .dot.off   { background: transparent; border: 2px solid #4b5563; width: 6px; height: 6px; }
    .chk-list { columns: 2 300px; column-gap: 24px; }
    .chk-list .chk { break-inside: avoid; }

    /* ── services ── */
    .svc { display: grid; grid-template-columns: 10px minmax(120px, 1fr) minmax(150px, 1.4fr) auto;
           gap: 4px 12px; align-items: center; padding: 8px 0;
           border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 12px; }
    .svc:last-child { border-bottom: none; }
    .svc-name { color: #e5e7eb; font-weight: 600; }
    .svc-unit { color: #4b5563; font-size: 10px; font-family: ui-monospace, monospace; }
    .svc-state { color: #9ca3af; font-variant-numeric: tabular-nums; line-height: 1.5; }
    .svc-state b { color: #e5e7eb; font-weight: 500; }
    .svc-state .fail { color: #ef4444; }
    .svc-btns { display: flex; gap: 4px; }
    .svc-btn { border-radius: 7px; padding: 4px 9px; font-size: 11px; cursor: pointer; font-family: inherit; }
    .svc-btn-start   { background:rgba(34,197,94,0.12);  color:#22c55e; border:1px solid rgba(34,197,94,0.28); }
    .svc-btn-stop    { background:rgba(239,68,68,0.12);  color:#ef4444; border:1px solid rgba(239,68,68,0.28); }
    .svc-btn-restart { background:rgba(234,179,8,0.12);  color:#eab308; border:1px solid rgba(234,179,8,0.28); }
    .svc-btn:hover { filter: brightness(1.3); }
    #msg-bar { min-height: 16px; font-size: 11px; color: #9ca3af; margin-top: 6px; }
    #msg-bar.ok  { color: #22c55e; }
    #msg-bar.err { color: #ef4444; }

    /* ── key/value rows ── */
    .kv { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; padding: 3px 0;
          border-bottom: 1px solid rgba(255,255,255,0.04); color: #9ca3af; }
    .kv:last-child { border-bottom: none; }
    .kv span:last-child { color: #e5e7eb; font-variant-numeric: tabular-nums; text-align: right; }
    .kv a { color: #3b82f6; text-decoration: none; }
    .kv span.warn { color: #f59e0b; }
    .kv span.error { color: #ef4444; }

    .bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); overflow: hidden; margin: 4px 0 8px; }
    .bar > div { height: 100%; background: #3b82f6; }
    .bar.warn > div { background: #f59e0b; }
    .bar.error > div { background: #ef4444; }

    #latest-thumb { width: 100%; max-height: 220px; object-fit: contain; border-radius: 10px;
                    background: #000; margin-bottom: 8px; display: block; }
    .st-empty { font-size: 12px; color: #6b7280; }

    @media (max-width: 700px) {
      .svc { grid-template-columns: 10px 1fr; }
      .svc-state, .svc-btns { grid-column: 2; }
      #status-main { padding: 10px 8px 20px; }
    }
  </style>
</head>

<body>
  <!-- allsky-common.js click handler requires these elements -->
  <div id="nav-menu"           style="display:none;"></div>
  <div id="hamburger-menu-btn" style="display:none;"></div>

  <header id="app-header">
    <a class="hdr-brand" href="dashboard.html">
      <img src="allsky360_256x256.png" alt="Allsky360" width="30" height="30" />
      <div class="hdr-brand-text">
        <div class="hdr-title">Allsky360</div>
        <div class="hdr-crumb">System · Status</div>
      </div>
    </a>
    <div class="hdr-badges">
      <button class="badge badge-gray" id="time-mode-btn" type="button"></button>
      <span class="badge badge-gray" id="overall"><span class="badge-dot"></span><span id="overall-text">loading</span></span>
      <span class="badge badge-gray" id="updated">–</span>
    </div>
  </header>

  <div id="main-layout">
    <nav id="icon-nav"></nav>
    <script>renderIconNav();</script>

    <main id="status-main">
      <div class="st-grid">

        <div class="card st-wide">
          <div class="card-title">Health checks</div>
          <div class="chk-list" id="checks"><div class="st-empty">Loading…</div></div>
        </div>

        <div class="card st-wide">
          <div class="card-title">Services &amp; timers</div>
          <div id="services"><div class="st-empty">Loading…</div></div>
          <div id="msg-bar"></div>
        </div>

        <div class="card">
          <div class="card-title">Camera</div>
          <img id="latest-thumb" alt="Latest image" style="display:none" />
          <div id="camera"></div>
        </div>

        <div class="card">
          <div class="card-title">Data</div>
          <div id="data"></div>
        </div>

        <div class="card">
          <div class="card-title">Hardware</div>
          <div id="hardware"></div>
        </div>

        <div class="card">
          <div class="card-title">Storage</div>
          <div id="storage"></div>
        </div>

        <div class="card" id="cabinet-card" style="display:none">
          <div class="card-title">Control cabinet</div>
          <div id="cabinet"></div>
        </div>

      </div>
    </main>
  </div>

  <script>
    const REFRESH_MS = 30000;
    let lastStatus = null;

    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const kv = (k, v, cls = '') => `<div class="kv"><span>${k}</span><span class="${cls}">${v}</span></div>`;

    function ago(sec) {
      if (sec == null) return '–';
      sec = Math.max(0, sec);
      if (sec < 90) return `${Math.round(sec)} s ago`;
      if (sec < 5400) return `${Math.round(sec / 60)} min ago`;
      if (sec < 172800) return `${Math.round(sec / 3600)} h ago`;
      return `${Math.round(sec / 86400)} d ago`;
    }
    function inTime(sec) {
      if (sec == null) return '–';
      if (sec < 90) return `in ${Math.max(0, Math.round(sec))} s`;
      if (sec < 5400) return `in ${Math.round(sec / 60)} min`;
      return `in ${Math.round(sec / 3600)} h`;
    }
    function bytes(n) {
      if (n == null) return '–';
      const u = ['B', 'KB', 'MB', 'GB', 'TB'];
      let i = 0;
      while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
      return `${n.toFixed(n >= 100 || i === 0 ? 0 : 1)} ${u[i]}`;
    }
    function duration(sec) {
      const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
      return d ? `${d} d ${h} h` : h ? `${h} h ${m} min` : `${m} min`;
    }
    const when = (ts) => ts ? `${formatDateTime(ts, { seconds: false })} · ${ago(Date.now() / 1000 - ts)}` : '–';

    // ── Health checks ──────────────────────────────────────────
    function renderChecks(s) {
      // problems first, then the rest in API order
      const rank = { error: 0, warn: 1, ok: 2, off: 3 };
      const list = [...s.checks].sort((a, b) => rank[a.level] - rank[b.level]);
      document.getElementById('checks').innerHTML = list.map(c =>
        `<div class="chk"><span class="dot ${c.level}" title="${c.level}"></span>` +
        `<span class="chk-label">${esc(c.label)}</span><span class="chk-text">${esc(c.text)}</span></div>`).join('');
    }

    // ── Services (the controls were on config.html before) ─────
    function serviceLevel(s, checks) {
      return checks.find(c => c.id === s.unit)?.level || 'off';
    }
    function serviceStateText(s) {
      const now = Date.now() / 1000;
      if (s.timer) {
        const t = s.timer;
        const every = t.interval ? ` · every ${t.interval >= 3600 ? t.interval / 3600 + ' h' : t.interval / 60 + ' min'}` : '';
        const parts = [`Timer <b>${esc(t.active)}</b>${every}`];
        const last = t.last || s.last_start;
        if (last) {
          const result = s.result === 'success' ? 'OK'
            : `<span class="fail">${esc(s.result || s.active)}${s.exit_status ? ' (exit ' + s.exit_status + ')' : ''}</span>`;
          parts.push(`Last run <b>${formatClock(last)}</b> · ${ago(now - last)} · ${result}`);
        }
        if (t.active === 'active')
          parts.push(t.next ? `Next run <b>${formatClock(t.next)}</b> · ${inTime(t.next - now)}` : '<span class="fail">No next run scheduled</span>');
        return parts.join('<br>');
      }
      if (s.active === 'active') return `<b>Running</b>${s.last_start ? ` since ${formatDateTime(s.last_start, { seconds: false })}` : ''}`;
      if (s.process) return '<b>Running outside systemd</b> (make camera-run)';
      return `<b>${esc(s.active)}</b>${s.result && s.result !== 'success' ? ` · ${esc(s.result)}` : ''}`;
    }
    function renderServices(s) {
      document.getElementById('services').innerHTML = s.services.map(svc => {
        const timer = !!svc.timer;
        const id = esc(svc.unit);
        return `<div class="svc">
          <span class="dot ${serviceLevel(svc, s.checks)}"></span>
          <div><div class="svc-name">${esc(svc.label)}</div><div class="svc-unit">${id}</div></div>
          <div class="svc-state">${serviceStateText(svc)}</div>
          <div class="svc-btns">
            <button class="svc-btn svc-btn-start" onclick="controlService('${id}','start')" title="${timer ? 'Start the timer' : 'Start'}">Start</button>
            <button class="svc-btn svc-btn-restart" onclick="controlService('${id}','restart')" title="${timer ? 'Run once now' : 'Restart'}">${timer ? 'Run now' : 'Restart'}</button>
            <button class="svc-btn svc-btn-stop" onclick="controlService('${id}','stop')" title="${timer ? 'Stop the timer' : 'Stop'}">Stop</button>
          </div>
        </div>`;
      }).join('');
    }

    // Service control requires the api-token from config.ini. It is asked for
    // once and kept in sessionStorage, so it is gone when the tab is closed.
    const TOKEN_KEY = 'allsky360-api-token';
    function getApiToken(forcePrompt) {
      let token = null;
      try { token = sessionStorage.getItem(TOKEN_KEY); } catch {}
      if (!token || forcePrompt) {
        token = window.prompt('API token (api-token in config.ini):', '');
        if (!token) return null;
        try { sessionStorage.setItem(TOKEN_KEY, token); } catch {}
      }
      return token;
    }
    function forgetApiToken() { try { sessionStorage.removeItem(TOKEN_KEY); } catch {} }
    function postServiceAction(unit, action, token) {
      return fetch(`api/services/${action}?service=${encodeURIComponent(unit)}`, {
        method: 'POST', headers: { 'X-API-Token': token }
      });
    }
    async function controlService(unit, action) {
      const msg = document.getElementById('msg-bar');
      const svc = lastStatus?.services.find(s => s.unit === unit);
      const label = svc?.label || unit, isTimer = !!svc?.timer;
      const doing = action === 'start' ? 'Starting' : action === 'stop' ? 'Stopping' : isTimer ? 'Running' : 'Restarting';
      const done  = action === 'start' ? 'started'  : action === 'stop' ? 'stopped'  : isTimer ? 'triggered' : 'restarted';
      msg.className = ''; msg.textContent = `${doing} ${label}…`;
      try {
        let token = getApiToken(false);
        if (!token) { msg.className = 'err'; msg.textContent = `${label}: cancelled, no API token entered.`; return; }
        let res = await postServiceAction(unit, action, token);
        if (res.status === 401) {
          // stored token wrong or outdated: ask once more
          forgetApiToken();
          token = getApiToken(true);
          if (token) res = await postServiceAction(unit, action, token);
        }
        if (res.status === 401) forgetApiToken();
        const data = await res.json();
        if (res.ok && data.status === 'success') { msg.className = 'ok'; msg.textContent = `${label} ${done}.`; }
        else { msg.className = 'err'; msg.textContent = `${label} ${action} failed: ${data.error || 'unknown error'}`; }
      } catch (e) {
        msg.className = 'err'; msg.textContent = `${label} ${action} failed: ${e.message}`;
      }
      // the API caches the status for 5 s
      setTimeout(load, 6000);
      setTimeout(() => { if (msg.textContent.startsWith(label)) msg.textContent = ''; }, 8000);
    }

    // ── Camera, data, hardware, storage, cabinet ────────────────
    function renderCamera(s) {
      const img = document.getElementById('latest-thumb');
      if (s.image) {
        if (!img.src.endsWith(s.image.path)) img.src = s.image.path;
        img.style.display = '';
      } else img.style.display = 'none';
      const chk = s.checks.find(c => c.id === 'image');
      const cam = s.services.find(x => x.unit === 'allsky360-camera.service');
      document.getElementById('camera').innerHTML =
        kv('Latest image', s.image ? when(s.image.timestamp) : 'none', chk && chk.level !== 'ok' ? chk.level : '') +
        kv('Capture', cam ? (cam.active === 'active' ? 'service running' : cam.process ? 'running outside systemd' : esc(cam.active)) : '–') +
        kv('', '<a href="dashboard.html">Dashboard →</a> · <a href="graphs.html">Camera statistics →</a>');
    }
    function renderData(s) {
      const row = (label, d, warnAfter, link) =>
        kv(`<a href="${link}">${label}</a>`, d ? when(d.timestamp) : 'no data', !d || d.age_s > warnAfter ? 'warn' : '');
      document.getElementById('data').innerHTML =
        row('Station sensors', s.data.sensors, 15 * 60, 'meteo.html') +
        row('Weather (Open-Meteo)', s.data.meteo, 90 * 60, 'meteo.html') +
        row('Forecast', s.data.forecast, 90 * 60, 'meteo.html') +
        row('Aurora (NOAA)', s.data.aurora, 30 * 60, 'aurora.html');
    }
    function renderHardware(s) {
      const h = s.host;
      const temps = [...s.temperatures].sort((a, b) => b.celsius - a.celsius);
      const tempCls = (c) => c >= 95 ? 'error' : c >= 85 ? 'warn' : '';
      const used = h.mem_total - h.mem_available;
      document.getElementById('hardware').innerHTML =
        kv('Host', esc(h.hostname)) +
        kv('Uptime', duration(h.uptime_s)) +
        kv('Load (1/5/15 min)', `${h.load.map(v => v.toFixed(2)).join(' / ')} · ${h.cpus} cores`, h.load[0] > h.cpus ? 'warn' : '') +
        kv('Memory used', `${bytes(used)} of ${bytes(h.mem_total)} (${Math.round(used / h.mem_total * 100)} %)`) +
        temps.map(t => kv(`Temperature ${esc(t.name)}`, `${t.celsius.toFixed(1)} °C`, tempCls(t.celsius))).join('');
    }
    function renderStorage(s) {
      let html = s.disks.map(d => {
        const cls = d.free_pct < 5 ? 'error' : d.free_pct < 10 ? 'warn' : '';
        return kv(`Disk · ${d.used_by.join(', ')}`, `${bytes(d.free)} free of ${bytes(d.total)}`, cls) +
               `<div class="bar ${cls}"><div style="width:${(100 - d.free_pct).toFixed(1)}%"></div></div>`;
      }).join('');
      const db = s.databases;
      if (db) {
        const day = (d) => d ? `${d.slice(0, 4)}-${d.slice(4, 6)}-${d.slice(6)}` : '–';
        html += kv('Daily databases', `${db.count} · ${bytes(db.bytes)}`) +
                kv('Range (UTC days)', `${day(db.oldest)} … ${day(db.newest)}`);
      }
      document.getElementById('storage').innerHTML = html || '<div class="st-empty">No data</div>';
    }
    function renderCabinet(s) {
      const card = document.getElementById('cabinet-card');
      if (!s.cabinet) { card.style.display = 'none'; return; }
      card.style.display = '';
      const c = s.cabinet;
      const margin = c.dew_point != null ? c.temperature - c.dew_point : null;
      document.getElementById('cabinet').innerHTML =
        kv('Temperature', `${c.temperature.toFixed(1)} °C`) +
        (c.humidity != null ? kv('Humidity', `${c.humidity.toFixed(0)} %`) : '') +
        (margin != null ? kv('Above dew point', `${margin.toFixed(1)} K`, margin < 2 ? 'warn' : '') : '') +
        kv('Reading', when(c.timestamp));
    }

    function renderOverall(s) {
      const problems = s.checks.filter(c => c.level === 'warn' || c.level === 'error').length;
      document.getElementById('overall').className = 'badge ' +
        (s.overall === 'error' ? 'badge-red' : s.overall === 'warn' ? 'badge-orange' : 'badge-green');
      document.getElementById('overall-text').textContent = problems ? `${problems} problem${problems > 1 ? 's' : ''}` : 'all OK';
      document.getElementById('updated').textContent = `updated ${formatClock(s.generated, { seconds: true })}`;
    }

    async function load() {
      try {
        const res = await fetch('api/system/status', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const s = await res.json();
        lastStatus = s;
        renderOverall(s);
        renderChecks(s);
        renderServices(s);
        renderCamera(s);
        renderData(s);
        renderHardware(s);
        renderStorage(s);
        renderCabinet(s);
        setNavHealth(s);
      } catch (err) {
        console.error('Failed to load the system status:', err);
        document.getElementById('overall').className = 'badge badge-red';
        document.getElementById('overall-text').textContent = 'API not reachable';
      }
    }

    initTimeModeToggle(document.getElementById('time-mode-btn'));
    window.addEventListener('allsky-timezone-change', () => { if (lastStatus) load(); });
    load();
    setInterval(load, REFRESH_MS);
  </script>
</body>
</html>
