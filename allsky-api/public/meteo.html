<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Allsky360 – Weather</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Allsky360 Meteo">
  <meta name="theme-color" content="#0b0d14" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@9.2.2/dist/gridstack.min.css">

  <script src="js/allsky-common.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gridstack@9.2.2/dist/gridstack-all.js" defer></script>

  <link rel="stylesheet" href="allsky.css">
  <style>
    /* ── METEO MAIN ─────────────────────────────────────────────── */
    #meteo-main {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    #controls-bar { padding: 12px 12px 0; }

    /* ── CHARTS SCROLL ──────────────────────────────────────────── */
    #meteo-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 8px 8px 20px;
    }

    /* ── WIND ROSE (share per sector, stacked by Beaufort class) ── */
    .wind-polar { position: relative; height: 100%; display: flex; flex-direction: column; }
    .wp-head {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 8px 12px 0;
    }
    .wp-title { font-size: 12px; font-weight: 500; color: #eef0f5; }
    .wp-legend { display: flex; gap: 12px; margin-left: auto; flex-wrap: wrap; }
    .wp-key {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; color: #a3a9b8; cursor: pointer; user-select: none;
      background: none; border: none; font-family: inherit; padding: 0;
    }
    .wp-key.off { opacity: 0.4; }
    .wp-key i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .wp-key i.ring { background: none; border: 1px solid currentColor; }
    .wr-src { padding: 1px 6px; border-radius: 4px; border: 1px solid transparent; }
    .wr-src.on { color: #eef0f5; border-color: rgba(238,240,245,0.18); background: rgba(238,240,245,0.05); }
    .wr-src:focus-visible { outline: 2px solid #5598e7; outline-offset: 1px; }
    .wr-classes {
      display: flex; gap: 10px; flex-wrap: wrap; padding: 4px 12px 0;
      font-size: 10px; color: #a3a9b8;
    }
    .wr-class { display: inline-flex; align-items: center; gap: 4px; }
    .wr-class i { width: 8px; height: 8px; border-radius: 2px; }
    .wr-class i.ring { border-radius: 50%; border: 1px solid #7a8296; }
    .wp-plot { flex: 1; min-height: 0; position: relative; }
    .wp-plot canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .wp-tip {
      position: absolute; pointer-events: none; display: none; z-index: 5;
      background: rgba(7,8,13,0.92); border: 1px solid rgba(238,240,245,0.14);
      border-radius: 6px; padding: 4px 8px;
      font-family: var(--mono); font-variant-numeric: tabular-nums;
      font-size: 11px; color: #eef0f5; white-space: nowrap;
    }
    .wp-tip span { color: #7a8296; }

    /* ── STATION SENSORS (allsky360-sensors) ────────────────────── */
    .sensor-live {
      height: 100%;
      display: flex; flex-direction: column; gap: 8px;
      padding: 12px 12px;
      overflow-y: auto;
    }
    .sensor-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .sensor-head-title { font-size: 12px; font-weight: 500; color: #eef0f5; }
    .sensor-head-meta { font-size: 11px; color: #7a8296; font-variant-numeric: tabular-nums; }
    .sensor-tiles {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 8px;
    }
    .s-tile {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      padding: 8px 8px;
      min-width: 0;
    }
    .s-label {
      font-size: 12px; font-weight: 500; color: #7a8296;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .s-value {
      display: flex; align-items: center; gap: 8px;
      margin-top: 2px;
      font-size: 20px; font-weight: 500; color: #eef0f5;
      font-variant-numeric: tabular-nums;
    }
    .s-unit { font-size: 11px; font-weight: 500; color: #a3a9b8; }
    .s-sub { margin-top: 1px; font-size: 11px; color: #7a8296; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .s-tile.s-warn { border-color: rgba(245,158,11,0.35); }
    .s-tile.s-warn .s-value, .s-tile.s-warn .s-sub { color: #e0a33a; }
    .s-compass { width: 20px; height: 20px; flex-shrink: 0; transition: transform 0.4s; }
    .sensor-empty { font-size: 12px; color: #7a8296; }

    /* ── FORECAST (forecast_meteo.json, next 24 h) ──────────────── */
    .fc-wrap {
      height: 100%;
      display: flex; flex-direction: column; gap: 8px;
      padding: 8px 12px 12px;
      min-width: 0;
    }
    /* like the Chart.js titles of the other widgets */
    .fc-title { text-align: center; font-size: 12px; font-weight: 500; color: #eef0f5; }
    .fc-summary { display: flex; flex-wrap: wrap; gap: 8px; }
    .fc-scroll { flex: 1; min-height: 0; overflow: auto; }
    .fc-table {
      display: grid;
      /* label column + one column per hour */
      grid-template-columns: 100px repeat(var(--fc-cols), minmax(34px, 1fr));
      font-size: 11px; font-variant-numeric: tabular-nums;
      color: #eef0f5;
      min-width: max-content;
    }
    .fc-lbl {
      position: sticky; left: 0; z-index: 1;
      /* opaque: card colour (rgba(255,255,255,0.04) over #0b0d14) */
      background: #171c22;
      color: #7a8296; font-weight: 500;
      font-size: 12px;
      display: flex; align-items: center;
      padding-right: 8px;
      white-space: nowrap;
    }
    .fc-c {
      height: 19px;
      display: flex; align-items: center; justify-content: center;
      border-left: 1px solid rgba(255,255,255,0.03);
      white-space: nowrap;
    }
    .fc-c.night { background: rgba(0,0,0,0.28); }
    .fc-c.now { box-shadow: inset 2px 0 0 #8ab4f0; }
    .fc-hour { color: #a3a9b8; font-weight: 500; }
    .fc-hour.midnight { color: #eef0f5; }
    .fc-cloud { border-radius: 3px; margin: 1px; font-weight: 500; }
    .fc-dim { color: #7a8296; }
    .fc-drop { width: 8px; height: 10px; margin-right: 1px; flex: none; fill: #38bdf8; }
    .fc-warn { color: #e0a33a; font-weight: 500; }
    .fc-rain { color: #38bdf8; font-weight: 500; }
    .fc-empty { font-size: 12px; color: #7a8296; }
  </style>
</head>

<body>
  <!-- allsky-common.js click handler requires these elements -->
  <div id="nav-menu"           style="display:none;"></div>
  <div id="hamburger-menu-btn" style="display:none;"></div>

  <!-- ═══════════════════ HEADER ════════════════════════════════════ -->
  <header id="app-header">
    <a class="hdr-brand" href="dashboard.html">
      <img src="allsky360_256x256.png" alt="Allsky360" width="30" height="30" />
      <div class="hdr-brand-text">
        <div class="hdr-title">Allsky360</div>
        <div class="hdr-crumb">Weather · Forecast &amp; Station Sensors</div>

    <div class="hdr-badges">

      <button class="badge badge-gray" id="toggle-grid-btn" onclick="toggleGridInteraction()"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Locked</button>
      <button class="badge badge-gray" id="reset-layout-btn" onclick="resetGridLayout()"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg> Reset</button>
    </div>
  </header>

  <!-- ═══════════════════ MAIN LAYOUT ═══════════════════════════════ -->
  <div id="main-layout">

    <!-- ── ICON NAV ─────────────────────────────────────────────── -->
    <nav id="icon-nav"></nav>
    <script>renderIconNav();</script>

    <!-- ── METEO MAIN ─────────────────────────────────────────────── -->
    <main id="meteo-main">

      <!-- Controls -->
      <div id="controls-bar">
        <div class="ctrl-group">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#7a8296" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8"  y1="2" x2="8"  y2="6"></line>
            <line x1="3"  y1="10" x2="21" y2="10"></line>
          </svg>
          <span class="ctrl-label-text">Date</span>
          <input type="date" id="datePicker" class="ctrl-date" />
        </div>
      </div>

      <!-- GridStack -->
      <div id="meteo-scroll">

          <div class="grid-stack-item" gs-id="sensor-live" gs-x="0" gs-y="0" gs-w="12" gs-h="2">

              <div class="fc-wrap">
                <div class="fc-title" id="fc-title">Forecast</div>
                <div class="fc-summary" id="fc-summary"></div>

          <div class="grid-stack-item" gs-id="chart-temp" gs-x="0" gs-y="5" gs-w="6" gs-h="3">

          <div class="grid-stack-item" gs-id="chart-clouds" gs-x="6" gs-y="18" gs-w="6" gs-h="3">

          </div>

          <div class="grid-stack-item" gs-id="chart-visibility" gs-x="0" gs-y="21" gs-w="6" gs-h="3">

          <div class="grid-stack-item" gs-id="chart-jetstream" gs-x="6" gs-y="21" gs-w="6" gs-h="3">
            <div class="grid-stack-item-content">

            </div>
          </div>

          <div class="grid-stack-item" gs-id="chart-cabinet" gs-x="0" gs-y="24" gs-w="6" gs-h="3">

              <canvas id="chartCabinet"></canvas>

        </div>
      </div>

    </main>

  </div><!-- #main-layout -->

  <script>
    // ══════════════════════════════════════════════════════════════
    //  HELPERS
    // ══════════════════════════════════════════════════════════════
    const MS_TO_KMH = 3.6;
    // A reading is written every 5 minutes; older than this counts as stale
    const SENSOR_STALE_S = 15 * 60;
    // Draw station lines across single missing readings, break on longer gaps
    const SENSOR_SPAN_MS = 15 * 60 * 1000;

    const isNum = (v) => typeof v === 'number' && Number.isFinite(v);

    // Sensors with an address in config.ini ("configured" in
    // latest_sensor_data.json: weather, anemometer, wind_vane, cabinet).
    // null = unknown (older allsky360-sensors): everything is shown
    let sensorsConfigured = null;
    const sensorShown = (key) => !key || !sensorsConfigured || sensorsConfigured[key] !== false;

    // The selected date is a calendar day in the display time zone (station
    // time or UTC, see allsky-common.js); range in milliseconds for the axes
    function dayRangeMs(dateStr) {
      const r = dayRangeInZone(dateStr);
      return { start: r.start * 1000, end: r.end * 1000 };
    }

    function cardinal(deg) {
      const dirs = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE',
                    'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
      return dirs[Math.round((((deg % 360) + 360) % 360) / 22.5) % 16];
    }

    // [{x: ms, y: value}] for Chart.js; non-numeric values become gaps
    function xy(rows, fn) {
      return rows.map(d => {
        const v = fn(d);
        return { x: d.timestamp * 1000, y: isNum(v) ? v : null };
      });
    }

    // ══════════════════════════════════════════════════════════════
    //  CHART FACTORY
    // ══════════════════════════════════════════════════════════════
    const charts = {};
    const AXIS_TICKS = { color: '#a3a9b8', font: { size: 10 } };
    const AXIS_GRID = { color: 'rgba(255,255,255,0.06)' };

    function line(label, color, extra = {}) {
      return { label, data: [], borderColor: color, backgroundColor: color, fill: false,
               pointRadius: 0, borderWidth: 1.5, tension: 0.15, ...extra };
    }
    // Station (sensor) series: dashed is the forecast, solid is measured
    function station(label, color, extra = {}) {
      return line(label, color, { spanGaps: SENSOR_SPAN_MS, borderWidth: 2, ...extra });
    }

    // y1: optional right axis { title, ...options }
    function createChart(id, label, datasets, type = "line", showLegend = false, y = {}, y1 = null) {
      const scales = {
        x: {
          type: 'time',
          time: {
            unit: 'hour',
            tooltipFormat: 'HH:mm',
            displayFormats: { hour: 'HH:mm', minute: 'HH:mm' }
          },
          ticks: chartTimeTicks({ ...AXIS_TICKS, maxTicksLimit: 8 }),
          grid: AXIS_GRID
        },
        y: {
          ticks: { ...AXIS_TICKS, callback: (v) => Number.isInteger(v) ? v.toString() : v.toFixed(1) },
          grid: AXIS_GRID,
          ...y
        }
      };
      if (y1) {
        const { title, ...rest } = y1;
        scales.y1 = {
          position: 'right',
          ticks: AXIS_TICKS,
          grid: { drawOnChartArea: false },
          title: { display: !!title, text: title, color: '#7a8296', font: { size: 10 } },
          ...rest
        };
      }
      return new Chart(document.getElementById(id), {
        type,
        data: { datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          interaction: { mode: 'nearest', axis: 'x', intersect: false },
          scales,
          plugins: {
            tooltip: { callbacks: { title: chartTooltipTitle } },
            title: {
              display: true,
              text: label,
              color: '#eef0f5',
              font: { size: 12, weight: '600' },
              padding: { top: 6, bottom: 4 }
            },
            legend: {
              display: showLegend,
              labels: { color: '#a3a9b8', boxWidth: 10, boxHeight: 2, font: { size: 11 },
                        filter: (item, data) => sensorShown(data.datasets[item.datasetIndex].sensor) }
            }
          }
        }
      });
    }

    // ══════════════════════════════════════════════════════════════
    //  WIND ROSE
    //  Share of the day's readings per direction sector (16 sectors, N up,
    //  clockwise, the bar points where the wind comes from), stacked by
    //  Beaufort class from the center outward. Readings below CALM_MS have
    //  no direction of their own (allsky360-sensors keeps the last one),
    //  they are counted as calm in the center instead of in a sector.
    // ══════════════════════════════════════════════════════════════
    // Same as modbus_wind_calm_speed (config.ini default). The anemometer
    // only starts turning at up to 2 m/s, so calm means "below its start"
    const CALM_MS = 0.3;
    // Beaufort classes (lower bound in m/s, readings are 10-minute means
    // with two decimals) on one blue ramp: darker = lighter wind
    const WIND_CLASSES = [
      { min: CALM_MS, label: 'Bft 1', range: '0.3–1.5 m/s', color: '#184f95' },
      { min: 1.55,    label: 'Bft 2', range: '1.6–3.3 m/s', color: '#2a78d6' },
      { min: 3.35,    label: 'Bft 3', range: '3.4–5.4 m/s', color: '#5598e7' },
      { min: 5.45,    label: 'Bft 4', range: '5.5–7.9 m/s', color: '#86b6ef' },
      { min: 7.95,    label: 'Bft 5+', range: '≥ 8 m/s',    color: '#cde2fb' }
    ];
    const WIND_NO_SPEED = { label: 'no speed', color: '#7a8296' };
    const WIND_MUTED = '#7a8296';

    // Class index, -1 = calm, null = no speed reading
    function windClass(speed) {
      if (!isNum(speed)) return null;
      if (speed < CALM_MS) return -1;
      let k = 0;
      WIND_CLASSES.forEach((c, i) => { if (speed >= c.min) k = i; });
      return k;
    }

    const WIND_SOURCES = [
      { label: 'Wind vane', table: 'sensors', sensor: 'wind_vane',
        dir: d => d.wind_direction, speed: d => d.wind_speed },
      { label: 'Weather sensor', table: 'sensors', sensor: 'weather',
        dir: d => d.ws_wind_direction, speed: d => d.ws_wind_speed },
      { label: 'Forecast 10 m', table: 'meteo',
        dir: d => d.wind_dir_10m, speed: d => isNum(d.wind_speed_10m) ? d.wind_speed_10m / MS_TO_KMH : null }
    ];

    let windRose = null;

    function createWindRose(root) {
      const canvas = root.querySelector('canvas');
      const tip = root.querySelector('.wp-tip');
      const sourceEl = root.querySelector('.wp-legend');
      const classEl = root.querySelector('.wr-classes');
      const surface = getComputedStyle(document.documentElement).getPropertyValue('--card').trim() || '#11141c';
      let tables = { sensors: [], meteo: [] };
      let source = 0, picked = false, stats = null, geom = null;

      const rad = (deg) => (deg - 90) * Math.PI / 180;   // 0° = north, up
      const pct = (n) => stats.total ? `${(100 * n / stats.total).toFixed(n && 100 * n / stats.total < 1 ? 1 : 0)} %` : '–';

      function renderControls() {
        sourceEl.innerHTML = WIND_SOURCES.map((s, i) => sensorShown(s.sensor)
          ? `<button type="button" class="wp-key wr-src${i === source ? ' on' : ''}" data-i="${i}" aria-pressed="${i === source}">${s.label}</button>`
          : ''
        ).join('');
      }
      classEl.innerHTML =
        `<span class="wr-class"><i class="ring"></i>calm &lt; ${CALM_MS} m/s (center)</span>` +
        WIND_CLASSES.map(c => `<span class="wr-class" title="${c.range}"><i style="background:${c.color}"></i>${c.label}</span>`).join('');
      sourceEl.addEventListener('click', (e) => {
        const b = e.target.closest('.wr-src');
        if (!b) return;
        source = +b.dataset.i;
        picked = true;
        renderControls();
        compute();
        draw();
      });

      function compute() {
        const src = WIND_SOURCES[source];
        const sectors = Array.from({ length: 16 }, () => ({ n: 0, byClass: new Array(WIND_CLASSES.length + 1).fill(0) }));
        let calm = 0, total = 0;
        for (const d of tables[src.table]) {
          const dir = src.dir(d);
          if (!isNum(dir)) continue;
          total++;
          const k = windClass(src.speed(d));
          if (k === -1) { calm++; continue; }
          const s = sectors[Math.round((((dir % 360) + 360) % 360) / 22.5) % 16];
          s.n++;
          s.byClass[k === null ? WIND_CLASSES.length : k]++;
        }
        stats = { sectors, calm, total };
      }

      function niceMax(share) {
        for (const m of [0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.4, 0.5, 0.6, 0.8, 1]) if (share <= m) return m;
        return 1;
      }

      function draw() {
        const dpr = window.devicePixelRatio || 1;
        const w = canvas.clientWidth, h = canvas.clientHeight;
        if (!w || !h) return;
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        const ctx = canvas.getContext('2d');
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, w, h);

        const cx = w / 2, cy = h / 2;
        const R = Math.max(24, Math.min(w, h) / 2 - 20);     // room for N/E/S/W
        const r0 = Math.max(18, R * 0.22);                   // center disc: calm share
        const maxShare = stats && stats.total
          ? niceMax(Math.max(...stats.sectors.map(s => s.n)) / stats.total) : 0.1;
        const rOf = (share) => r0 + (R - r0) * share / maxShare;
        geom = { cx, cy, R, r0, rOf };

        // Compass spokes and labels
        ctx.lineWidth = 1;
        for (let i = 0; i < 16; i++) {
          const a = rad(i * 22.5);
          ctx.strokeStyle = i % 2 ? 'rgba(238,240,245,0.04)' : 'rgba(238,240,245,0.09)';
          ctx.beginPath();
          ctx.moveTo(cx + r0 * Math.cos(a), cy + r0 * Math.sin(a));
          ctx.lineTo(cx + R * Math.cos(a), cy + R * Math.sin(a));
          ctx.stroke();
        }
        ctx.font = '500 11px "IBM Plex Sans", system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'].forEach((t, i) => {
          const a = rad(i * 45);
          ctx.fillStyle = t === 'N' ? '#eef0f5' : (i % 2 ? WIND_MUTED : '#a3a9b8');
          ctx.fillText(t, cx + (R + 11) * Math.cos(a), cy + (R + 11) * Math.sin(a));
        });

        // Share rings, labeled along the SSE spoke
        const step = maxShare <= 0.1 ? 0.025 : maxShare <= 0.3 ? 0.05 : 0.1;
        ctx.font = '10px "IBM Plex Mono", ui-monospace, monospace';
        const la = rad(157.5);
        for (let s = step; s <= maxShare + 1e-9; s += step) {
          const r = rOf(s);
          ctx.strokeStyle = 'rgba(238,240,245,0.08)';
          ctx.setLineDash(s + step > maxShare + 1e-9 ? [] : [2, 3]);
          ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2 * Math.PI); ctx.stroke();
          ctx.setLineDash([]);
          const label = `${Math.round(s * 1000) / 10} %`;
          const lx = cx + r * Math.cos(la), ly = cy + r * Math.sin(la);
          const tw = ctx.measureText(label).width;
          ctx.fillStyle = 'rgba(17,20,28,0.9)';
          ctx.fillRect(lx - tw / 2 - 2, ly - 6, tw + 4, 12);
          ctx.fillStyle = WIND_MUTED;
          ctx.fillText(label, lx, ly);
        }
        ctx.strokeStyle = 'rgba(238,240,245,0.14)';
        ctx.beginPath(); ctx.arc(cx, cy, r0, 0, 2 * Math.PI); ctx.stroke();

        if (!stats || !stats.total) {
          centerText(ctx, cx, cy, r0, '–', 'no data');
          return;
        }

        // Sector bars: one wedge per sector, classes stacked outward, a
        // surface-colored outline separates the segments
        const half = (22.5 / 2 - 1.6) * Math.PI / 180;
        stats.sectors.forEach((s, i) => {
          if (!s.n) return;
          const a = rad(i * 22.5);
          let acc = 0;
          s.byClass.forEach((n, k) => {
            if (!n) return;
            const rIn = rOf(acc / stats.total);
            acc += n;
            const rOut = rOf(acc / stats.total);
            ctx.beginPath();
            ctx.arc(cx, cy, rOut, a - half, a + half);
            ctx.arc(cx, cy, rIn, a + half, a - half, true);
            ctx.closePath();
            ctx.fillStyle = k < WIND_CLASSES.length ? WIND_CLASSES[k].color : WIND_NO_SPEED.color;
            ctx.fill();
            ctx.strokeStyle = surface;
            ctx.lineWidth = 1.5;
            ctx.stroke();
          });
        });
        ctx.lineWidth = 1;

        centerText(ctx, cx, cy, r0, pct(stats.calm), 'calm');
      }

      function centerText(ctx, cx, cy, r0, big, small) {
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const bigPx = Math.max(11, Math.min(18, Math.round(r0 * 0.45)));
        ctx.fillStyle = '#eef0f5';
        ctx.font = `500 ${bigPx}px "IBM Plex Mono", ui-monospace, monospace`;
        ctx.fillText(big, cx, cy - 5);
        ctx.fillStyle = WIND_MUTED;
        ctx.font = '10px "IBM Plex Sans", system-ui, sans-serif';
        ctx.fillText(small, cx, cy + bigPx * 0.5 + 3);
      }

      // rows: { sensors, meteo } of the selected day
      function update(newTables) {
        tables = newTables;
        refresh();
      }

      // Also after a change of the configured sensors
      function refresh() {
        const usable = (s) => sensorShown(s.sensor);
        if (!usable(WIND_SOURCES[source])) picked = false;
        // Without a choice of the user: the first source that has data
        if (!picked) {
          const has = (s) => usable(s) && tables[s.table].some(d => isNum(s.dir(d)));
          const first = WIND_SOURCES.findIndex(has);
          source = first >= 0 ? first : Math.max(0, WIND_SOURCES.findIndex(usable));
        }
        renderControls();
        compute();
        draw();
      }

      // Tooltip: sector under the pointer, or the calm share in the center
      canvas.addEventListener('mousemove', (e) => {
        if (!geom || !stats || !stats.total) { tip.style.display = 'none'; return; }
        const b = canvas.getBoundingClientRect();
        const dx = e.clientX - b.left - geom.cx, dy = e.clientY - b.top - geom.cy;
        const r = Math.hypot(dx, dy);
        let html = null;
        if (r <= geom.r0) {
          html = `calm (&lt; ${CALM_MS} m/s) · ${pct(stats.calm)} <span>${stats.calm} of ${stats.total} readings, direction not counted</span>`;
        } else if (r <= geom.R + 4) {
          const deg = (Math.atan2(dx, -dy) * 180 / Math.PI + 360) % 360;
          const i = Math.round(deg / 22.5) % 16;
          const s = stats.sectors[i];
          const parts = s.byClass.map((n, k) => n
            ? `${k < WIND_CLASSES.length ? WIND_CLASSES[k].label : WIND_NO_SPEED.label} ${pct(n)}` : null).filter(Boolean);
          html = `${cardinal(i * 22.5)} · ${pct(s.n)} <span>${s.n} of ${stats.total} readings</span>` +
                 (parts.length ? `<br><span>${parts.join(' · ')}</span>` : '');
        }
        if (!html) { tip.style.display = 'none'; return; }
        tip.innerHTML = html;
        tip.style.display = 'block';
        const rb = root.getBoundingClientRect();
        let left = e.clientX - rb.left + 12;
        if (left + tip.offsetWidth > rb.width - 4) left = e.clientX - rb.left - tip.offsetWidth - 12;
        tip.style.left = `${left}px`;
        tip.style.top = `${e.clientY - rb.top + 12}px`;
      });
      canvas.addEventListener('mouseleave', () => { tip.style.display = 'none'; });

      renderControls();
      new ResizeObserver(() => draw()).observe(canvas.parentElement);
      document.fonts?.ready.then(draw);
      return { update, refresh, draw };
    }

    // Points of a direction series for the time chart: s = speed in m/s
    function dirPoints(rows, src) {
      return rows.filter(d => isNum(src.dir(d)))
        .map(d => ({ x: d.timestamp * 1000, y: src.dir(d), s: src.speed(d) }));
    }

    // Wind vane points: colored by Beaufort class like the rose; calm
    // readings (direction kept from before) as gray rings
    function vanePointColor(ctx, part) {
      const k = windClass(ctx.raw?.s);
      if (k === -1) return part === 'fill' ? 'transparent' : WIND_MUTED;
      if (k === null) return ctx.raw ? WIND_NO_SPEED.color : WIND_CLASSES[2].color;
      return WIND_CLASSES[k].color;
    }

    // ══════════════════════════════════════════════════════════════
    //  CLOUD COVER STRIPS
    //  One row per layer in the order of height (high on top), total cover
    //  below a divider. Every forecast hour is a cell, shaded from dark
    //  (clear) to light (overcast). The layers overlap in the sky, so they
    //  are not stacked: 60 % low and 50 % mid can still be 70 % in total.
    // ══════════════════════════════════════════════════════════════
    const CLOUD_ROWS = [
      { label: 'High',  key: 'cloud_high' },
      { label: 'Mid',   key: 'cloud_mid' },
      { label: 'Low',   key: 'cloud_low' },
      { label: 'Total', key: 'cloud_cover' }
    ];
    const CLOUD_CLEAR = [0x1a, 0x20, 0x30];     // 0 %: just above the card
    const CLOUD_OVERCAST = [0xe6, 0xe9, 0xf0];  // 100 %
    const CLOUD_GAP = 2;                         // px between cells and rows
    const CLOUD_DIVIDER = 6;                     // px above the total row
    const CLOUD_KEY_W = 72;                      // width of the color key

    function cloudColor(pct) {
      const t = Math.min(1, Math.max(0, pct / 100));
      const c = CLOUD_CLEAR.map((a, i) => Math.round(a + (CLOUD_OVERCAST[i] - a) * t));
      return `rgb(${c[0]},${c[1]},${c[2]})`;
    }

    // Points of one row: y is the row label (category axis), v the cover
    // (null = missing). Every row keeps every hour, so the tooltip index
    // points to the same hour in all rows.
    function cloudPoints(rows, row) {
      return rows.map(d => ({ x: d.timestamp * 1000, y: row.label,
                              v: isNum(d[row.key]) ? d[row.key] : null }));
    }

    // Typical spacing of the forecast steps (1 h for Open-Meteo)
    function cloudStepMs(data) {
      const steps = [];
      for (let i = 1; i < data.length; i++) steps.push(data[i].x - data[i - 1].x);
      if (!steps.length) return 3600 * 1000;
      steps.sort((a, b) => a - b);
      return steps[Math.floor(steps.length / 2)];
    }

    // Vertical band of a row; the total row is set off by the divider
    function cloudBand(chart, i) {
      const area = chart.chartArea;
      const n = CLOUD_ROWS.length;
      const h = (area.bottom - area.top - CLOUD_DIVIDER) / n;
      const top = area.top + i * h + (i === n - 1 ? CLOUD_DIVIDER : 0);
      return { top: top + CLOUD_GAP / 2, bottom: top + h - CLOUD_GAP / 2 };
    }

    const cloudStripPlugin = {
      id: 'cloudStrips',
      beforeDatasetsDraw(chart) {
        const { ctx, chartArea: area, scales: { x } } = chart;
        ctx.save();
        ctx.beginPath();
        ctx.rect(area.left, area.top, area.right - area.left, area.bottom - area.top);
        ctx.clip();
        chart.data.datasets.forEach((ds, i) => {
          const band = cloudBand(chart, i);
          const half = cloudStepMs(ds.data) / 2;
          ds.data.forEach(p => {
            if (p.v === null) return;
            const x0 = x.getPixelForValue(p.x - half) + CLOUD_GAP / 2;
            const x1 = x.getPixelForValue(p.x + half) - CLOUD_GAP / 2;
            if (x1 <= x0) return;
            ctx.fillStyle = cloudColor(p.v);
            ctx.fillRect(x0, band.top, x1 - x0, band.bottom - band.top);
          });
        });
        ctx.restore();
        // Row labels left of the bands
        ctx.save();
        ctx.font = `${AXIS_TICKS.font.size}px ${Chart.defaults.font.family}`;
        ctx.fillStyle = AXIS_TICKS.color;
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        CLOUD_ROWS.forEach((r, i) => {
          const band = cloudBand(chart, i);
          ctx.fillText(r.label, area.left - 6, (band.top + band.bottom) / 2);
        });
        ctx.restore();
        ctx.save();
        // Divider between the layers and the total
        const n = CLOUD_ROWS.length;
        const y = (cloudBand(chart, n - 2).bottom + cloudBand(chart, n - 1).top) / 2;
        ctx.strokeStyle = 'rgba(255,255,255,0.12)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(area.left, Math.round(y) + 0.5);
        ctx.lineTo(area.right, Math.round(y) + 0.5);
        ctx.stroke();
        ctx.restore();
      },
      // Color key "0 [dark → light] 100 %" at the right end of the title line
      afterDraw(chart) {
        const t = chart.titleBlock;
        if (!t || !t.height) return;
        const { ctx } = chart;
        ctx.save();
        ctx.font = `${AXIS_TICKS.font.size}px ${Chart.defaults.font.family}`;
        ctx.fillStyle = AXIS_TICKS.color;
        ctx.textBaseline = 'middle';
        const y = t.top + t.height / 2;
        const right = chart.chartArea.right;
        const maxText = '100 %';
        const x1 = right - ctx.measureText(maxText).width - 4;
        const x0 = x1 - CLOUD_KEY_W;
        const grad = ctx.createLinearGradient(x0, 0, x1, 0);
        grad.addColorStop(0, cloudColor(0));
        grad.addColorStop(1, cloudColor(100));
        ctx.textAlign = 'left';
        ctx.fillText(maxText, x1 + 4, y);
        ctx.textAlign = 'right';
        ctx.fillText('0', x0 - 4, y);
        ctx.fillStyle = grad;
        ctx.fillRect(x0, y - 4, CLOUD_KEY_W, 8);
        ctx.restore();
      }
    };

    function createCloudChart(id) {
      const datasets = CLOUD_ROWS.map(r => ({
        label: r.label, data: [], showLine: false,
        pointRadius: 0, pointHoverRadius: 0, pointHitRadius: 0,
        borderColor: 'transparent', backgroundColor: 'transparent'
      }));
      return new Chart(document.getElementById(id), {
        type: 'line',
        data: { datasets },
        plugins: [cloudStripPlugin],
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          // All rows come from the same forecast hours: one tooltip per hour
          interaction: { mode: 'index', axis: 'x', intersect: false },
          scales: {
            x: {
              type: 'time',
              time: { unit: 'hour', tooltipFormat: 'HH:mm',
                      displayFormats: { hour: 'HH:mm', minute: 'HH:mm' } },
              ticks: chartTimeTicks({ ...AXIS_TICKS, maxTicksLimit: 8 }),
              grid: { display: false }
            },
            y: {
              type: 'category',
              labels: CLOUD_ROWS.map(r => r.label),
              // Rows and their labels are drawn by the plugin; the scale
              // only reserves the space for the labels
              afterFit: (scale) => { scale.width = 40; },
              ticks: { display: false },
              grid: { display: false },
              border: { display: false }
            }
          },
          plugins: {
            tooltip: {
              callbacks: {
                title: chartTooltipTitle,
                label: (item) => `${item.dataset.label}: ` +
                  (item.raw.v === null ? '–' : `${Math.round(item.raw.v)} %`),
                labelColor: (item) => ({ borderColor: 'rgba(255,255,255,0.3)',
                                         backgroundColor: item.raw.v === null
                                           ? 'transparent' : cloudColor(item.raw.v) })
              }
            },
            title: {
              display: true,
              text: 'Cloud Cover',
              align: 'start',
              color: '#eef0f5',
              font: { size: 12, weight: '600' },
              padding: { top: 6, bottom: 4 }
            },
            legend: { display: false }
          }
        }
      });
    }

    // ══════════════════════════════════════════════════════════════
    //  DATA UPDATE
    // ══════════════════════════════════════════════════════════════
    // Open-Meteo forecast (hourly) and station sensors (every 5 min) share
    // the time axis of the selected local day.
    function updateCharts(meteo, sensors, range) {
      const set = (chart, ...series) => {
        series.forEach((data, i) => { chart.data.datasets[i].data = data; });
      };

      set(charts.chartTemp,
          xy(meteo, d => d.temperature),
          xy(sensors, d => d.temperature));
      set(charts.chartHumidity,
          xy(meteo, d => d.humidity),
          xy(sensors, d => d.humidity));
      set(charts.chartPressure,
          xy(meteo, d => d.pressure_msl),
          xy(meteo, d => d.surface_pressure),
          xy(sensors, d => d.pressure));
      set(charts.chartDewPoint,
          xy(meteo, d => d.dew_point),
          xy(sensors, d => d.dew_point));
      set(charts.chartWindSpeed,
          xy(meteo, d => d.wind_speed_10m),
          xy(sensors, d => isNum(d.wind_speed) ? d.wind_speed * MS_TO_KMH : null),
          xy(sensors, d => isNum(d.ws_wind_speed) ? d.ws_wind_speed * MS_TO_KMH : null));
      set(charts.chartWindDir,
          dirPoints(meteo, WIND_SOURCES[2]),
          dirPoints(sensors, WIND_SOURCES[0]),
          dirPoints(sensors, WIND_SOURCES[1]));
      windRose.update({ sensors, meteo });
      set(charts.chartRainLight,
          xy(sensors, d => d.rainfall),
          xy(sensors, d => d.illuminance));
      set(charts.chartAir,
          xy(sensors, d => d.pm25),
          xy(sensors, d => d.pm10),
          xy(sensors, d => d.noise));
      set(charts.chartCabinet,
          xy(sensors, d => d.cabinet_temperature),
          xy(sensors, d => d.cabinet_dew_point),
          xy(sensors, d => d.cabinet_humidity));
      set(charts.chartClouds, ...CLOUD_ROWS.map(r => cloudPoints(meteo, r)));
      set(charts.chartVisibility,
          xy(meteo, d => isNum(d.visibility) ? d.visibility / 1000 : null));
      set(charts.chartJetstream,
          xy(meteo, d => d.wind_speed_300hPa));

      Object.values(charts).forEach(c => {
        c.options.scales.x.min = range.start;
        c.options.scales.x.max = range.end;
        c.update();
      });
    }

    // ══════════════════════════════════════════════════════════════
    //  LOAD MEASUREMENTS
    // ══════════════════════════════════════════════════════════════
    async function loadMeasurements() {
      const date = document.getElementById("datePicker").value;
      document.getElementById("hdr-date").textContent = date || '–';
      if (!date) return;

      // Meteo, aurora and sensors write one database per UTC day; the day
      // shown can span two of them, fetchDayRows() joins and cuts them.
      const [meteo, sensors] = await Promise.all([
        fetchDayRows('/api/meteo', date),
        fetchDayRows('/api/sensors', date)
      ]);
      updateCharts(meteo, sensors, dayRangeMs(date));
    }

    // ══════════════════════════════════════════════════════════════
    //  LATEST SENSOR READING (latest_sensor_data.json, every 5 min)
    // ══════════════════════════════════════════════════════════════
    function fmt(v, digits) {
      return isNum(v) ? v.toFixed(digits) : '–';
    }

    function compassSvg(deg) {
      if (!isNum(deg)) return '';
      // Arrow points where the wind blows to (meteorological direction + 180°)
      return `<svg class="s-compass" viewBox="0 0 24 24" style="transform: rotate(${(deg + 180) % 360}deg)">
        <circle cx="12" cy="12" r="10.5" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.2"/>
        <path d="M12 3.5 L16 14 L12 11.5 L8 14 Z" fill="#86efac"/>
      </svg>`;
    }

    function tile(label, value, unit, sub = '', warn = false, extra = '') {
      return `<div class="s-tile${warn ? ' s-warn' : ''}">
        <div class="s-label" title="${label}">${label}</div>
        <div class="s-value">${extra}<span>${value}</span><span class="s-unit">${value === '–' ? '' : unit}</span></div>
        <div class="s-sub">${sub || '&nbsp;'}</div>
      </div>`;
    }

    function renderSensorTiles(r) {
      const spread = (t, td) => isNum(t) && isNum(td) ? t - td : null;
      const outSpread = spread(r.temperature, r.dew_point);
      const cabSpread = spread(r.cabinet_temperature, r.cabinet_dew_point);
      // Condensation risk when the surface is less than 3 K above the dew point
      const cabWarn = isNum(cabSpread) && cabSpread < 3;
      const dewWarn = isNum(outSpread) && outSpread < 2;
      const kmh = (v) => isNum(v) ? `${(v * MS_TO_KMH).toFixed(1)} km/h` : '';
      const dirSub = (v) => isNum(v) ? cardinal(v) : '';

      // [sensor, tile]: tiles of sensors that are not configured are left out
      return [
        ['weather', tile('Temperature', fmt(r.temperature, 1), '°C')],
        ['weather', tile('Humidity', fmt(r.humidity, 0), '%')],
        ['weather', tile('Dew point', fmt(r.dew_point, 1), '°C',
             isNum(outSpread) ? `${outSpread.toFixed(1)} K below air${dewWarn ? ' · dew likely' : ''}` : '', dewWarn)],
        ['weather', tile('Pressure', fmt(r.pressure, 0), 'hPa')],
        // Anemometer and vane: 10-minute means (allsky360-sensors)
        ['anemometer', tile('Wind (anemometer)', fmt(r.wind_speed, 1), 'm/s',
             [kmh(r.wind_speed), isNum(r.wind_speed) ? '10-min mean' : ''].filter(Boolean).join(' · '))],
        ['wind_vane', tile('Wind dir (vane)', fmt(r.wind_direction, 0), '°',
             isNum(r.wind_direction) && windClass(r.wind_speed) === -1
               ? `${cardinal(r.wind_direction)} · last direction (calm)` : dirSub(r.wind_direction),
             false, compassSvg(r.wind_direction))],
        ['weather', tile('Wind (weather sensor)', fmt(r.ws_wind_speed, 1), 'm/s',
             [kmh(r.ws_wind_speed), isNum(r.ws_wind_direction) ? `${r.ws_wind_direction.toFixed(0)}° ${cardinal(r.ws_wind_direction)}` : '']
               .filter(Boolean).join(' · '))],
        ['weather', tile('Rain', fmt(r.rainfall, 1), 'mm')],
        ['weather', tile('Illuminance', isNum(r.illuminance) ? Math.round(r.illuminance).toLocaleString() : '–', 'lx')],
        ['weather', tile('Noise', fmt(r.noise, 0), 'dB')],
        ['weather', tile('PM2.5', fmt(r.pm25, 0), 'µg/m³')],
        ['weather', tile('PM10', fmt(r.pm10, 0), 'µg/m³')],
        ['cabinet', tile('Cabinet temp', fmt(r.cabinet_temperature, 1), '°C')],
        ['cabinet', tile('Cabinet humidity', fmt(r.cabinet_humidity, 0), '%')],
        ['cabinet', tile('Cabinet dew point', fmt(r.cabinet_dew_point, 1), '°C',
             isNum(cabSpread) ? `${cabSpread.toFixed(1)} K margin${cabWarn ? ' · condensation risk' : ''}` : '', cabWarn)]
      ].filter(([sensor]) => sensorShown(sensor)).map(([, html]) => html).join('');
    }

    // Hide the chart series of sensors that are not configured; a chart
    // left without any series says so in its title
    function applySensorVisibility() {
      Object.values(charts).forEach((chart) => {
        const sets = chart.data.datasets;
        sets.forEach((ds) => { if (ds.sensor) ds.hidden = !sensorShown(ds.sensor); });
        const title = chart.options.plugins.title;
        chart.$baseTitle ??= title.text;
        const off = sets.length > 0 && sets.every(ds => ds.sensor && !sensorShown(ds.sensor));
        title.text = off ? `${chart.$baseTitle} · sensor not configured` : chart.$baseTitle;
        chart.update('none');
      });
      windRose?.refresh();
    }

    // No header line: the reading time and state are the tooltip of the tiles
    function setSensorStatus(cls, text, age) {
      document.getElementById('sensor-tiles').title = [text, age].filter(Boolean).join(' · ');
    }

    async function loadLatestSensors() {
      const tiles = document.getElementById('sensor-tiles');
      try {
        const res = await fetch('latest_sensor_data.json');
        if (res.status === 404) {
          setSensorStatus('badge-gray', 'no data', '');
          tiles.innerHTML = '<div class="sensor-empty">No sensor reading yet. Set the modbus_*_address keys in config.ini and enable allsky360-sensors.service.</div>';
          return;
        }
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const r = await res.json();
        const ts = isNum(r.timestamp) ? new Date(r.timestamp * 1000) : null;
        const ageS = ts ? Math.max(0, (Date.now() - ts.getTime()) / 1000) : Infinity;
        const ageText = ts
          ? `${formatDateTime(r.timestamp)} · ${ageS < 90 ? 'just now' : Math.round(ageS / 60) + ' min ago'}`
          : '';
        if (ageS > SENSOR_STALE_S)
          setSensorStatus('badge-orange', 'stale', ageText + ' · check allsky360-sensors.service');
        else
          setSensorStatus('badge-green', 'live', ageText);
        const known = r.configured && typeof r.configured === 'object' ? r.configured : null;
        if (JSON.stringify(known) !== JSON.stringify(sensorsConfigured)) {
          sensorsConfigured = known;
          applySensorVisibility();
        }
        tiles.innerHTML = renderSensorTiles(r);
      } catch (err) {
        console.error('Failed to load latest sensor data:', err);
        setSensorStatus('badge-orange', 'error', String(err.message || err));
      }
    }

    // ══════════════════════════════════════════════════════════════
    //  FORECAST (forecast_meteo.json, written every 30 min by the meteo tool)
    // ══════════════════════════════════════════════════════════════
    // Older than this the timer has probably stopped (runs every 30 min)
    const FORECAST_STALE_S = 90 * 60;
    // Thresholds and helpers shared with the dashboard (allsky-common.js)
    const CLEAR_MAX = FORECAST_CLEAR_MAX;
    const CLEAR_MIN_HOURS = FORECAST_CLEAR_MIN_HOURS;
    const RAIN_LIKELY = FORECAST_RAIN_LIKELY;
    const DEW_SPREAD_WARN = FORECAST_DEW_SPREAD_WARN;
    const GUST_WARN = FORECAST_GUST_WARN;
    const span = hourSpanText;
    // water drop in front of the dew spread when dew is likely
    const DROP_ICON = '<svg class="fc-drop" viewBox="0 0 24 30" aria-hidden="true"><path d="M12 1C12 1 2 13 2 19a10 10 0 0 0 20 0C22 13 12 1 12 1z"/></svg>';

    function chip(cls, text, title = '') {
      return `<span class="badge ${cls}"${title ? ` title="${title}"` : ''}>${text}</span>`;
    }

    // Summary of the coming night (the first dark stretch in the forecast)
    function forecastSummary(hours) {
      const chips = [];
      const t = forecastTonight(hours);
      if (t.night) {
        const label = t.night[0] === 0 ? 'Night' : 'Tonight';
        if (t.clear.length)
          chips.push(chip('badge-green', t.clear.map(r => span(t.nightHours, r)).join(', '),
                          `Dark hours with total cloud cover ≤ ${CLEAR_MAX} %, at least ${CLEAR_MIN_HOURS} h`));
        else
          chips.push(chip('badge-gray', `${label}: no clear stretch expected`,
                          `No ${CLEAR_MIN_HOURS} dark hours in a row with total cloud cover ≤ ${CLEAR_MAX} %`));
      }
      if (t.rain)
        chips.push(chip('badge-blue', `Rain likely ${span(hours, t.rain)}`,
                        `Precipitation probability ≥ ${RAIN_LIKELY} %`));
      if (t.maxGust >= GUST_WARN)
        chips.push(chip('badge-orange', `Gusts up to ${t.maxGust.toFixed(0)} km/h`));
      return chips.join('');
    }

    function renderForecastTable(hours) {
      const nowS = Date.now() / 1000;
      const cell = (h, cls, html, title = '') => {
        const night = h.is_day === 0 ? ' night' : '';
        const now = nowS >= h.timestamp && nowS < h.timestamp + 3600 ? ' now' : '';
        return `<div class="fc-c${night}${now} ${cls}"${title ? ` title="${title}"` : ''}>${html}</div>`;
      };
      const cloudCell = (h, v) => {
        if (!isNum(v)) return cell(h, 'fc-dim', '–');
        // dark text on the light colours of overcast sky
        const fg = v >= 60 ? '#111827' : '#eef0f5';
        return cell(h, '', `<span class="fc-cloud" style="background:${cloudCoverToRGB(v)};color:${fg};width:100%;text-align:center">${Math.round(v)}</span>`);
      };
      const row = (label, fn) => `<div class="fc-lbl">${label}</div>` + hours.map(fn).join('');

      const rows = [
        row('Time', h => {
          const t = formatClock(h.timestamp);
          return cell(h, `fc-hour${t === '00:00' ? ' midnight' : ''}`, t, formatDateTime(h.timestamp, { seconds: false }));
        }),
        row('Clouds %', h => cloudCell(h, h.cloud_cover)),
        row('· low', h => cloudCell(h, h.cloud_low)),
        row('· mid', h => cloudCell(h, h.cloud_mid)),
        row('· high', h => cloudCell(h, h.cloud_high)),
        row('Rain %', h => {
          const p = h.precipitation_probability, mm = h.precipitation;
          if (!isNum(p)) return cell(h, 'fc-dim', '–');
          const title = isNum(mm) ? `${mm.toFixed(1)} mm` : '';
          return cell(h, p >= RAIN_LIKELY ? 'fc-rain' : (p === 0 ? 'fc-dim' : ''), p.toFixed(0), title);
        }),
        row('Temp °C', h => cell(h, '', fmt(h.temperature, 1))),
        row('Dew spread', h => {
          if (!isNum(h.temperature) || !isNum(h.dew_point)) return cell(h, 'fc-dim', '–');
          const d = h.temperature - h.dew_point;
          const dew = d < DEW_SPREAD_WARN;
          return cell(h, dew ? 'fc-warn' : '', (dew ? DROP_ICON : '') + d.toFixed(1),
                      `Dew point ${h.dew_point.toFixed(1)} °C, humidity ${fmt(h.humidity, 0)} %` +
                      (dew ? ` · dew risk (less than ${DEW_SPREAD_WARN} K)` : ''));
        }),
        row('Wind km/h', h => cell(h, '', fmt(h.wind_speed_10m, 0),
                                   isNum(h.wind_dir_10m) ? `${h.wind_dir_10m.toFixed(0)}° ${cardinal(h.wind_dir_10m)}` : '')),
        row('Gusts', h => cell(h, isNum(h.wind_gusts_10m) && h.wind_gusts_10m >= GUST_WARN ? 'fc-warn' : '',
                               fmt(h.wind_gusts_10m, 0))),
        row('Jetstream (km/h)', h => {
          const v = h.wind_speed_300hPa;
          if (!isNum(v)) return cell(h, 'fc-dim', '–');
          // same colour scale as the seeing label on the dashboard
          return cell(h, '', `<span style="color:${getSeeingColor(v)};font-weight:500">${v.toFixed(0)}</span>`,
                      'Wind at 300 hPa (9.2 km), rough hint for seeing');
        })
      ];
      const table = document.getElementById('fc-table');
      table.style.setProperty('--fc-cols', hours.length);
      table.innerHTML = rows.join('');
    }

    // Only the title is shown: the state and update time are its tooltip
    function setForecastStatus(cls, text, meta) {
      document.getElementById('fc-title').title = [text, meta].filter(Boolean).join(' · ');
    }

    async function loadForecast() {
      const summary = document.getElementById('fc-summary');
      const table = document.getElementById('fc-table');
      try {
        const res = await fetch('forecast_meteo.json', { cache: 'no-cache' });
        if (res.status === 404) {
          setForecastStatus('badge-gray', 'no data', '');
          summary.innerHTML = '';
          table.innerHTML = '<div class="fc-empty">No forecast yet. allsky360-meteo.service writes it with --forecastfile (every 30 minutes).</div>';
          return;
        }
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const f = await res.json();
        // Drop hours that are already over (the file is up to 30 min old)
        const nowS = Date.now() / 1000;
        const hours = (Array.isArray(f.hours) ? f.hours : [])
          .filter(h => isNum(h.timestamp) && h.timestamp + 3600 > nowS);
        if (!hours.length) throw new Error('no current hours in forecast_meteo.json');

        const ageS = isNum(f.generated) ? Math.max(0, nowS - f.generated) : Infinity;
        const meta = [
          isNum(f.generated) ? `updated ${formatClock(f.generated)} · ${Math.round(ageS / 60)} min ago` : '',
          'Open-Meteo',
          isNum(f.elevation) ? `${f.elevation.toFixed(0)} m` : ''
        ].filter(Boolean).join(' · ');
        if (ageS > FORECAST_STALE_S)
          setForecastStatus('badge-orange', 'stale', meta + ' · check allsky360-meteo.timer');
        else
          setForecastStatus('badge-green', 'current', meta);

        summary.innerHTML = forecastSummary(hours);
        renderForecastTable(hours);
      } catch (err) {
        console.error('Failed to load the forecast:', err);
        setForecastStatus('badge-orange', 'error', String(err.message || err));
      }
    }

    // ══════════════════════════════════════════════════════════════
    //  INIT
    // ══════════════════════════════════════════════════════════════
    function init() {
      const datePicker = document.getElementById("datePicker");
      const today = dayStringInZone();
      datePicker.value = today;
      document.getElementById("hdr-date").textContent = today;
      datePicker.addEventListener("change", loadMeasurements);
      initTimeModeToggle(document.getElementById('time-mode-btn'));
      // Station zone learnt or UTC/local switched: "today" and all labels change
      let shownToday = today;
      window.addEventListener('allsky-timezone-change', () => {
        const t = dayStringInZone();
        if (datePicker.value === shownToday) datePicker.value = t;
        shownToday = t;
        loadMeasurements();
        loadLatestSensors();
        loadForecast();
      });

      const dashed = { borderDash: [5, 4], borderWidth: 1.25 };

      charts.chartTemp = createChart("chartTemp", "Temperature (°C)", [
        line("Forecast", "#f97316", dashed),
        station("Station", "#fb923c", { sensor: "weather" })
      ], "line", true);

      charts.chartHumidity = createChart("chartHumidity", "Relative Humidity (%)", [
        line("Forecast", "#60a5fa", dashed),
        station("Station", "#93c5fd", { sensor: "weather" })
      ], "line", true);

      charts.chartPressure = createChart("chartPressure", "Pressure (hPa)", [
        line("Forecast MSL", "#a3e635", dashed),
        line("Forecast surface", "#22d3ee", dashed),
        station("Station", "#eef0f5", { sensor: "weather" })
      ], "line", true);

      charts.chartDewPoint = createChart("chartDewPoint", "Dew Point (°C)", [
        line("Forecast", "#a3a9b8", dashed),
        station("Station", "#eef0f5", { sensor: "weather" })
      ], "line", true);

      charts.chartWindSpeed = createChart("chartWindSpeed", "Wind Speed (km/h)", [
        line("Forecast 10 m", "#86efac", dashed),
        station("Anemometer", "#4cc38a", { sensor: "anemometer" }),
        station("Weather sensor", "#2dd4bf", { borderWidth: 1.25, sensor: "weather" })
      ], "line", true, { min: 0 });

      // Direction over time: points only (no lines across 0°/360°)
      const dirSet = (label, extra) => ({ label, data: [], showLine: false, borderWidth: 1,
                                          pointRadius: 2.5, pointHoverRadius: 4, ...extra });
      charts.chartWindDir = createChart("chartWindDir", "Wind direction (°)", [
        dirSet("Forecast 10 m", { borderColor: "#fca5a5", backgroundColor: "transparent", pointRadius: 3 }),
        dirSet("Wind vane", { sensor: "wind_vane", borderColor: "#5598e7", backgroundColor: "#5598e7", pointRadius: 3, pointHoverRadius: 5,
                              pointBackgroundColor: (c) => vanePointColor(c, 'fill'),
                              pointBorderColor: (c) => vanePointColor(c, 'border') }),
        dirSet("Weather sensor", { sensor: "weather", borderColor: "#fdba74", backgroundColor: "#fdba74", pointRadius: 2 })
      ], "line", true, {
        min: 0, max: 360,
        ticks: { ...AXIS_TICKS, stepSize: 90, callback: (v) => ({ 0: 'N', 90: 'E', 180: 'S', 270: 'W', 360: 'N' })[v] ?? '' }
      });
      {
        const o = charts.chartWindDir.options;
        o.interaction = { mode: 'nearest', intersect: false };
        o.plugins.legend.labels.usePointStyle = true;
        o.plugins.legend.labels.boxWidth = 6;
        o.plugins.legend.labels.boxHeight = 6;
        o.plugins.tooltip.callbacks.label = (c) => {
          const p = c.raw;
          let text = `${c.dataset.label}: ${p.y.toFixed(0)}° ${cardinal(p.y)}`;
          if (isNum(p.s)) text += ` · ${p.s.toFixed(1)} m/s`;
          if (c.datasetIndex === 1 && windClass(p.s) === -1) text += ' (calm, direction kept)';
          return text;
        };
        charts.chartWindDir.update();
      }

      windRose = createWindRose(document.getElementById('windRose'));

      charts.chartRainLight = createChart("chartRainLight", "Rain (mm) · Illuminance (lx)", [
        station("Rain", "#38bdf8", { type: "bar", backgroundColor: "rgba(56,189,248,0.55)", yAxisID: "y", sensor: "weather" }),
        station("Illuminance", "#facc15", { yAxisID: "y1", sensor: "weather" })
      ], "line", true, { min: 0 }, { title: "lx", min: 0 });

      charts.chartAir = createChart("chartAir", "Air Quality (µg/m³) · Noise (dB)", [
        station("PM2.5", "#c084fc", { yAxisID: "y", sensor: "weather" }),
        station("PM10", "#a78bfa", { yAxisID: "y", borderWidth: 1.25, sensor: "weather" }),
        station("Noise", "#a3a9b8", { yAxisID: "y1", borderDash: [2, 3], borderWidth: 1.25, sensor: "weather" })
      ], "line", true, { min: 0 }, { title: "dB" });

      charts.chartCabinet = createChart("chartCabinet", "Control Cabinet (°C · %)", [
        station("Temperature", "#fb923c", { yAxisID: "y", sensor: "cabinet" }),
        station("Dew point", "#eef0f5", { yAxisID: "y", borderWidth: 1.25, sensor: "cabinet" }),
        station("Humidity", "#60a5fa", { yAxisID: "y1", borderDash: [5, 4], borderWidth: 1.25, sensor: "cabinet" })
      ], "line", true, {}, { title: "%", min: 0, max: 100 });

      charts.chartClouds = createCloudChart("chartClouds");

      charts.chartVisibility = createChart("chartVisibility", "Visibility (km)", [
        line("Visibility", "#fbbf24")
      ]);

      charts.chartJetstream = createChart("chartJetstream", "Jetstream @9.2 km (km/h)", [
        line("Jetstream", "#c084fc")
      ]);

      loadMeasurements();
      loadLatestSensors();
      loadForecast();
      setInterval(loadMeasurements, 60000);
      setInterval(loadLatestSensors, 60000);
      setInterval(loadForecast, 5 * 60000);
    }

    document.addEventListener("DOMContentLoaded", init);

    // ══════════════════════════════════════════════════════════════
    //  GRIDSTACK
    // ══════════════════════════════════════════════════════════════
    document.addEventListener('DOMContentLoaded', () => {
      const gridEl = document.getElementById('meteo-grid');
      const grid = GridStack.init({
        cellHeight: 110,
        disableOneColumnMode: false,
        float: false,
        resizable: { handles: 'all' }
      }, gridEl);

      let gridUnlocked = false;
      const toggleBtn = document.getElementById('toggle-grid-btn');

      grid.enableMove(false);
      grid.enableResize(false);

      window.toggleGridInteraction = function () {
        gridUnlocked = !gridUnlocked;
        if (gridUnlocked) {
          grid.enableMove(true);
          grid.enableResize(true);
          toggleBtn.innerHTML = icon('unlock') + ' Unlocked';
          toggleBtn.classList.remove('badge-gray');
          toggleBtn.classList.add('badge-blue');
        } else {
          grid.enableMove(false);
          grid.enableResize(false);
          toggleBtn.innerHTML = icon('lock') + ' Locked';
          toggleBtn.classList.remove('badge-blue');
          toggleBtn.classList.add('badge-gray');
        }
      };

      // v4: wind rose and direction chart (older saved layouts are ignored)
      const LS_KEY = 'allsky360.meteo1.layout.v4';
      const defaultLayout = [
        { id: "sensor-live",        x: 0, y:  0, w: 12, h: 2 },
        { id: "forecast",           x: 0, y:  2, w: 12, h: 3 },
        { id: "chart-temp",         x: 0, y:  5, w:  6, h: 3 },
        { id: "chart-humidity",     x: 6, y:  5, w:  6, h: 3 },
        { id: "chart-pressure",     x: 0, y:  8, w:  6, h: 3 },
        { id: "chart-dew-point",    x: 6, y:  8, w:  6, h: 3 },
        { id: "chart-wind-speed",   x: 0, y: 11, w:  6, h: 3 },
        { id: "chart-wind-dir",     x: 6, y: 11, w:  6, h: 3 },
        { id: "chart-wind-rose",    x: 0, y: 14, w:  6, h: 4 },
        { id: "chart-rain-light",   x: 6, y: 14, w:  6, h: 4 },
        { id: "chart-air",          x: 0, y: 18, w:  6, h: 3 },
        { id: "chart-clouds",       x: 6, y: 18, w:  6, h: 3 },
        { id: "chart-visibility",   x: 0, y: 21, w:  6, h: 3 },
        { id: "chart-jetstream",    x: 6, y: 21, w:  6, h: 3 },
        { id: "chart-cabinet",      x: 0, y: 24, w:  6, h: 3 }
      ];

      function applyLayout(layout) {
        const byId = Object.fromEntries(
          grid.engine.nodes.map(n => [n.id || n.el.getAttribute('gs-id'), n])
        );
        layout.forEach(l => {
          const node = byId[l.id];
          if (node) grid.update(node.el, { x: l.x, y: l.y, w: l.w, h: l.h });
        });
      }

      function loadLayout() {
        try {
          const raw = localStorage.getItem(LS_KEY);
          if (!raw) return null;
          const parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed : null;
        } catch { return null; }
      }

      function saveLayout() {
        const data = grid.save(true).map(n => ({
          id: n.id || n.el.getAttribute('gs-id'),
          x: n.x, y: n.y, w: n.w, h: n.h
        }));
        try { localStorage.setItem(LS_KEY, JSON.stringify(data)); } catch (_) {}
      }

      window.resetGridLayout = function () {
        applyLayout(defaultLayout);
        try { localStorage.removeItem(LS_KEY); } catch (_) {}
      };

      applyLayout(loadLayout() || defaultLayout);
      grid.on('change', saveLayout);
    });
  </script>
