    <!-- ── METEO MAIN ─────────────────────────────────────────────── -->
    <main id="meteo-main">

      <!-- Controls -->
      <div id="controls-bar">
        <div class="ctrl-group">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8"  y1="2" x2="8"  y2="6"></line>
            <line x1="3"  y1="10" x2="21" y2="10"></line>
          </svg>
          <span class="ctrl-label-text">Date</span>
          <input type="date" id="datePicker" class="ctrl-date" />
        </div>
      </div>

      <!-- GridStack -->
      <div id="meteo-scroll">
        <div class="grid-stack" id="meteo-grid">

          <div class="grid-stack-item" gs-id="chart-temp" gs-x="0" gs-y="0" gs-w="6" gs-h="3">
            <div class="grid-stack-item-content">
              <canvas id="chartTemp"></canvas>
            </div>
          </div>

          <div class="grid-stack-item" gs-id="chart-humidity" gs-x="6" gs-y="0" gs-w="6" gs-h="3">
            <div class="grid-stack-item-content">
              <canvas id="chartHumidity"></canvas>
            </div>
          </div>

          <div class="grid-stack-item" gs-id="chart-pressure" gs-x="0" gs-y="3" gs-w="6" gs-h="3">
            <div class="grid-stack-item-content">
              <canvas id="chartPressure"></canvas>
            </div>
          </div>

          <div class="grid-stack-item" gs-id="chart-dew-point" gs-x="6" gs-y="3" gs-w="6" gs-h="3">
            <div class="grid-stack-item-content">
              <canvas id="chartDewPoint"></canvas>
            </div>
          </div>

          <div class="grid-stack-item" gs-id="chart-clouds" gs-x="0" gs-y="6" gs-w="6" gs-h="3">
            <div class="grid-stack-item-content">
              <canvas id="chartClouds"></canvas>
            </div>
          </div>

          <div class="grid-stack-item" gs-id="chart-global-cloud" gs-x="6" gs-y="6" gs-w="6" gs-h="3">
            <div class="grid-stack-item-content">
              <canvas id="chartGlobalCloud"></canvas>
            </div>
          </div>

          <div class="grid-stack-item" gs-id="chart-visibility" gs-x="0" gs-y="9" gs-w="6" gs-h="3">
            <div class="grid-stack-item-content">
              <canvas id="chartVisibility"></canvas>
            </div>
          </div>

          <div class="grid-stack-item" gs-id="chart-jetstream" gs-x="6" gs-y="9" gs-w="6" gs-h="3">
            <div class="grid-stack-item-content">
              <canvas id="chartJetstream"></canvas>
            </div>
          </div>

          <div class="grid-stack-item" gs-id="chart-wind-speed" gs-x="0" gs-y="12" gs-w="6" gs-h="3">
            <div class="grid-stack-item-content">
              <canvas id="chartWindSpeed"></canvas>
            </div>
          </div>

          <div class="grid-stack-item" gs-id="chart-wind-dir" gs-x="6" gs-y="12" gs-w="6" gs-h="3">
            <div class="grid-stack-item-content">
              <canvas id="chartWindDir"></canvas>
            </div>
          </div>

        </div>

  <script>
    // ══════════════════════════════════════════════════════════════
    //  CHART FACTORY
    // ══════════════════════════════════════════════════════════════
    const charts = {};

    function createChart(id, label, datasets, type = "line", showLegend = false) {
      return new Chart(document.getElementById(id), {
        type,
        data: { labels: [], datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          scales: {
            x: {
              type: 'time',
              time: {
                unit: 'minute',
                tooltipFormat: 'HH:mm',
                displayFormats: { hour: 'HH:mm', minute: 'HH:mm' }
              },
              ticks: { color: '#9ca3af', maxTicksLimit: 8, font: { size: 10 } },
              grid: { color: 'rgba(255,255,255,0.06)' }
            },
            y: {
              ticks: {
                color: '#9ca3af',
                font: { size: 10 },
                callback: (v) => Number.isInteger(v) ? v.toString() : v.toFixed(1)
              },
              grid: { color: 'rgba(255,255,255,0.06)' }
            }
          },
          plugins: {
            title: {
              display: true,
              text: label,
              color: '#e5e7eb',
              font: { size: 12, weight: '600' },
              padding: { top: 6, bottom: 4 }
            },
            legend: {
              display: showLegend,
              labels: { color: '#9ca3af', boxWidth: 2, boxHeight: 2, font: { size: 11 } }
            }
          }
        }
      });
    }

    // ══════════════════════════════════════════════════════════════
    //  DATA UPDATE / CLEAR
    // ══════════════════════════════════════════════════════════════
    function updateCharts(data) {
      const ts = data.map(d => new Date(d.timestamp * 1000));

      charts.chartTemp.data.labels = ts;
      charts.chartTemp.data.datasets[0].data = data.map(d => d.temperature);

      charts.chartHumidity.data.labels = ts;
      charts.chartHumidity.data.datasets[0].data = data.map(d => d.humidity);

      charts.chartPressure.data.labels = ts;
      charts.chartPressure.data.datasets[0].data = data.map(d => d.pressure_msl);
      charts.chartPressure.data.datasets[1].data = data.map(d => d.surface_pressure);

      charts.chartDewPoint.data.labels = ts;
      charts.chartDewPoint.data.datasets[0].data = data.map(d => d.dew_point);

      charts.chartClouds.data.labels = ts;
      charts.chartClouds.data.datasets[0].data = data.map(d => d.cloud_low);
      charts.chartClouds.data.datasets[1].data = data.map(d => d.cloud_mid);
      charts.chartClouds.data.datasets[2].data = data.map(d => d.cloud_high);

      charts.chartGlobalCloud.data.labels = ts;
      charts.chartGlobalCloud.data.datasets[0].data = data.map(d => d.cloud_cover);

      charts.chartVisibility.data.labels = ts;
      charts.chartVisibility.data.datasets[0].data = data.map(d => d.visibility / 1000);

      charts.chartJetstream.data.labels = ts;
      charts.chartJetstream.data.datasets[0].data = data.map(d => d.wind_speed_300hPa);

      charts.chartWindSpeed.data.labels = ts;
      charts.chartWindSpeed.data.datasets[0].data = data.map(d => d.wind_speed_10m);

      charts.chartWindDir.data.labels = ts;
      charts.chartWindDir.data.datasets[0].data = data.map(d => d.wind_dir_10m);

      Object.values(charts).forEach(c => c.update());
    }

    function clearAllCharts() {
      Object.values(charts).forEach(c => {
        c.data.labels = [];
        c.data.datasets.forEach(ds => ds.data = []);
        c.update();
      });
    }

    // ══════════════════════════════════════════════════════════════
    //  LOAD MEASUREMENTS
    // ══════════════════════════════════════════════════════════════
    async function loadMeasurements() {
      const date = document.getElementById("datePicker").value;
      document.getElementById("hdr-date").textContent = date || '–';
      try {
        const res = await fetch(`/api/meteo?date=${date}`);
        if (res.status === 404) { clearAllCharts(); return; }
        if (!res.ok) throw new Error("HTTP " + res.status);
        const json = await res.json();
        if (Array.isArray(json)) updateCharts(json);
        else clearAllCharts();
      } catch (err) {
        console.error("Failed to load meteo data:", err);
        clearAllCharts();
      }
    }

    // ══════════════════════════════════════════════════════════════
    //  INIT
    // ══════════════════════════════════════════════════════════════
    function init() {
      const datePicker = document.getElementById("datePicker");
      const today = new Date().toISOString().slice(0, 10);
      datePicker.value = today;
      document.getElementById("hdr-date").textContent = today;
      datePicker.addEventListener("change", loadMeasurements);

      charts.chartTemp = createChart("chartTemp", "Temperature (°C)", [
        { label: "Temperature", data: [], borderColor: "#f97316", fill: false, pointRadius: 0, tension: 0.15 }
      ]);

      charts.chartHumidity = createChart("chartHumidity", "Relative Humidity (%)", [
        { label: "Humidity", data: [], borderColor: "#60a5fa", fill: false, pointRadius: 0, tension: 0.15 }
      ]);

      charts.chartPressure = createChart("chartPressure", "Pressure (hPa)", [
        { label: "MSL",     data: [], borderColor: "#a3e635", fill: false, pointRadius: 0, tension: 0.15 },
        { label: "Surface", data: [], borderColor: "#22d3ee", fill: false, pointRadius: 0, tension: 0.15 }
      ], "line", true);

      charts.chartDewPoint = createChart("chartDewPoint", "Dew Point (°C)", [
        { label: "Dew point", data: [], borderColor: "#e5e7eb", fill: false, pointRadius: 0, tension: 0.15 }
      ]);

      charts.chartClouds = createChart("chartClouds", "Cloud Cover by Layer (%)", [
        { label: "Low",  data: [], borderColor: "#6b7280", fill: false, pointRadius: 0, tension: 0.15 },
        { label: "Mid",  data: [], borderColor: "#9ca3af", fill: false, pointRadius: 0, tension: 0.15 },
        { label: "High", data: [], borderColor: "#e5e7eb", fill: false, pointRadius: 0, tension: 0.15 }
      ], "line", true);

      charts.chartGlobalCloud = createChart("chartGlobalCloud", "Total Cloud Cover (%)", [
        { label: "Cloud cover", data: [], backgroundColor: "rgba(125,211,252,0.55)", borderColor: "rgba(125,211,252,0.85)", pointRadius: 0 }
      ], "bar");

      charts.chartVisibility = createChart("chartVisibility", "Visibility (km)", [
        { label: "Visibility", data: [], borderColor: "#fbbf24", fill: false, pointRadius: 0, tension: 0.15 }
      ]);

      charts.chartJetstream = createChart("chartJetstream", "Jetstream @9.2 km (km/h)", [
        { label: "Jetstream", data: [], borderColor: "#c084fc", fill: false, pointRadius: 0, tension: 0.15 }
      ]);

      charts.chartWindSpeed = createChart("chartWindSpeed", "Wind Speed 10 m (km/h)", [
        { label: "Wind speed", data: [], borderColor: "#86efac", fill: false, pointRadius: 0, tension: 0.15 }
      ]);

      charts.chartWindDir = createChart("chartWindDir", "Wind Direction 10 m (°)", [
        { label: "Wind direction", data: [], borderColor: "#fca5a5", fill: false, pointRadius: 0, tension: 0.15 }
      ]);

      loadMeasurements();
      setInterval(loadMeasurements, 60000);
    }

    document.addEventListener("DOMContentLoaded", init);

    // ══════════════════════════════════════════════════════════════
    //  GRIDSTACK
    // ══════════════════════════════════════════════════════════════
    document.addEventListener('DOMContentLoaded', () => {
      const gridEl = document.getElementById('meteo-grid');
      const grid = GridStack.init({
        cellHeight: 110,
        disableOneColumnMode: false,
        float: false,
        resizable: { handles: 'all' }
      }, gridEl);

      let gridUnlocked = false;
      const toggleBtn = document.getElementById('toggle-grid-btn');

      grid.enableMove(false);
      grid.enableResize(false);

      window.toggleGridInteraction = function () {
        gridUnlocked = !gridUnlocked;
        if (gridUnlocked) {
          grid.enableMove(true);
          grid.enableResize(true);
          toggleBtn.textContent = '🔓 Unlocked';
          toggleBtn.classList.remove('badge-gray');
          toggleBtn.classList.add('badge-blue');
        } else {
          grid.enableMove(false);
          grid.enableResize(false);
          toggleBtn.textContent = '🔒 Locked';
          toggleBtn.classList.remove('badge-blue');
          toggleBtn.classList.add('badge-gray');
        }
      };

      const LS_KEY = 'allsky360.meteo1.layout.v1';
      const defaultLayout = [
        { id: "chart-temp",         x: 0, y: 0,  w: 6, h: 3 },
        { id: "chart-humidity",     x: 6, y: 0,  w: 6, h: 3 },
        { id: "chart-pressure",     x: 0, y: 3,  w: 6, h: 3 },
        { id: "chart-dew-point",    x: 6, y: 3,  w: 6, h: 3 },
        { id: "chart-clouds",       x: 0, y: 6,  w: 6, h: 3 },
        { id: "chart-global-cloud", x: 6, y: 6,  w: 6, h: 3 },
        { id: "chart-visibility",   x: 0, y: 9,  w: 6, h: 3 },
        { id: "chart-jetstream",    x: 6, y: 9,  w: 6, h: 3 },
        { id: "chart-wind-speed",   x: 0, y: 12, w: 6, h: 3 },
        { id: "chart-wind-dir",     x: 6, y: 12, w: 6, h: 3 }
      ];

      function applyLayout(layout) {
        const byId = Object.fromEntries(
          grid.engine.nodes.map(n => [n.id || n.el.getAttribute('gs-id'), n])
        );
        layout.forEach(l => {
          const node = byId[l.id];
          if (node) grid.update(node.el, { x: l.x, y: l.y, w: l.w, h: l.h });
        });
      }

      function loadLayout() {
        try {
          const raw = localStorage.getItem(LS_KEY);
          if (!raw) return null;
          const parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed : null;
        } catch { return null; }
      }

      function saveLayout() {
        const data = grid.save(true).map(n => ({
          id: n.id || n.el.getAttribute('gs-id'),
          x: n.x, y: n.y, w: n.w, h: n.h
        }));
        try { localStorage.setItem(LS_KEY, JSON.stringify(data)); } catch (_) {}
      }

      window.resetGridLayout = function () {
        applyLayout(defaultLayout);
        try { localStorage.removeItem(LS_KEY); } catch (_) {}
      };

      applyLayout(loadLayout() || defaultLayout);
      grid.on('change', saveLayout);
    });
  </script>

</body>
