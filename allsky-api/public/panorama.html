<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Allsky360 Viewer</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />

  <link rel="manifest" href="manifest.json" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Allsky360 Viewer">
  <meta name="theme-color" content="#111111" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="style.css">
  <script src="js/allsky-common.js"></script>
</head>

<body>
  <div id="header">
    <div class="title-icon">
      <img src="allsky360_256x256.png" alt="Allsky Icon" width="32" height="32" />
      <h1>Allsky360 Panorama</h1>
    </div>

    <!-- Hamburger Menu Button -->
    <button id="hamburger-menu-btn" class="hamburger-menu-btn" onclick="toggleHamburgerMenu()">
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>

    <!-- Navigation Menu -->
    <nav id="nav-menu" class="nav-menu">
      <ul class="nav-list" id="nav-list"></ul>
      <script>renderTextNav(document.getElementById('nav-list'), [{ href: 'panorama.html', title: 'Panorama' }, { href: 'processing.html', title: 'Processing' }]);</script>
    </nav>
  </div>
  <div id="subheader">
    <div class="settings-group">

      <button onclick="zoomIn()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="11" y1="8" x2="11" y2="14"></line>
          <line x1="8" y1="11" x2="14" y2="11"></line>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
      <button onclick="zoomOut()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="8" y1="11" x2="14" y2="11"></line>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
      <button onclick="resetZoomAndPan()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"></polyline>
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
        </svg>
      </button>

      <label style="align-items: center; gap: 0.3rem;">
        <input type="checkbox" id="overlayToggle" onchange="toggleOverlay()" checked>
        Crosshair
      </label>
    </div>
  </div>
  <div id="container">
    <div id="image-container">
      <div style="position: relative;">
        <img id="image" src="" alt="Allsky image" style="display: block; width: 100%;" />
        <canvas id="overlay" style="position: absolute; top: 0; left: 0;"></canvas>
      </div>
      <div id="histogram-container">
        <canvas id="histogram" width="512" height="100"
          style="margin-top: 0.5rem; background: #222; border: 1px solid #444;"></canvas>
        <div id="histogram-stats" style="font-size: 0.8rem; color: #aaa; margin-top: 0.3rem;"></div>
      </div>
      <div id="countdown">Next update in <span id="timer">10</span> s</div>

    </div>
    <div id="metadata">Loading metadata...</div>
  </div>

  <script>
    const imageEl = document.getElementById("image");
    const metadataEl = document.getElementById("metadata");
    const timerEl = document.getElementById("timer");

    let latestImagePath = "";
    let refreshInterval = 10;
    let loading = false;
    let loadingConfig = false;
    const exposureImgs = [];
    let maxHdrImages = 5;
    let lastImageLoadTime = Date.now();
    let timerTimeout = null;
    let mean_target = 0;
    let mean_brightness = 0;
    let useLogHistogram = false;
    let mouseX = null;
    let mouseY = null;
    let zoomFactor = 1.0;
    let panX = 0;
    let panY = 0;
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;

    // Crosshair-Kreis-Overlay-Einstellungen
    let isSouthernHemisphere = false;       // true = Südhalbkugel (Beschriftung gegen Uhrzeigersinn)
    let showGrid = true;
    let longitude = 0.0;
    let latitude = 0;
    let altitude = 0.0;

    const img = document.getElementById("image");
    const container = document.getElementById("image-container");

    container.addEventListener("mousedown", (event) => {
      isDragging = true;
      dragStartX = event.clientX - panX;
      dragStartY = event.clientY - panY;
    });

    container.addEventListener("mousemove", (event) => {
      if (isDragging) {
        panX = event.clientX - dragStartX;
        panY = event.clientY - dragStartY;
        updateZoomAndPan();
      }
    });

    container.addEventListener("mouseup", () => {
      isDragging = false;
    });

    container.addEventListener("mouseleave", () => {
      isDragging = false;
    });

    function updateZoomAndPan() {
      const img = document.getElementById("image");
      img.style.transformOrigin = "center center"; // WICHTIG!
      img.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomFactor})`;
    }

    function zoomIn() {
      zoomFactor *= 1.2;
      updateZoomAndPan();
    }

    function zoomOut() {
      zoomFactor /= 1.2;
      updateZoomAndPan();
    }

    function resetZoomAndPan() {
      zoomFactor = 1.0;
      panX = 0;
      panY = 0;
      updateZoomAndPan();
    }

    function toggleOverlay() {
      const overlayCheckbox = document.getElementById("overlayToggle");
      showOverlay = overlayCheckbox.checked;
      showGrid = overlayCheckbox.checked;
      updateOverlay();
    }


    async function loadConfig() {
      if (loadingConfig) return;
      loadingConfig = true;

      const configData = await fetchConfig();
      if (!configData) { loadingConfig = false; return; }

      longitude = configData.longitude;
      latitude = configData.location_latitude;
      altitude = configData.altitude;
      isSouthernHemisphere = latitude < 0.0;

      loadingConfig = false;
    }

    async function loadLatestImage() {
      if (loading)
        return;  // Verhindert parallele Ladeversuche
      loading = true;

      const latestImagePath = 'api/latest_image';
      let latestImageData = null;
      try {
        const latestImageResponse = await fetch(latestImagePath, { cache: "no-cache" });
        latestImageData = await latestImageResponse.json();
        const todayStr = latestImageData.date;
        const imageTimeStr = latestImageData.image;
        const hdrTimeStr = latestImageData.hdr;
        const panoramaTimeStr = latestImageData.panorama;
        const imageFiletype = latestImageData.filetype;
        const imageDateTime = `${todayStr}${panoramaTimeStr}`;

        originalImageSrc = `images/${todayStr}/panorama-${imageDateTime}.${imageFiletype}`;
        imageEl.src = originalImageSrc;

        // Bild-Metadaten laden
        const imageMetaPath = `images/${todayStr}/image-${imageDateTime}.json`;
        let imageMeta = null;
        try {
          const imgMetaResp = await fetch(imageMetaPath, { cache: "no-cache" });
          imageMeta = await imgMetaResp.json();
        } catch (e) {
          console.warn("⚠️ Image metadata not found:", imageMetaPath);
        }

        // Wetter-Metadaten laden
        const weatherMetaPath = `images/latest_weather_data.json`;
        let weatherMeta = null;
        try {
          const weatherResp = await fetch(weatherMetaPath, { cache: "no-cache" });
          weatherMeta = await weatherResp.json();
        } catch (e) {
          console.warn("⚠️ Weather metadata not found:", weatherMetaPath);
        }


        imageEl.onload = () => {
          updateOverlay();
          updateHistogram();
          loading = false;
        };

        imageEl.onerror = () => {
          console.error("❌ Image load error:", latestImagePath);
          loading = false;
        };

        // Wenn keine Bildmetadaten vorhanden sind, keine weitere Anzeige
        if (!imageMeta) {
          metadataEl.innerHTML = "";
          return;
        }

        maxHdrImages = imageMeta.hdr;
        mean_target = imageMeta.target_brightness;
        mean_brightness = imageMeta.mean_brightness;


        refreshInterval = (typeof imageMeta.capture_interval === "number" && imageMeta.capture_interval > 0)
          ? Math.round(imageMeta.capture_interval)
          : 10;

        lastImageLoadTime = Date.now();
        timerEl.textContent = refreshInterval;
        restartTimer();

        let html = `
      <div class="metadata-section">
        <h2>Image data</h2>
        <b>Timestamp:</b> ${formatTimestamp(imageMeta.timestamp)}<br>
        <b>Exposure t0 (s):</b> ${imageMeta.exposure_t0.toFixed(5)}<br>`;
        if (imageMeta.hdr > 1) {
          html += `
        <b>Exposure t1 (s):</b> ${imageMeta.exposure_t1.toFixed(5)}<br>`;
        }
        if (imageMeta.hdr > 2) {
          html += `
        <b>Exposure t2 (s):</b> ${imageMeta.exposure_t2.toFixed(5)}<br>`;
        }
        if (imageMeta.hdr > 3) {
          html += `
        <b>Exposure t3 (s):</b> ${imageMeta.exposure_t3.toFixed(5)}<br>`;
        }
        if (imageMeta.hdr > 4) {
          html += `
        <b>Exposure t4 (s):</b> ${imageMeta.exposure_t4.toFixed(5)}<br>`;
        }
        html += `
        <b>Gain:</b> ${imageMeta.gain.toFixed(1)}<br>`;
        if (imageMeta.night_mode) {
          html += `
        <b>Background noise t0:</b> ${imageMeta.sigma_noise_t0.toFixed(8)}<br>
        <b>Background noise t1:</b> ${imageMeta.sigma_noise_t1.toFixed(8)}<br>
        <b>Background noise t2:</b> ${imageMeta.sigma_noise_t2.toFixed(8)}<br>
        <b>Background noise t3:</b> ${imageMeta.sigma_noise_t3.toFixed(8)}<br>
        <b>Background noise t4:</b> ${imageMeta.sigma_noise_t4.toFixed(8)}<br>`;
        }
        html += `
        <b>Sensor temperature (°C):</b> ${imageMeta.sensor_temperature.toFixed(1)}<br>
        <b>Brightness:</b> ${imageMeta.mean_brightness.toFixed(2)} -> ${imageMeta.target_brightness.toFixed(2)}<br>`;

        if (imageMeta.night_mode) {
          html += `
    	    <b>Star count:</b> ${imageMeta.stars}<br>
    	    <b>SQM (mag/arcs^2):</b> ${imageMeta.sqm.toFixed(1)}<br>`;
        }
        html += `
        <b>Capture interval (s):</b> ${imageMeta.capture_interval}<br>
        <b>Night mode:</b> ${getSymbol(imageMeta.night_mode)}<br>
        <b>HDR:</b> ${imageMeta.hdr}<br>
      </div>`;

        html += `
      <div class="metadata-section">
        <h2>Location</h2>
        <b>Longitude:</b> ${longitude.toFixed(4)}<br>
        <b>Latitude:</b> ${latitude.toFixed(4)}<br>
        <b>Altitude:</b> ${altitude}m<br>
        <a href="https://maps.google.com/?q=${latitude},${longitude}" target="_blank" style="color: #4af; text-decoration: underline;">→ Go to Google Maps</a><br>
      </div>`;

        html += `
              <div class="metadata-section">
                <h2>Environment</h2>
                <b>Moon phase (%):</b> ${imageMeta.moon_phase_percentage.toFixed(1)}<br>
                <b>Moon altitude (°):</b> ${imageMeta.moon_altitude.toFixed(1)}<br>
                <b>Sun altitude (°):</b> ${imageMeta.sun_altitude.toFixed(1)}<br>
              </div>`;

        if (weatherMeta) {
          html += `
      <div class="metadata-section">
        <h2>Weather</h2>
        <b>Temperature (°C):</b> ${weatherMeta.temperature.toFixed(1)}<br>
        <b>Humidity (%):</b> ${weatherMeta.humidity.toFixed(1)}<br>
        <b>Dew point (°C):</b> ${weatherMeta.dew_point.toFixed(1)}<br>
        <b>Pressure MSL (hPa):</b> ${weatherMeta.pressure_msl.toFixed(1)}<br>
        <b>Surface pressure (hPa):</b> ${weatherMeta.surface_pressure.toFixed(1)}<br>
        <b>Cloud low (%):</b> ${weatherMeta.cloud_low.toFixed(1)}
	<span style="display:inline-block; width: 1.5em; height: 1em; background-color: ${cloudCoverToRGB(weatherMeta.cloud_low)};"></span><br>
        <b>Cloud mid (%):</b> ${weatherMeta.cloud_mid.toFixed(1)}
	<span style="display:inline-block; width: 1.5em; height: 1em; background-color: ${cloudCoverToRGB(weatherMeta.cloud_mid)};"></span><br>
        <b>Cloud high (%):</b> ${weatherMeta.cloud_high.toFixed(1)}
	<span style="display:inline-block; width: 1.5em; height: 1em; background-color: ${cloudCoverToRGB(weatherMeta.cloud_high)};"></span><br>
        <b>Visibility (km):</b> ${weatherMeta.visibility.toFixed(0) * 0.001}<br>
        <b>Wind speed 10 m (km/h):</b> ${(weatherMeta.wind_speed_10m).toFixed(1)}<br>
        <b>Wind direction 10 m (°):</b> ${weatherMeta.wind_dir_10m.toFixed(0)}<br>
        <b>Jetstream @9.2km (km/h):</b> ${(weatherMeta.wind_speed_300hPa).toFixed(1)} ${getSeeingLabel(weatherMeta.wind_speed_300hPa)}
      </div>`;
        }

        metadataEl.innerHTML = html;
      } catch (err) {
        console.error("⚠️ Unexpected load error:", err);
        loading = false;
      }
    }

    function tick() {
      const now = Date.now();
      const elapsedSeconds = Math.floor((now - lastImageLoadTime) / 1000);

      const remaining = Math.max(refreshInterval - elapsedSeconds, 0);
      timerEl.textContent = remaining;

      if (remaining <= 0 && !loading) {
        loadLatestImage();
        lastImageLoadTime = Date.now();
      }

      // Nächsten Tick anfordern
      timerTimeout = setTimeout(tick, 1000);
    }

    function restartTimer() {
      if (timerTimeout !== null) {
        clearTimeout(timerTimeout);
      }
      lastImageLoadTime = Date.now();
      tick();
    }

    function updateOverlay() {
      const canvas = document.getElementById("overlay");
      const img = document.getElementById("image");

      canvas.width = img.clientWidth;
      canvas.height = img.clientHeight;
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);


      // Azimut-Skala für Panorama-Modus
      ctx.fillStyle = "red";
      ctx.strokeStyle = "red";
      ctx.lineWidth = 1;
      ctx.font = "12px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "top";

      const directions = [
        { label: "N", deg: 0 },
        { label: "NE", deg: 45 },
        { label: "E", deg: 90 },
        { label: "SE", deg: 135 },
        { label: "S", deg: 180 },
        { label: "SW", deg: 225 },
        { label: "W", deg: 270 },
        { label: "NW", deg: 315 },
        { label: "N", deg: 360 }
      ];

      const width = canvas.width;
      const height = canvas.height;

      // Horizontale Richtungen mit Marken
      directions.forEach(dir => {
        const x = (dir.deg / 360) * width;
        ctx.beginPath();
        ctx.moveTo(x, height - 12);
        ctx.lineTo(x, height);
        ctx.stroke();
        ctx.fillText(dir.label, x, height - 24);
      });

      // Vertikale Skala (rechts): 0° unten, 90° oben (ohne Beschriftung bei 0° und 90°)
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      for (let i = 0; i <= 90; i += 15) {
        const y = height - (i / 90) * height;
        ctx.beginPath();
        ctx.moveTo(width - 8, y);
        ctx.lineTo(width, y);
        ctx.stroke();
        if (i !== 0 && i !== 90) {
          ctx.fillText(`${i}°`, width - 10, y);
        }
      }

      // Vertikale Skala (links): 0° unten, 90° oben (ohne Beschriftung bei 0° und 90°)
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      for (let i = 0; i <= 90; i += 15) {
        const y = height - (i / 90) * height;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(8, y);
        ctx.stroke();
        if (i !== 0 && i !== 90) {
          ctx.fillText(`${i}°`, 10, y);
        }
      }


      // Mauskoordinaten anzeigen
      if (mouseX !== null && mouseY !== null) {
        const scaleX = img.clientWidth / img.naturalWidth;
        const scaleY = img.clientHeight / img.naturalHeight;
        const imageX = mouseX / scaleX;
        const imageY = mouseY / scaleY;

        ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
        ctx.font = "12px sans-serif";
        ctx.textAlign = "right";
        ctx.textBaseline = "top";
        const text = `X: ${Math.round(imageX)}, Y: ${Math.round(imageY)}`;
        ctx.fillText(text, canvas.width - 10, 10);
      }

    }

    const canvas = document.getElementById("overlay");

    canvas.addEventListener("mousemove", (event) => {
      const rect = canvas.getBoundingClientRect();
      mouseX = event.clientX - rect.left;
      mouseY = event.clientY - rect.top;
      updateOverlay();
    });

    canvas.addEventListener("mouseleave", () => {
      mouseX = null;
      mouseY = null;
      updateOverlay();
    });

    function updateHistogram() {
      const img = document.getElementById("image");
      const histCanvas = document.getElementById("histogram");
      const histCtx = histCanvas.getContext("2d");

      // Leeres Offscreen-Canvas anlegen in Größe wie aktuell angezeigtes Bild
      const tmpCanvas = document.createElement("canvas");
      tmpCanvas.width = img.clientWidth;
      tmpCanvas.height = img.clientHeight;
      const tmpCtx = tmpCanvas.getContext("2d");

      // Bild in das temp-Canvas zeichnen
      tmpCtx.drawImage(img, 0, 0, tmpCanvas.width, tmpCanvas.height);
      const imgData = tmpCtx.getImageData(0, 0, tmpCanvas.width, tmpCanvas.height);
      const data = imgData.data;

      // Einfaches Luminanz-Histogramm (0..255)
      const bins = 256;
      const histogram = new Array(bins).fill(0);

      for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];
        // Pixel mit RGB=0 ignorieren
        if (r === 0 && g === 0 && b === 0) continue;
        // Luminanz berechnen (vereinfachte sRGB Formel)
        const luminance = Math.round(0.2126 * r + 0.7152 * g + 0.0722 * b);
        histogram[luminance]++;
      }

      // Linear oder logarithmisch normieren
      histCtx.clearRect(0, 0, histCanvas.width, histCanvas.height);

      const maxCount = Math.max(...histogram);
      const barWidth = histCanvas.width / bins;

      // Balken zeichnen
      for (let i = 0; i < bins; i++) {
        const value = histogram[i];
        let h = 0;

        if (useLogHistogram) {
          const logMax = Math.log10(maxCount + 1);
          const logValue = Math.log10(value + 1);
          h = (logValue / logMax) * histCanvas.height;
        } else {
          h = (value / maxCount) * histCanvas.height;
        }

        histCtx.fillStyle = "#4af";
        histCtx.fillRect(i * barWidth, histCanvas.height - h, barWidth, h);
      }

      // Grünen Balken für mean_target einzeichnen:
      const targetPosition = Math.min(Math.max(mean_target * 255, 0), 255);
      const xTarget = (targetPosition / bins) * histCanvas.width;

      histCtx.strokeStyle = "green";
      histCtx.lineWidth = 2;
      histCtx.beginPath();
      histCtx.moveTo(xTarget, 0);
      histCtx.lineTo(xTarget, histCanvas.height);
      histCtx.stroke();

      // Roten Balken für mean_brightness einzeichnen:
      const brightnessPosition = Math.min(Math.max(mean_brightness * 255, 0), 255);
      const xBrightness = (brightnessPosition / bins) * histCanvas.width;

      histCtx.strokeStyle = "red";
      histCtx.lineWidth = 2;
      histCtx.beginPath();
      histCtx.moveTo(xBrightness, 0);
      histCtx.lineTo(xBrightness, histCanvas.height);
      histCtx.stroke();

      const statsEl = document.getElementById("histogram-stats");
      let minVal = 255;
      let maxVal = 0;
      for (let i = 0; i < bins; i++) {
        if (histogram[i] > 1) {
          if (i < minVal) minVal = i;
          if (i > maxVal) maxVal = i;
        }
      }

      const brightnessValue = (mean_brightness * 255).toFixed(1);
      const targetValue = (mean_target * 255).toFixed(1);

      statsEl.textContent = `min: ${minVal}   max: ${maxVal}   Brightness: ${brightnessValue} -> ${targetValue}`;

    }

    // Reagiere auf Fenster-Resize → Overlay anpassen
    window.addEventListener("resize", updateOverlay);

    // Initialer Start
    loadConfig();
    loadLatestImage();
    restartTimer();
  </script>

</body>

</html>
